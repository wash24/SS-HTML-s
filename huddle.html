<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Huddle">
<meta name="theme-color" content="#4a4a4d">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Huddle Sports App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Kaushan+Script&family=Roboto+Condensed:wght@400;700&display=swap">
<style>
/* Layout: 2015-era sports stream app — score ticker on top, full-bleed story cards, team-color tile rail, three-tab bar fixed at the bottom */
:root{
  --chrome:#2b2b2d;      /* app chrome / card body */
  --chrome-2:#3a3a3d;    /* raised strips */
  --ink:#141415;         /* deepest bg */
  --paper:#f2f2f0;       /* primary text */
  --mute:#a3a3a6;        /* timestamps, labels */
  --flame:#e8542a;       /* the one accent: active tab */
  --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue Condensed",sans-serif;
  --font-body:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --font-script:"Kaushan Script","Brush Script MT","Segoe Script",cursive;
  --bar:#3c3c3f;         /* header bar */
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--chrome);position:relative;overflow:hidden}

/* ---------- Top games ticker ---------- */
/* Ticker sits on a charcoal band darker than the header, with room above and a dark gutter before the stream */
.ticker{background:#242426;display:flex;align-items:stretch;gap:0;flex:none;position:relative;padding:8px 0 9px;box-shadow:inset 0 3px 5px -2px rgba(0,0,0,.65), inset 0 -1px 0 rgba(255,255,255,.04);border-bottom:4px solid var(--ink)}
.ticker-label{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a9a9ad;font-size:10px;padding:0 2px 0 5px;flex:none;display:flex;align-items:center;justify-content:center}
.ticker-rail{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 6px 0 3px;gap:5px;scrollbar-width:none;flex:1;min-width:0}
.ticker-rail::-webkit-scrollbar{display:none}
.appbar{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:50px;background:linear-gradient(180deg,#46464a,var(--bar));border-bottom:0;padding:0 max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px))}
.appbar .icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff}
.appbar .icon svg{width:22px;height:22px}
.wordmark{justify-self:center;display:flex;align-items:baseline;gap:3px;line-height:1;white-space:nowrap;user-select:none}
.wordmark b{font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:.04em;color:#fff;text-transform:uppercase}
.wordmark i{font-family:var(--font-script);font-style:normal;font-size:24px;color:var(--flame);transform:rotate(-4deg) translateY(1px);display:inline-block;text-shadow:0 1px 0 rgba(0,0,0,.35)}
/* 3.5 cards visible on a phone before scrolling: (app width - label - padding - 3 gaps) / 3.5 */
.game{flex:none;width:clamp(86px,calc((min(100vw,480px) - 46px) / 3.5),124px);scroll-snap-align:start;display:flex;flex-direction:column;font-family:var(--font-display);border-radius:2px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.game-status{background:#3a3a3d;font-size:10px;letter-spacing:.03em;line-height:1;padding:4px 5px 3px;color:#fff;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.team-row{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;height:21px;padding:0 5px 0 24px;font-size:12.5px;line-height:1;gap:3px;font-variant-numeric:tabular-nums}
/* Logo is oversized and pushed off the left edge so only its right side shows, clipped top/bottom/left by the row */
.team-row .mono{position:absolute;left:-13px;top:50%;width:34px;height:34px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;pointer-events:none}
.team-row .mono img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(1px 0 1px rgba(0,0,0,.35))}
.team-row .mono.txt{justify-content:flex-end;font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:-.02em;color:rgba(255,255,255,.3);padding-right:0}
.team-row .ab,.team-row .sc,.team-row .rec{position:relative;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.team-row .ab{font-weight:400;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.team-row .rk{font-size:8.5px;opacity:.8;margin-right:2px}
.team-row .sc{font-weight:500;min-width:16px;font-size:13px;text-align:right}
.team-row .rec{font-size:10px;font-weight:300;opacity:.85;margin-left:2px;top:-1.1px}  /* lift the smaller record so it centers on the abbreviation instead of sitting on its baseline */
.team-row.loser{opacity:.62}

/* ---------- Views ---------- */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none!important}

/* story card */
.card{background:var(--chrome);border-bottom:6px solid var(--ink)}
.card-head{display:flex;align-items:flex-end;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.card-head .src{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:13px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.src-chip{min-width:22px;height:22px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff;border-radius:3px}
.card h2{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.08;margin:0;letter-spacing:.005em;text-wrap:balance;flex:1;min-width:0}
.card .ago{font-family:var(--font-display);font-size:18px;color:var(--mute);flex:none;align-self:flex-start;padding-top:22px}
.headline-wrap{display:flex;gap:10px;padding:0 max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}

.hero{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:#101014}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .art{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.hero .over{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--font-display);text-transform:uppercase}
.hero .over b{display:block;font-size:clamp(30px,10vw,46px);font-weight:700;letter-spacing:.02em;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero .over span{display:block;font-size:clamp(14px,4.4vw,20px);letter-spacing:.18em;font-weight:400;opacity:.85;margin-top:4px}

.actions{display:grid;grid-template-columns:repeat(4,1fr) 44px;background:var(--chrome-2);font-family:var(--font-display);font-size:15px;color:#cfcfd2}
.actions button{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 0}
.actions svg{width:17px;height:17px;fill:currentColor}
.actions button[aria-pressed="true"]{color:#ffc93a}

/* team tile rail */
.rail{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--ink);scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
/* 5 cards + a thin sliver of the 6th: (screen - rail padding & gaps - sliver) / 5 */
.tile{flex:none;width:clamp(64px,calc((min(100vw,480px) - 30px) / 5),92px);height:auto;aspect-ratio:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-top:4px;color:#fff;scroll-snap-align:start;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .dot{position:absolute;top:5px;left:5px;width:5px;height:5px;border-radius:50%;background:#fff}
.tile.seen .dot{display:none}
.tile .t-ago{position:absolute;top:3px;right:4px;font-family:var(--font-display);font-size:10px;line-height:1;opacity:.85}
.tile .badge{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.02em}
.tile .t-name{font-family:var(--font-display);font-size:11.5px;line-height:1.2;letter-spacing:.01em}
.tile[aria-pressed="true"]{outline:2px solid #fff;outline-offset:-2px}

.filterbar{display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute);background:var(--ink)}
.filterbar button{color:var(--flame)}

/* compact story */
.mini{display:flex;gap:12px;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));background:var(--chrome);border-bottom:1px solid #222224}
.mini .thumb{width:96px;aspect-ratio:4/3;flex:none;background:#151517;overflow:hidden;position:relative}
.mini .thumb img{width:100%;height:100%;object-fit:cover}
.mini .thumb .art{position:absolute;inset:0}
.mini .txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.mini h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:18px;line-height:1.12;text-wrap:balance}
.mini .meta{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}

/* scores view */
.league-head{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--mute);background:var(--ink);padding:10px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.score-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--chrome);border-bottom:1px solid #222224;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.score-row .teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.score-row .tl{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.score-row .sw{width:6px;height:22px;flex:none}
.score-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-row .tl b{font-weight:600;min-width:28px;text-align:right}
.score-row .st{font-family:var(--font-display);font-size:13px;text-transform:uppercase;color:var(--mute);text-align:right;width:84px}
.score-row .st.live{color:#ff4b3a}

/* alerts view */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--chrome);border-bottom:1px solid #222224;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px))}
.alert .src-chip{width:34px;height:34px;font-size:12px;border-radius:50%;flex:none}
.alert p{margin:0;font-size:15px;line-height:1.3}
.alert .meta{font-size:12px;color:var(--mute);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.alert.unread p{font-weight:700}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.25fr 1fr;background:#3b3b3e;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;box-shadow:0 -1px 0 #1b1b1d}
.tab{height:58px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-display);font-size:21px;color:#e5e5e7;position:relative}
.tab[aria-selected="true"]{background:var(--flame);color:#fff}
.tab .count{position:absolute;top:8px;right:calc(50% - 46px);background:#d7261e;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-family:var(--font-body);font-weight:700}
.tab .bars{width:20px;display:flex;flex-direction:column;gap:3px;opacity:.75}
.tab .bars i{display:block;height:2px;background:currentColor}
.tab .pip{width:7px;height:7px;border-radius:50%;background:#fff;margin-left:2px;align-self:flex-start;margin-top:17px}


/* tile logos + add tile */
.tile .t-logo{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.tile .t-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.logo-txt{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff}
.tile .t-name{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.add{background:var(--chrome-2);box-shadow:inset 0 0 0 2px #5a5a5e}
.tile.add .plus{font-family:var(--font-display);font-size:28px;line-height:.9;font-weight:400;color:var(--flame)}
.src-chip.logo{padding:1px}
.src-chip.logo img{width:20px;height:20px;object-fit:contain}
.src-chip .logo-txt{font-size:10px}
.tile .logo-txt{font-size:12px}
.ticker-empty{font-family:var(--font-display);color:var(--mute);font-size:14px;padding:22px 10px;white-space:nowrap}

/* team picker sheet */
.sheet{position:absolute;inset:0;z-index:20;background:var(--chrome);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.sheet-head h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.done{background:var(--flame);color:#fff;font-family:var(--font-display);font-size:17px;padding:7px 18px}
.picked-label,.section-label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--mute)}
.picked-label{background:var(--ink);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.section-label{background:var(--ink);padding:10px 14px 7px}
.picked{display:flex;gap:4px;overflow-x:auto;padding:6px 8px 10px;background:var(--ink);min-height:82px;scrollbar-width:none;flex:none}
.picked::-webkit-scrollbar{display:none}
.pchip{flex:none;width:66px;height:66px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-family:var(--font-display);font-size:11px}
.pchip img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.pchip>span:last-child{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .x{position:absolute;top:1px;right:4px;font-size:15px;line-height:1;opacity:.9}
.picked-empty{color:var(--mute);font-size:14px;padding:22px 6px}
.lg-tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--chrome-2);flex:none}
.lg-tab{padding:11px 0 9px;font-family:var(--font-display);font-size:17px;color:#cfcfd2;border-bottom:3px solid transparent}
.lg-tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--flame)}
.search{padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:var(--chrome-2);border-top:1px solid #2a2a2c;flex:none}
.search input{width:100%;font:16px var(--font-body);color:var(--paper);background:var(--ink);border:1px solid #4a4a4e;padding:9px 12px;border-radius:0}
.search input:focus{outline:2px solid var(--flame);outline-offset:-1px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--chrome);border-bottom:1px solid #222224;padding:9px max(14px,env(safe-area-inset-right,0px)) 9px max(14px,env(safe-area-inset-left,0px))}
.opt .lg{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.opt .lg img{width:32px;height:32px;object-fit:contain}
.opt .nm{flex:1;min-width:0;font-size:17px;display:flex;flex-direction:column;gap:1px}
.opt .sub{font-size:12px;color:var(--mute);letter-spacing:.04em}
.opt .chk{width:28px;height:28px;flex:none;border:2px solid #6a6a6e;border-radius:50%;position:relative}
.opt .chk::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:#bdbdc0}
.opt[aria-pressed="true"] .chk{background:var(--flame);border-color:var(--flame)}
.opt[aria-pressed="true"] .chk::after{content:"✓";color:#fff;font-size:15px}
.league-opt{background:var(--chrome-2)}
.opt .lg.plate{background:#1c1c1e;border-radius:50%}
.conf-label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--mute);background:var(--ink);padding:10px max(14px,env(safe-area-inset-right,0px)) 7px max(14px,env(safe-area-inset-left,0px))}

.datanote{font-size:11px;color:var(--mute);text-align:center;padding:14px 16px 4px;letter-spacing:.04em}

/* ===== Reference pass: medium-gray app, condensed type, tight seams (matches the 2015 stream-app screenshots) ===== */
:root{
  --chrome:#4a4a4d;      /* card body + header */
  --chrome-2:#58585b;    /* action bar */
  --ink:#38383b;         /* seams between sections */
  --bar:#4a4a4d;         /* header bar = card gray */
  --mute:#b9b9bc;        /* source labels, timestamps */
}
.appbar{background:var(--bar);height:48px}
.wordmark b{font-weight:700;font-size:27px;letter-spacing:.02em}
.wordmark i{font-size:23px}
/* ticker: slightly darker band than the header, dark status strip, cards on top */
.ticker{background:#3a3a3d;padding:6px 0 7px;border-bottom:0;box-shadow:inset 0 2px 4px -2px rgba(0,0,0,.5)}
.ticker-label{font-family:var(--font-display);font-weight:400;font-size:12px;letter-spacing:.02em;text-transform:none;color:#c9c9cc}
.game{border-radius:0;box-shadow:0 1px 1px rgba(0,0,0,.35)}
.game-status{background:#2c2c2e;font-size:12px;font-weight:500;letter-spacing:.01em;padding:4px 5px 3px}
.team-row{font-size:14px}
.team-row .ab{font-weight:500;letter-spacing:0}
.team-row .sc{font-size:14.5px;font-weight:600}
.team-row .rec{font-size:11.5px;font-weight:400;top:-.6px}
.team-row .rk{font-size:10px}
/* story cards: gray body, light-gray source line, big condensed headline */
.card{border-bottom:0}
.card + .card,.card + .mini{border-top:3px solid var(--ink)}  /* the rail band itself separates the cards around it, like the ticker */
.card-head{padding:10px max(14px,env(safe-area-inset-right,0px)) 2px max(14px,env(safe-area-inset-left,0px))}
.card-head .src{font-family:var(--font-display);font-size:19px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--mute);gap:7px}
.src-chip{border-radius:2px}
.card h2{font-weight:500;font-size:25px;line-height:1.04;letter-spacing:0}
.card .ago{font-size:19px;font-weight:400;padding-top:3px}
.headline-wrap{padding-bottom:9px}
.actions{background:var(--chrome-2);font-size:18px;font-weight:400;color:#c6c6c9}
.actions button{padding:9px 0}
/* team rail: same darker band as the ticker, cards sitting on it with a buffer above and below */
.rail{background:#3a3a3d;padding:6px 4px 7px;gap:4px;box-shadow:inset 0 2px 4px -2px rgba(0,0,0,.5)}
.tile{box-shadow:0 1px 1px rgba(0,0,0,.35)}
.tile .t-name{font-size:13.5px;font-weight:500;letter-spacing:0}
.tile .t-ago{font-size:12px;font-weight:500;top:4px;right:5px}
.tile .dot{width:6px;height:6px;top:6px;left:6px}
.mini{border-bottom:1px solid var(--ink)}
.mini h3{font-weight:500;font-size:18px;line-height:1.06}
.mini .meta{font-family:var(--font-display);font-size:14px;letter-spacing:0;text-transform:none}

</div>

<script>
(function(){
/* ================= Config ================= */
const NCAA_LOGO = 'https://a.espncdn.com/i/espn/misc_logos/500/ncaa.png';
const LEAGUE_BG = '#28282a';   /* neutral plate behind league logos on tiles, chips and picker */
const LG = {
  nfl:{label:'NFL', name:'NFL', path:'football/nfl', sb:'scoreboard?limit=100', teams:'standings', color:LEAGUE_BG, periods:4,
       logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png', logoDir:'nfl'},
  mlb:{label:'MLB', name:'MLB', path:'baseball/mlb', sb:'scoreboard', teams:'standings', color:LEAGUE_BG, periods:9,
       logo:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png', logoDir:'mlb'},
  nba:{label:'NBA', name:'NBA', path:'basketball/nba', sb:'scoreboard', teams:'standings', color:LEAGUE_BG, periods:4,
       logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png', logoDir:'nba'},
  cfb:{label:'CFB', name:'College Football', path:'football/college-football', sb:'scoreboard?groups=80&limit=500', teams:'standings?group=80', color:LEAGUE_BG, periods:4,
       logo:NCAA_LOGO, logoDir:'ncaa', college:true},
  cbb:{label:'CBB', name:'College Basketball', path:'basketball/mens-college-basketball', sb:'scoreboard?groups=50&limit=500', teams:'standings?group=50', color:LEAGUE_BG, periods:2,
       logo:NCAA_LOGO, logoDir:'ncaa', college:true},
};
const LG_ORDER = ['nfl','mlb','nba','cfb','cbb'];
const API = 'https://site.api.espn.com/apis/site/v2/sports/';
const API_V2 = 'https://site.api.espn.com/apis/v2/sports/';
const CORE = 'https://sports.core.api.espn.com/v2/sports/';
const STORE_KEY = 'huddle.picks.v1';

/* Offline fallback team lists (used only if ESPN can't be reached) */
const FALLBACK_TEAMS = {
  nfl:[['3','CHI','Chicago','Bears','#0B162A'],['6','DAL','Dallas','Cowboys','#003594'],['9','GB','Green Bay','Packers','#204E32'],['12','KC','Kansas City','Chiefs','#E31837'],['21','PHI','Philadelphia','Eagles','#06424D'],['23','PIT','Pittsburgh','Steelers','#000000'],['34','HOU','Houston','Texans','#03202F']],
  mlb:[['13','TEX','Texas','Rangers','#003278'],['16','CHC','Chicago','Cubs','#0E3386'],['10','NYY','New York','Yankees','#132448'],['19','LAD','Los Angeles','Dodgers','#005A9C'],['24','STL','St. Louis','Cardinals','#C41E3A'],['18','HOU','Houston','Astros','#002D62']],
  nba:[['4','CHI','Chicago','Bulls','#CE1141'],['13','LAL','Los Angeles','Lakers','#552583'],['9','GS','Golden State','Warriors','#1D428A'],['2','BOS','Boston','Celtics','#007A33'],['6','DAL','Dallas','Mavericks','#0053BC'],['24','SA','San Antonio','Spurs','#000000']],
  cfb:[['8','ARK','Arkansas','Razorbacks','#9D2235'],['333','ALA','Alabama','Crimson Tide','#9E1B32'],['251','TEX','Texas','Longhorns','#BF5700'],['194','OSU','Ohio State','Buckeyes','#BB0000'],['61','UGA','Georgia','Bulldogs','#BA0C2F'],['130','MICH','Michigan','Wolverines','#00274C']],
  cbb:[['8','ARK','Arkansas','Razorbacks','#9D2235'],['96','UK','Kentucky','Wildcats','#0033A0'],['150','DUKE','Duke','Blue Devils','#003087'],['2305','KU','Kansas','Jayhawks','#0051BA'],['153','UNC','North Carolina','Tar Heels','#7BAFD4'],['248','HOU','Houston','Cougars','#C8102E']],
};
function fallbackTeams(lg){
  const L = LG[lg];
  return FALLBACK_TEAMS[lg].map(([id,ab,loc,nick,color]) => ({lg, id, ab, location:loc, nick, full:loc+' '+nick, color,
    logo: L.college ? `https://a.espncdn.com/i/teamlogos/ncaa/500/${id}.png` : `https://a.espncdn.com/i/teamlogos/${L.logoDir}/500/${ab.toLowerCase()}.png`}));
}

/* ================= Picks (saved on this device) ================= */
const DEFAULT_PICKS = [{type:'league',lg:'nfl'},{type:'league',lg:'cfb'},{type:'league',lg:'nba'}];
function loadPicks(){ try{ const v = JSON.parse(localStorage.getItem(STORE_KEY)); if(Array.isArray(v)) return v; }catch(e){} return DEFAULT_PICKS.slice(); }
function savePicks(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(picks)); }catch(e){} }
let picks = loadPicks();
const pickKey = p => p.type==='league' ? p.lg : `${p.lg}:${p.id}`;
const isPicked = key => picks.some(p => pickKey(p)===key);
function activeLeagues(){ const s = new Set(picks.map(p=>p.lg)); const out = LG_ORDER.filter(k=>s.has(k)); return out.length ? out : ['nfl','nba','cfb']; }

/* ================= Sample data (shown when live feeds are unreachable) ================= */
const at = (days,h,m) => { const x = new Date(); x.setDate(x.getDate()+days); x.setHours(h,m,0,0); return x.toISOString(); };
const SAMPLE_GAMES = [
  {lg:'cfb',live:true,period:3,clock:'2:50',date:at(0,14,30),a:{id:'218',ab:'TEM',rank:22,sc:24,color:'#9D2235'},h:{id:'151',ab:'ECU',sc:17,color:'#592A8A'}},
  {lg:'nba',date:at(0,19,0),a:{id:'18',ab:'NYK',rec:'3-1',color:'#006BB6'},h:{id:'2',ab:'BOS',rec:'2-1',color:'#007A33'}},
  {lg:'nba',date:at(0,21,30),a:{id:'9',ab:'GSW',rec:'2-4',color:'#1D428A'},h:{id:'13',ab:'LAL',rec:'2-4',color:'#552583'}},
  {lg:'nfl',date:at(1,12,0),a:{id:'23',ab:'PIT',rec:'4-2',color:'#FFB612'},h:{id:'5',ab:'CLE',rec:'1-5',color:'#311D00'}},
  {lg:'nfl',date:at(1,15,25),a:{id:'26',ab:'SEA',rec:'2-4',color:'#69BE28'},h:{id:'25',ab:'SF',rec:'2-4',color:'#AA0000'}},
  {lg:'cfb',final:true,period:4,date:at(0,11,0),a:{id:'8',ab:'ARK',name:'Arkansas',sc:31,color:'#9D2235',line:[7,10,7,7]},h:{id:'344',ab:'MSST',name:'Mississippi St',sc:20,color:'#5D1725',line:[3,7,0,10]}},
];
const SAMPLE_STORIES = [
  {key:'featured',src:'Featured',chip:'H',chipColor:'#58585c',title:'NBA × NFL Jersey Mashups',ago:'56m',art:'mashup',over:['NBA × NFL','Jersey Mashups']},
  {key:'cfb',src:'College Football',chip:'CFB',chipColor:LEAGUE_BG,title:'Upset Watch: Five Ranked Teams on Upset Alert This Saturday',ago:'4m',art:'field'},
  {key:'nba',src:'NBA',chip:'NBA',chipColor:LEAGUE_BG,title:'Three Takeaways From Opening Week Around the League',ago:'1h',art:'court'},
  {key:'nfl',src:'NFL',chip:'NFL',chipColor:LEAGUE_BG,title:'Midseason Grades for Every Division Leader',ago:'34m',art:'field'},
  {key:'mlb',src:'MLB',chip:'MLB',chipColor:LEAGUE_BG,title:'World Series Preview: Where the Series Will Be Won',ago:'22m',art:'lights'},
  {key:'cbb',src:'College Basketball',chip:'CBB',chipColor:LEAGUE_BG,title:'Preseason Top 25: Who Opens the Season on Top',ago:'3h',art:'court'},
  {key:'nfl',src:'NFL',chip:'NFL',chipColor:LEAGUE_BG,title:'Film Room: How Defenses Are Flipping Fourth Quarters',ago:'2h',art:'field'},
  {key:'nba',src:'NBA',chip:'NBA',chipColor:LEAGUE_BG,title:'Bench Units Quietly Leading the League in Net Rating',ago:'12m',art:'court'},
];
const SAMPLE_ALERTS = [
  {chip:'TEM',color:'#9D2235',text:'Temple leads ECU 24–17 heading to the 4th quarter',ago:'2m',unread:true},
  {chip:'LAL',color:'#552583',text:'Lakers starting lineup announced for tonight vs. Warriors',ago:'19m',unread:true},
  {chip:'ARK',color:'#9D2235',text:'FINAL: Arkansas 31, Mississippi State 20',ago:'41m',unread:true},
  {chip:'CHI',color:'#CE1141',text:'Bulls guard listed as questionable for Monday (ankle)',ago:'1h',unread:false},
  {chip:'DAL',color:'#003594',text:'Cowboys open as 3.5-point favorites for Sunday',ago:'3h',unread:false},
];

/* ================= Helpers ================= */
let games = [], stories = [], alerts = SAMPLE_ALERTS.slice(), liveMode = false;
let filter = null, starred = new Set(), tileMeta = {}, seen = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex = c => !c ? '#444' : (c[0]==='#' ? c : '#'+c);
function lum(c){ c = hex(c).slice(1); if(c.length!==6) return .3; const [r,g,b]=[0,2,4].map(i=>parseInt(c.substr(i,2),16)/255); return .2126*r+.7152*g+.0722*b; }
const teamBg = (color, alt) => (lum(color) > .78 && alt) ? hex(alt) : hex(color);
/* <img> that swaps itself for text if the logo can't load */
/* Dark-background ("500-dark") logo variants: ESPN publishes these for leagues and teams.
   Each <img> tries the dark version first, falls back to the regular logo, then to text. */
const darkUrl = u => !u ? '' : u.includes('/500-dark/') ? u : u.replace('/500/','/500-dark/');
window.hLogoErr = function(img, mode){
  const fb = img.getAttribute('data-fb');
  if(fb){ img.removeAttribute('data-fb'); img.src = fb; return; }
  const txt = img.getAttribute('data-txt') || '';
  if(mode==='ticker'){ const p = img.parentNode; p.classList.add('txt'); p.textContent = txt; return; }
  const b = document.createElement('b'); b.className = 'logo-txt'; b.textContent = txt; img.replaceWith(b);
};
function logoTag(src, text, mode, darkSrc){
  if(!src && !darkSrc) return '';
  const dark = darkSrc || darkUrl(src), fb = (src && src!==dark) ? src : '';
  return `<img src="${esc(dark)}"${fb?` data-fb="${esc(fb)}"`:''} data-txt="${esc(text)}" alt="" loading="lazy" onerror="hLogoErr(this${mode?",'"+mode+"'":''})">`;
}
const logoImg = (src, text) => src ? logoTag(src, text) : `<b class="logo-txt">${esc(text)}</b>`;
function timed(url, ms=7000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  return fetch(url,{signal:c.signal}).then(r=>{clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json();});
}
function ago(iso){ const m = Math.max(1, Math.round((Date.now()-new Date(iso))/60000)); return m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'; }

/* ---- Status strip: pregame "10/26 7:00PM CT" (date dropped on game day), live "3rd ... 2:50", "Final" ---- */
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function periodLabel(g){ const reg = (LG[g.lg]||{}).periods || 4; if(g.period>reg){ const k=g.period-reg; return (k>1?k:'')+'OT'; } return ordinal(g.period||1); }
function tzLabel(d){
  try{ const p = new Intl.DateTimeFormat('en-US',{timeZoneName:'shortGeneric'}).formatToParts(d).find(x=>x.type==='timeZoneName');
       if(p && p.value.length<=4) return p.value; }catch(e){}
  try{ const p = new Intl.DateTimeFormat('en-US',{timeZoneName:'short'}).formatToParts(d).find(x=>x.type==='timeZoneName');
       if(p) return p.value.replace(/^([A-Z])[SD]T$/,'$1T'); }catch(e){}
  return '';
}
function statusParts(g){
  if(g.postponed) return ['Postponed',''];
  if(g.lg==='mlb' && (g.live||g.final)) return [g.detail || (g.final?'Final':''), ''];
  if(g.final) return [g.period>((LG[g.lg]||{}).periods||4) ? 'Final/'+periodLabel(g) : 'Final',''];
  if(g.live){
    if(g.half) return ['Half',''];
    if(g.endPeriod) return ['End '+periodLabel(g),''];
    return [periodLabel(g), g.clock||''];
  }
  const d = new Date(g.date), now = new Date();
  const time = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s/g,'') + ' ' + tzLabel(d);
  const sameDay = d.toDateString()===now.toDateString();
  return [sameDay ? time : `${d.getMonth()+1}/${d.getDate()} ${time}`, ''];
}
const myTeamKeys = () => new Set(picks.filter(p=>p.type==='team').map(pickKey));
const gameHasMine = (g, mine) => mine.has(`${g.lg}:${g.a.id}`) || mine.has(`${g.lg}:${g.h.id}`);
function orderGames(list){
  const mine = myTeamKeys(), act = activeLeagues();
  const rank = g => g.live?0 : g.final?2 : 1;
  return list.filter(g => act.includes(g.lg))
    .sort((x,y)=> (gameHasMine(y,mine)-gameHasMine(x,mine)) || rank(x)-rank(y) || new Date(x.date)-new Date(y.date));
}

/* ================= Generative hero art (no stock photos) ================= */
function art(kind, seed){
  const s = (seed||'').length;
  if(kind==='mashup') return `<div class="art" style="background:
    radial-gradient(60% 45% at 50% 18%,rgba(255,240,210,.55),transparent 70%),
    radial-gradient(30% 30% at 12% 10%,rgba(255,255,255,.35),transparent 70%),
    radial-gradient(30% 30% at 88% 10%,rgba(255,255,255,.35),transparent 70%),
    linear-gradient(115deg,#552583 0 22%,#CE1141 22% 40%,#0B162A 40% 58%,#FDB927 58% 74%,#AA0000 74% 100%);"></div>
    <div class="art" style="background:repeating-linear-gradient(115deg,rgba(0,0,0,.18) 0 2px,transparent 2px 14px);mix-blend-mode:multiply"></div>
    <div class="art" style="display:flex;align-items:center;justify-content:space-around;font-family:var(--font-display);font-weight:700;font-size:min(34vw,170px);color:rgba(255,255,255,.14);line-height:1"><span>21</span><span>99</span><span>93</span></div>`;
  if(kind==='court') return `<div class="art" style="background:
    radial-gradient(80% 60% at 50% 0%,rgba(255,230,190,.45),transparent 70%),
    repeating-linear-gradient(90deg,#b5794a 0 18px,#a96d40 18px 36px)"></div>
    <div class="art" style="border:3px solid rgba(255,255,255,.55);border-radius:50%;width:46%;aspect-ratio:1;left:27%;top:${30+s%10}%;position:absolute"></div>
    <div class="art" style="background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.5))"></div>`;
  if(kind==='field') return `<div class="art" style="background:
    radial-gradient(70% 50% at 50% -5%,rgba(255,255,240,.55),transparent 70%),
    repeating-linear-gradient(0deg,#2f7a37 0 26px,#2a6f32 26px 52px)"></div>
    <div class="art" style="background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.55) calc(10% - 2px) 10%);transform:perspective(300px) rotateX(48deg);transform-origin:bottom;top:30%"></div>
    <div class="art" style="background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 40%,rgba(0,0,0,.45))"></div>`;
  return `<div class="art" style="background:
    radial-gradient(18% 22% at 20% 12%,#fff,transparent 70%),radial-gradient(18% 22% at 50% 8%,#fff,transparent 70%),radial-gradient(18% 22% at 80% 12%,#fff,transparent 70%),
    linear-gradient(180deg,#1b2433,#0c0f16)"></div>`;
}

/* ================= Rendering ================= */
function teamRow(t, g){
  const showScore = g.live||g.final;
  const sc = showScore ? `<span class="sc">${esc(t.sc)}</span>` : '';
  const rec = (!showScore && t.rec) ? `<span class="rec">(${esc(t.rec)})</span>` : '';
  const loser = g.final && Number(t.sc) < Number((t===g.a?g.h:g.a).sc);
  const L = LG[g.lg] || {};
  const logo = t.logo || (t.ab ? (L.college ? (t.id?`https://a.espncdn.com/i/teamlogos/ncaa/500/${t.id}.png`:'') : `https://a.espncdn.com/i/teamlogos/${L.logoDir}/500/${t.ab.toLowerCase()}.png`) : '');
  const fallback = t.ab.slice(0,1);
  const mono = (logo || t.logoDark)
    ? `<span class="mono">${logoTag(logo, fallback, 'ticker', t.logoDark)}</span>`
    : `<span class="mono txt">${esc(fallback)}</span>`;
  return `<div class="team-row${loser?' loser':''}" style="background:${hex(t.color)}">
    ${mono}
    <span class="ab">${t.rank?`<span class="rk">${t.rank}</span>`:''}${esc(t.ab)}${rec}</span>${sc}</div>`;
}
function renderTicker(){
  const list = orderGames(games).slice(0,15);
  $('#ticker').innerHTML = list.length ? list.map(g => `<div class="game">
    <div class="game-status">${statusParts(g).map(s=>`<span>${esc(s)}</span>`).join('')}</div>
    ${teamRow(g.a,g)}${teamRow(g.h,g)}</div>`).join('')
    : `<div class="ticker-empty">No games today for your teams</div>`;
}
function bigCard(st){
  const pressed = starred.has(st.title);
  const media = st.img ? `<img src="${esc(st.img)}" alt="" loading="lazy">` : art(st.art, st.title);
  const over = st.over ? `<div class="over"><b>${esc(st.over[0])}</b><span>${esc(st.over[1])}</span></div>` : '';
  const chip = st.chipLogo ? `<span class="src-chip logo" style="background:${st.chipColor}">${logoImg(st.chipLogo, st.chip)}</span>` : `<span class="src-chip" style="background:${st.chipColor}">${esc(st.chip)}</span>`;
  return `<article class="card">
    <div class="card-head"><div class="src">${chip}${esc(st.src)}</div></div>
    <div class="headline-wrap"><h2>${esc(st.title)}</h2><span class="ago">${esc(st.ago)}</span></div>
    ${st.link?`<a href="${esc(st.link)}" target="_blank" rel="noopener" style="display:block">`:''}<div class="hero">${media}<div class="shade"></div>${over}</div>${st.link?'</a>':''}
    <div class="actions">
      <button aria-label="Save" aria-pressed="${pressed}" data-star="${esc(st.title)}"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.8.7-5.1 4.6 1.5 6.7L12 17.3l-6.1 3.4 1.5-6.7L2.3 9.4l6.8-.7z"/></svg></button>
      <button><svg viewBox="0 0 24 24"><path d="M14 8V6c0-.8.4-1 1-1h2V1.5h-3C10.8 1.5 10 3.6 10 6v2H7v4h3v10.5h4V12h3l.5-4z"/></svg>Share</button>
      <button><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg>Post</button>
      <button><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.6 3.4 6L4.5 21l4.2-2.3c1 .2 2.1.3 3.3.3 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>Text</button>
      <button aria-label="More"><svg viewBox="0 0 24 24"><path d="M12 2l4.5 4.5-1.4 1.4L13 5.8V15h-2V5.8L8.9 7.9 7.5 6.5zM4 13h2v7h12v-7h2v9H4z"/></svg></button>
    </div></article>`;
}
function mini(st){
  const media = st.img ? `<img src="${esc(st.img)}" alt="" loading="lazy">` : art(st.art, st.title);
  const inner = `<div class="thumb">${media}</div><div class="txt"><h3>${esc(st.title)}</h3><span class="meta">${esc(st.src)} · ${esc(st.ago)}</span></div>`;
  return st.link ? `<a class="mini" href="${esc(st.link)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${inner}</a>` : `<div class="mini">${inner}</div>`;
}
/* A pick as it appears on a tile: league tiles use the league mark, team tiles the team logo */
function pickView(p){
  if(p.type==='league'){ const L = LG[p.lg]; return {key:p.lg, name:L.label, bg:L.color, logo:L.logo, text:L.label}; }
  return {key:pickKey(p), name: LG[p.lg].college ? p.location : p.nick, bg:teamBg(p.color,p.alt), logo:p.logo, text:p.ab};
}
function rail(){
  const tiles = picks.map(p => {
    const v = pickView(p), m = tileMeta[v.key] || {};
    const fresh = m.count && !seen.has(v.key);
    return `<button class="tile${fresh?'':' seen'}" style="background:${v.bg}" data-team="${esc(v.key)}" aria-pressed="${filter===v.key}" aria-label="${esc(v.name)} stories">
      <span class="dot"></span>${m.ago?`<span class="t-ago">${esc(m.ago)}</span>`:''}
      <span class="t-logo">${logoImg(v.logo, v.text)}</span><span class="t-name">${esc(v.name)}</span></button>`;
  }).join('');
  return `<div class="rail" aria-label="My teams">${tiles}
    <button class="tile add" data-edit aria-label="Add teams and leagues"><span class="plus">+</span><span class="t-name">${picks.length?'Edit':'Add Teams'}</span></button></div>`;
}
function renderTeams(){
  const list = filter ? stories.filter(s=>s.key===filter) : stories;
  let html = '';
  if(filter){
    const p = picks.find(x=>pickKey(x)===filter); const v = p ? pickView(p) : {name:'Team'};
    html += rail() + `<div class="filterbar"><span>${esc(v.name)} stream · ${list.length} stories</span><button data-clear>All teams</button></div>`;
    html += list.length ? list.map((s,i)=> i===0?bigCard(s):mini(s)).join('') : `<div class="datanote">No new stories for ${esc(v.name)} yet.</div>`;
  } else {
    const leadIdx = Math.max(0, list.findIndex(s=>s.img||s.art));
    const lead = list[leadIdx]; const rest = list.filter((_,i)=>i!==leadIdx);

/* ================= Team picker ================= */
const teamCache = {};          /* lg -> [{...team}] */
let pickerLg = 'nfl', pickerQuery = '', pickerOffline = {};
async function getTeams(lg){
  if(teamCache[lg]) return teamCache[lg];
  try{
    /* Standings list every team with logo and conference, and (unlike /teams) allow requests from other sites */
    const j = await timed(API_V2+LG[lg].path+'/'+LG[lg].teams, 12000);
    const out = [], ids = new Set();
    const walk = (g, conf) => {
      ((g.standings&&g.standings.entries)||[]).forEach(e => { const t = e.team; if(!t || ids.has(String(t.id)) || t.isActive===false) return; ids.add(String(t.id));
        out.push({lg, id:String(t.id), ab:t.abbreviation, location:t.location, nick:t.name || t.shortDisplayName, full:t.displayName,
          conf, logo:(t.logos&&t.logos[0]&&t.logos[0].href) || '',
          logoDark:((t.logos||[]).find(l=>(l.rel||[]).includes('dark'))||{}).href || ''}); });
      (g.children||[]).forEach(c => walk(c, c.shortName || c.abbreviation || c.name));
    };
    walk(j, j.shortName || j.abbreviation || LG[lg].label);
    if(!out.length) throw new Error('empty');
    const confs = [...new Set(out.map(t=>t.conf))].sort((a,b)=>a.localeCompare(b));
    teamCache[lg] = out.sort((a,b)=> confs.indexOf(a.conf)-confs.indexOf(b.conf) || a.full.localeCompare(b.full));
    pickerOffline[lg] = false;
  }catch(e){ teamCache[lg] = fallbackTeams(lg); pickerOffline[lg] = true; }
  return teamCache[lg];
}

/* ---- Game box: short, wide rows ----

  let html = '';
  if(p.type==='team'){
    const now = new Date(), today = now.toDateString();
    const live = gs.find(g=>g.live);
    const next = live || gs.find(g=>!g.final && !g.postponed && new Date(g.date) >= new Date(now - 6*3600e3));
    const last = gs.filter(g=>g.final).pop();
    const gameday = next && (next.live || new Date(next.date).toDateString()===today);
    /* last game on top, next game below it; on gameday the game moves to the top */
    const boxes = gameday ? [[next,false],[last,true]] : [[last,true],[next,false]];
    boxes.forEach(([g]) => { if(g){ enrichGame(g); html += gameBox(full(g)); } });
    if(boxes.some(([g])=>g)) html += '<div class="gb-gap"></div>';
  } else {
    const order = g => g.live?0 : g.final?2 : 1;
    const lg = gs.slice().sort((x,y)=>order(x)-order(y) || new Date(x.date)-new Date(y.date)).slice(0,24);
    if(lg.length) html += tickerCards(lg);
  }
  if(list[0]) html += tStoryLead(list[0]);
  list.slice(1).forEach(s => html += tStoryCard(s));
  if(!list.length) html += `<div class="tp-empty">No new stories for ${esc(p.type==='league'?LG[p.lg].name:p.full)} yet.</div>`;
  return html;
}

/* ---- Standings tab ---- */
async function loadStandings(lg){
  if(standingsCache[lg]) return standingsCache[lg];
  /* college: by conference; NFL & MLB: by division (level=3); NBA: by conference */
  const q = LG[lg].college ? (lg==='cfb' ? '?group=80' : '?group=50') : (lg==='nfl'||lg==='mlb') ? '?level=3' : '';
  try{ standingsCache[lg] = await timed(API_V2+LG[lg].path+'/standings'+q, 12000); }catch(e){ standingsCache[lg] = {error:true}; }
  return standingsCache[lg];
}
function leafGroups(node, out=[], parent=''){
  if(node.standings && node.standings.entries && node.standings.entries.length) out.push({name: node.name || node.shortName || node.abbreviation || parent, short: node.shortName||node.abbreviation||'', entries: node.standings.entries});
  (node.children||[]).forEach(c => leafGroups(c, out, node.name));
  return out;
}
const statMap = e => { const m = {}; (e.stats||[]).forEach(s => { if(s.name) m[s.name]=s; if(s.type) m['t:'+s.type]=s; if(s.abbreviation) m['a:'+s.abbreviation]=s; }); return m; };
const sv = s => s ? (s.displayValue ?? s.summary ?? s.value ?? '') : '';
function standingsTable(grp, lg, hiId){
  const college = LG[lg].college, nfl = lg==='nfl';
  const pct = (txt) => { const m = String(txt).match(/(\d+)-(\d+)/); return m ? (+m[1]/((+m[1]+ +m[2])||1)) : 0; };
  const rows = grp.entries.map(e => ({e, m:statMap(e)}));
  let cols;
  if(college){
    cols = [['CONF', r => sv(r.m['t:vsconf']||r.m['vsConf']||r.m['a:CONF'])], ['OVR', r => sv(r.m['t:total']||r.m['overall']) || `${sv(r.m.wins)}-${sv(r.m.losses)}`]];
    rows.sort((x,y)=> pct(cols[0][1](y))-pct(cols[0][1](x)) || pct(cols[1][1](y))-pct(cols[1][1](x)));
  } else {
    cols = [['W', r=>sv(r.m.wins)], ['L', r=>sv(r.m.losses)]];
    if(nfl) cols.push(['T', r=>sv(r.m.ties)]);
    cols.push(['PCT', r=>sv(r.m.winPercent)]);
    if(!nfl) cols.push(['GB', r=>sv(r.m.gamesBehind)]);
    const seed = r => +(r.m.playoffSeed&&r.m.playoffSeed.value) || 99;
    rows.sort((x,y)=> (+(y.m.winPercent&&y.m.winPercent.value)||0)-(+(x.m.winPercent&&x.m.winPercent.value)||0) || seed(x)-seed(y));
  }
  const body = rows.map(r => { const t = r.e.team||{}, me = String(t.id)===String(hiId);
    const logo = (t.logos&&t.logos[0]&&t.logos[0].href) || '';
    return `<tr class="${me?'me':''}"><td><span class="stl">${logo?logoTag(logo, t.abbreviation||''):''}</span>${esc(t.shortDisplayName||t.displayName||t.name)}</td>${cols.map(c=>`<td>${esc(c[1](r) || '–')}</td>`).join('')}</tr>`; }).join('');
  return `<div class="stand"><div class="stand-h">${esc(grp.name)}</div><table><thead><tr><th></th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function renderStandings(p){
  const data = standingsCache[p.lg];
  if(!data){ loadStandings(p.lg).then(()=>{ if(tpKey===pickKey(p) && tpTab==='standings') renderTeamPage(); }); return `<div class="tp-empty">Loading standings…</div>`; }
  if(data.error) return `<div class="tp-empty">Couldn't load standings from ESPN. Pull to refresh or try again shortly.</div>`;
  let groups = leafGroups(data);
  if(p.type==='team'){
    const i = groups.findIndex(g => g.entries.some(e => String((e.team||{}).id)===String(p.id)));
    if(i>0) groups = [groups[i], ...groups.slice(0,i), ...groups.slice(i+1)];
  }
  return groups.length ? groups.map(g => standingsTable(g, p.lg, p.id)).join('') : `<div class="tp-empty">No standings available yet.</div>`;
}

/* ---- Schedule tab ---- */
function renderSchedule(p){
  if(p.type!=='team') return '';
  const gs = gamesFor(p);
  if(!tpGames[pickKey(p)]) return `<div class="tp-empty">Loading schedule…</div>`;
  if(!gs.length) return `<div class="tp-empty">No games found.</div>`;
  const now = new Date(); let nextMarked = false, month = '';
  const rows = gs.map(g => {
    const home = String(g.h.id)===String(p.id), me = home ? g.h : g.a, opp = home ? g.a : g.h;
    const d = new Date(g.date), m = d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    let head = ''; if(m!==month){ month = m; head = `<div class="sch-month">${esc(m)}</div>`; }
    let res;
    if(g.final){ const w = Number(me.sc) > Number(opp.sc);
      res = `<span class="${w?'w':'l'}">${w?'W':'L'}</span> ${esc(me.sc)}-${esc(opp.sc)}${g.period>((LG[g.lg]||{}).periods||4) && g.lg!=='mlb' ? ' OT':''}`; }
    else if(g.live) res = `<span class="lv">${esc(statusParts(g)[0])}</span> ${esc(me.sc)}-${esc(opp.sc)}`;
    else if(g.postponed) res = 'Postponed';
    else res = `${g.tbd?'TBD':esc(d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s/g,''))}${g.tv?` <small>${esc(g.tv)}</small>`:''}`;
    const isNext = !nextMarked && !g.final && (g.live || d >= now - 6*3600e3) && (nextMarked = true);
    const inner = `<span class="sch-d">${esc(d.toLocaleDateString('en-US',{weekday:'short'}))}<b>${d.getMonth()+1}/${d.getDate()}</b></span>
      <span class="sch-o"><em>${home?'vs':'@'}</em><span class="stl">${logoTag(teamLogoUrl(opp,g.lg), opp.ab||'', '', opp.logoDark)}</span>${opp.rank?`<small>${opp.rank}</small> `:''}${esc(opp.name||opp.ab)}</span>
      <span class="sch-r">${res}</span>`;
    return head + (g.link ? `<a class="sch-row${isNext?' next':''}" href="${esc(g.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="sch-row${isNext?' next':''}">${inner}</div>`);
  }).join('');
  const note = tpSource[pickKey(p)]==='range' && !['nfl','cfb'].includes(p.lg) ? `<div class="tp-empty" style="font-size:14px">Showing three weeks either side of today.</div>` : '';
  return `<div class="sched">${rows}</div>${note}`;
}

function renderTeamPage(){
  const p = picks.find(x=>pickKey(x)===tpKey); if(!p) return closeTeamPage();
  const v = pickView(p), page = $('#tpage');
  const base = p.type==='league' ? '#3a3a3d' : v.bg;
  page.style.setProperty('--tp-bg', '#2f2f31');
  page.style.setProperty('--tp-bar', p.type==='league' ? '#4a4a4d' : shade(base, .8));
  page.style.setProperty('--tp-bar2', p.type==='league' ? '#444447' : shade(base, .62));
  $('#tpName').textContent = p.type==='league' ? LG[p.lg].name : p.full;
  const tabs = p.type==='team' ? ['stream','standings','schedule'] : ['stream','standings'];
  if(!tabs.includes(tpTab)) tpTab = 'stream';
  $('#tpTabs').innerHTML = tabs.map(t => `<button class="tp-tab" data-tptab="${t}" aria-selected="${t===tpTab}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
  $('#tpBody').innerHTML = tpTab==='standings' ? renderStandings(p) : tpTab==='schedule' ? renderSchedule(p) : renderStream(p);
  if(tpTab==='schedule'){ const n = $('#tpBody .sch-row.next'); if(n && !renderTeamPage._scrolled){ renderTeamPage._scrolled = true; n.scrollIntoView({block:'center'}); } }
}
function openTeamPage(key){
  const p = picks.find(x=>pickKey(x)===key); if(!p) return;
  tpKey = key; tpTab = 'stream'; seen.add(key); setDrawer(false);
  renderTeamPage(); $('#tpBody').scrollTop = 0;
  $('#tpage').classList.add('open'); $('#tpage').setAttribute('aria-hidden','false');
  loadTeamGames(p);
}
function closeTeamPage(){ tpKey = null; $('#tpage').classList.remove('open'); $('#tpage').setAttribute('aria-hidden','true'); renderTeams(); }
const teamPageOpen = () => $('#tpage').classList.contains('open');

/* ================= Events ================= */
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(tab){
    /* My Teams pulls the drawer up (tap again to put it away); the other tabs switch views */
    if(tab.dataset.view==='teams'){ if(teamPageOpen()) closeTeamPage(); showView('teams'); setDrawer(!drawerOpen()); }
    else { if(teamPageOpen()) closeTeamPage(); setDrawer(false); showView(tab.dataset.view); }
    return;
  }
  const go = e.target.closest('[data-go]');
  if(go){ setDrawer(false); showView(go.dataset.go); return; }
  const row = e.target.closest('[data-row]');
  if(row){ openTeamPage(row.dataset.row); return; }
  if(e.target.closest('#tpBack')){ closeTeamPage(); return; }
  const tt = e.target.closest('[data-tptab]');
  if(tt){ tpTab = tt.dataset.tptab; renderTeamPage._scrolled = false; renderTeamPage(); if(tpTab!=='schedule') $('#tpBody').scrollTop = 0; return; }
  if(e.target.closest('#tpTitle')){ showView('teams'); setDrawer(true); closeTeamPage(); return; }
  if(e.target.closest('[data-add]')){ openPicker(); setTimeout(()=>$('#teamSearch').focus(), 320); return; }
  if(e.target.closest('.search-btn')){ openPicker(); setTimeout(()=>$('#teamSearch').focus(), 320); return; }
  if(e.target.closest('[data-edit]') || e.target.closest('.gear')){ openPicker(); return; }
  if(e.target.closest('#pickerDone')){ closePicker(); return; }
  const lgTab = e.target.closest('.lg-tab');
  if(lgTab){ pickerLg = lgTab.dataset.lg; pickerQuery=''; $('#teamSearch').value=''; $('#pickerList').scrollTop=0; renderPickerBody(); return; }
  const pl = e.target.closest('[data-pick-league]');
  if(pl){ togglePick({type:'league', lg:pl.dataset.pickLeague}); pl.setAttribute('aria-pressed', isPicked(pl.dataset.pickLeague)); return; }
  const pt = e.target.closest('[data-pick-team]');
  if(pt){ const key = pt.dataset.pickTeam, [lg,id] = key.split(':'); const t = (teamCache[lg]||[]).find(x=>x.id===id);
    if(t){ const p = {type:'team', lg, id, ab:t.ab, location:t.location, nick:t.nick, full:t.full, color:t.color||'#3a3a3d', alt:t.alt, logo:t.logo}; togglePick(p); pt.setAttribute('aria-pressed', isPicked(key)); if(isPicked(key)) fillColors(p); }
    return; }
  const un = e.target.closest('[data-unpick]');
  if(un){ const p = picks.find(x=>pickKey(x)===un.dataset.unpick); if(p){ togglePick(p); renderPickerBody(); } return; }
  const tile = e.target.closest('[data-team]');
  if(tile){ openTeamPage(tile.dataset.team); return; }
  if(e.target.closest('[data-clear]')){ filter=null; renderTeams(); return; }
  const star = e.target.closest('[data-star]');
  if(star){ const k=star.dataset.star; starred.has(k)?starred.delete(k):starred.add(k); star.setAttribute('aria-pressed', starred.has(k)); }
});
$('#teamSearch').addEventListener('input', e => { pickerQuery = e.target.value; renderPickerBody(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#picker').classList.contains('open')) closePicker(); });

/* ================= Live data (ESPN public site API) ================= */
function parseEvent(ev, lg){
  const comp = ev.competitions[0]; const status = comp.status || ev.status || {}; const st = status.type || {};
  const val = x => x==null ? '' : (typeof x==='object' ? (x.displayValue ?? x.value ?? '') : x);
  const side = ha => { const c = comp.competitors.find(x=>x.homeAway===ha) || {}; const tm = c.team || {};
    const rec = (c.records&&c.records[0]&&(c.records[0].summary||c.records[0].displayValue)) || (c.record&&c.record[0]&&c.record[0].displayValue) || '';
    return {id:String(tm.id), ab:tm.abbreviation, name:tm.shortDisplayName||tm.displayName, color:tm.color, alt:tm.alternateColor, logo:tm.logo || (tm.logos&&tm.logos[0]&&tm.logos[0].href) || '', logoDark:tm.logoDark || ((tm.logos||[]).find(l=>(l.rel||[]).includes('dark'))||{}).href || '',
      sc:val(c.score), rec, rank:(c.curatedRank&&c.curatedRank.current<=25)?c.curatedRank.current:null,
      line:(c.linescores||[]).map(l=>l.value ?? l.displayValue), hits:c.hits, errors:c.errors, winner:c.winner}; };
  const bc = (comp.broadcasts||[]).map(b => (b.names&&b.names[0]) || (b.media&&b.media.shortName) || '').filter(Boolean)[0] || '';
  return {lg, live:st.state==='in', final:st.state==='post' && st.name!=='STATUS_POSTPONED', postponed:st.name==='STATUS_POSTPONED',
    half:st.name==='STATUS_HALFTIME', endPeriod:st.name==='STATUS_END_PERIOD', detail:st.shortDetail,
    period:status.period, clock:status.displayClock, tbd:!!comp.timeValid===false && comp.timeValid!==undefined,
    a:side('away'), h:side('home'), date:ev.date || comp.date, id:ev.id, sit:comp.situation||null, tv:bc,
    link:((ev.links||[]).find(l=>(l.rel||[]).includes('summary'))||(ev.links||[])[0]||{}).href||''};
}
const toStory = (a, key, src, chip, chipColor, chipLogo) => ({key, src, chip, chipColor, chipLogo, title:a.headline, published:a.published, byline:a.byline||'',
  ago:ago(a.published), img:a.images&&a.images[0]&&a.images[0].url, link:a.links&&a.links.web&&a.links.web.href});
async function loadLive(){
  const lgs = activeLeagues();
  const sb = await Promise.allSettled(lgs.map(k => timed(API+LG[k].path+'/'+LG[k].sb).then(j => j.events.map(e=>parseEvent(e,k)))));
  const got = sb.filter(r=>r.status==='fulfilled').flatMap(r=>r.value);
  if(!got.length && sb.every(r=>r.status==='rejected')) throw new Error('no live data');
  games = got;

  /* One news feed per pick: league feeds for league tiles, team feeds for team tiles */
  const feeds = await Promise.allSettled(picks.map(p => {
    const L = LG[p.lg];
    if(p.type==='league') return timed(API+L.path+'/news?limit=8').then(j => j.articles.map(a=>toStory(a, p.lg, L.name, L.label, L.color, L.logo)));
    const v = pickView(p);
    return timed(API+L.path+'/news?team='+p.id+'&limit=6').then(j => j.articles.map(a=>toStory(a, pickKey(p), p.full, p.ab, v.bg, p.logo)));
  }));
  const groups = feeds.map(r => r.status==='fulfilled' ? r.value : []);
  tileMeta = {};
  picks.forEach((p,i) => { const g = groups[i]; if(g.length){ const newest = g.reduce((m,s)=> new Date(s.published)>new Date(m.published)?s:m); tileMeta[pickKey(p)] = {ago:newest.ago, count:g.length}; } });
  /* Round-robin across picks so every team gets a turn near the top, no duplicate headlines */
  const out = [], seenTitles = new Set();
  for(let i=0; i<8; i++) groups.forEach(g => { const s = g[i]; if(s && !seenTitles.has(s.title)){ seenTitles.add(s.title); out.push(s); } });
  if(out.length) stories = out;
  liveMode = true;
}
function sampleMode(){
  games = SAMPLE_GAMES;
  const keys = new Set(picks.map(pickKey));
  stories = SAMPLE_STORIES.filter(s => s.key==='featured' || keys.has(s.key));
  tileMeta = {}; stories.forEach(s => { if(!tileMeta[s.key]) tileMeta[s.key] = {ago:s.ago, count:1}; });
}
function refresh(){ return loadLive().then(renderAll).catch(()=>{}); }

/* ================= Boot ================= */
sampleMode(); renderAll();
picks.forEach(p => { if(p.type==='team' && !p.colorChecked) fillColors(p); });
refresh();
setInterval(()=>{ if(liveMode) loadLive().then(()=>{ renderTicker(); renderScores(); if(drawerOpen()) renderDrawer(); if(tpKey){ const p = picks.find(x=>pickKey(x)===tpKey); if(p) loadTeamGames(p); } }).catch(()=>{}); }, 60000);
})();
</script>
