<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Team Stream">
<meta name="theme-color" content="#4a4a4d">
<link rel="apple-touch-icon" href="huddle-icon.png">
<title>Team Stream</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Kaushan+Script&family=Roboto+Condensed:wght@400;700&display=swap">
<style>
/* Layout: 2015-era sports stream app — score ticker on top, full-bleed story cards, team-color tile rail, three-tab bar fixed at the bottom */
:root{
  --chrome:#2b2b2d;      /* app chrome / card body */
  --chrome-2:#3a3a3d;    /* raised strips */
  --ink:#141415;         /* deepest bg */
  --paper:#f2f2f0;       /* primary text */
  --mute:#a3a3a6;        /* timestamps, labels */
  --flame:#e8542a;       /* the one accent: active tab */
  --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue Condensed",sans-serif;
  --font-body:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --font-script:"Kaushan Script","Brush Script MT","Segoe Script",cursive;
  --bar:#3c3c3f;         /* header bar */
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--chrome);position:relative;overflow:hidden}

/* ---------- Top games ticker ---------- */
/* Ticker sits on a charcoal band darker than the header, with room above and a dark gutter before the stream */
.ticker{background:#242426;display:flex;align-items:stretch;gap:0;flex:none;position:relative;padding:8px 0 9px;box-shadow:inset 0 3px 5px -2px rgba(0,0,0,.65), inset 0 -1px 0 rgba(255,255,255,.04);border-bottom:4px solid var(--ink)}
.ticker-label{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a9a9ad;font-size:10px;padding:0 2px 0 5px;flex:none;display:flex;align-items:center;justify-content:center}
.ticker-rail{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 6px 0 3px;gap:5px;scrollbar-width:none;flex:1;min-width:0}
.ticker-rail::-webkit-scrollbar{display:none}
.appbar{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:50px;background:linear-gradient(180deg,#46464a,var(--bar));border-bottom:0;padding:0 max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px))}
.appbar .icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff}
.appbar .icon svg{width:22px;height:22px}
.wordmark{justify-self:center;display:flex;align-items:baseline;gap:3px;line-height:1;white-space:nowrap;user-select:none}
.wordmark b{font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:.04em;color:#fff;text-transform:uppercase}
.wordmark i{font-family:var(--font-script);font-style:normal;font-size:24px;color:var(--flame);transform:rotate(-4deg) translateY(1px);display:inline-block;text-shadow:0 1px 0 rgba(0,0,0,.35)}
/* 3.5 cards visible on a phone before scrolling: (app width - label - padding - 3 gaps) / 3.5 */
.game{flex:none;width:clamp(86px,calc((min(100vw,480px) - 46px) / 3.5),124px);scroll-snap-align:start;display:flex;flex-direction:column;font-family:var(--font-display);border-radius:2px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.game-status{background:#3a3a3d;font-size:10px;letter-spacing:.03em;line-height:1;padding:4px 5px 3px;color:#fff;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.team-row{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;height:21px;padding:0 5px 0 24px;font-size:12.5px;line-height:1;gap:3px;font-variant-numeric:tabular-nums}
/* Logo is oversized and pushed off the left edge so only its right side shows, clipped top/bottom/left by the row */
.team-row .mono{position:absolute;left:-13px;top:50%;width:34px;height:34px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;pointer-events:none}
.team-row .mono img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(1px 0 1px rgba(0,0,0,.35))}
.team-row .mono.txt{justify-content:flex-end;font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:-.02em;color:rgba(255,255,255,.3);padding-right:0}
.team-row .ab,.team-row .sc,.team-row .rec{position:relative;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.team-row .ab{font-weight:400;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.team-row .rk{font-size:8.5px;opacity:.8;margin-right:2px}
.team-row .sc{font-weight:500;min-width:16px;font-size:13px;text-align:right}
.team-row .rec{font-size:10px;font-weight:300;opacity:.85;margin-left:2px;top:-1.1px}  /* lift the smaller record so it centers on the abbreviation instead of sitting on its baseline */
.team-row.loser{opacity:.62}

/* ---------- Views ---------- */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none!important}

/* story card */
.card{background:var(--chrome);border-bottom:6px solid var(--ink)}
.card-head{display:flex;align-items:flex-end;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.card-head .src{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:13px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.src-chip{min-width:22px;height:22px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff;border-radius:3px}
.card h2{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.08;margin:0;letter-spacing:.005em;text-wrap:balance;flex:1;min-width:0}
.card .ago{font-family:var(--font-display);font-size:18px;color:var(--mute);flex:none;align-self:flex-start;padding-top:22px}
.headline-wrap{display:flex;gap:10px;padding:0 max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}

.hero{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:#101014}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .art{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.hero .over{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--font-display);text-transform:uppercase}
.hero .over b{display:block;font-size:clamp(30px,10vw,46px);font-weight:700;letter-spacing:.02em;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero .over span{display:block;font-size:clamp(14px,4.4vw,20px);letter-spacing:.18em;font-weight:400;opacity:.85;margin-top:4px}

.actions{display:grid;grid-template-columns:repeat(4,1fr) 44px;background:var(--chrome-2);font-family:var(--font-display);font-size:15px;color:#cfcfd2}
.actions button{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 0}
.actions svg{width:17px;height:17px;fill:currentColor}
.actions button[aria-pressed="true"]{color:#ffc93a}

/* team tile rail */
.rail{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--ink);scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
/* 5 cards + a thin sliver of the 6th: (screen - rail padding & gaps - sliver) / 5 */
.tile{flex:none;width:clamp(64px,calc((min(100vw,480px) - 30px) / 5),92px);height:auto;aspect-ratio:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-top:4px;color:#fff;scroll-snap-align:start;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .dot{position:absolute;top:5px;left:5px;width:5px;height:5px;border-radius:50%;background:#fff}
.tile.seen .dot{display:none}
.tile .t-ago{position:absolute;top:3px;right:4px;font-family:var(--font-display);font-size:10px;line-height:1;opacity:.85}
.tile .badge{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.02em}
.tile .t-name{font-family:var(--font-display);font-size:11.5px;line-height:1.2;letter-spacing:.01em}
.tile[aria-pressed="true"]{outline:2px solid #fff;outline-offset:-2px}

.filterbar{display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute);background:var(--ink)}
.filterbar button{color:var(--flame)}

/* compact story */
.mini{display:flex;gap:12px;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));background:var(--chrome);border-bottom:1px solid #222224}
.mini .thumb{width:96px;aspect-ratio:4/3;flex:none;background:#151517;overflow:hidden;position:relative}
.mini .thumb img{width:100%;height:100%;object-fit:cover}
.mini .thumb .art{position:absolute;inset:0}
.mini .txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.mini h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:18px;line-height:1.12;text-wrap:balance}
.mini .meta{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}

/* scores view */
.league-head{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--mute);background:var(--ink);padding:10px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.score-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--chrome);border-bottom:1px solid #222224;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.score-row .teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.score-row .tl{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.score-row .sw{width:6px;height:22px;flex:none}
.score-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-row .tl b{font-weight:600;min-width:28px;text-align:right}
.score-row .st{font-family:var(--font-display);font-size:13px;text-transform:uppercase;color:var(--mute);text-align:right;width:84px}
.score-row .st.live{color:#ff4b3a}

/* alerts view */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--chrome);border-bottom:1px solid #222224;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px))}
.alert .src-chip{width:34px;height:34px;font-size:12px;border-radius:50%;flex:none}
.alert p{margin:0;font-size:15px;line-height:1.3}
.alert .meta{font-size:12px;color:var(--mute);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.alert.unread p{font-weight:700}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.25fr 1fr;background:#3b3b3e;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;box-shadow:0 -1px 0 #1b1b1d}
.tab{height:58px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-display);font-size:21px;color:#e5e5e7;position:relative}
.tab[aria-selected="true"]{background:var(--flame);color:#fff}
.tab .count{position:absolute;top:8px;right:calc(50% - 46px);background:#d7261e;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-family:var(--font-body);font-weight:700}
.tab .bars{width:20px;display:flex;flex-direction:column;gap:3px;opacity:.75}
.tab .bars i{display:block;height:2px;background:currentColor}
.tab .pip{width:7px;height:7px;border-radius:50%;background:#fff;margin-left:2px;align-self:flex-start;margin-top:17px}


/* tile logos + add tile */
.tile .t-logo{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.tile .t-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.logo-txt{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff}
.tile .t-name{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.add{background:var(--chrome-2);box-shadow:inset 0 0 0 2px #5a5a5e}
.tile.add .plus{font-family:var(--font-display);font-size:28px;line-height:.9;font-weight:400;color:var(--flame)}
.src-chip.logo{padding:1px}
.src-chip.logo img{width:20px;height:20px;object-fit:contain}
.src-chip .logo-txt{font-size:10px}
.tile .logo-txt{font-size:12px}
.ticker-empty{font-family:var(--font-display);color:var(--mute);font-size:14px;padding:22px 10px;white-space:nowrap}

/* team picker sheet */
.sheet{position:absolute;inset:0;z-index:20;background:var(--chrome);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.sheet-head h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.done{background:var(--flame);color:#fff;font-family:var(--font-display);font-size:17px;padding:7px 18px}
.picked-label,.section-label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--mute)}
.picked-label{background:var(--ink);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.section-label{background:var(--ink);padding:10px 14px 7px}
.picked{display:flex;gap:4px;overflow-x:auto;padding:6px 8px 10px;background:var(--ink);min-height:82px;scrollbar-width:none;flex:none}
.picked::-webkit-scrollbar{display:none}
.pchip{flex:none;width:66px;height:66px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-family:var(--font-display);font-size:11px}
.pchip img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.pchip>span:last-child{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .x{position:absolute;top:1px;right:4px;font-size:15px;line-height:1;opacity:.9}
.picked-empty{color:var(--mute);font-size:14px;padding:22px 6px}
.lg-tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--chrome-2);flex:none}
.lg-tab{padding:11px 0 9px;font-family:var(--font-display);font-size:17px;color:#cfcfd2;border-bottom:3px solid transparent}
.lg-tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--flame)}
.search{padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:var(--chrome-2);border-top:1px solid #2a2a2c;flex:none}
.search input{width:100%;font:16px var(--font-body);color:var(--paper);background:var(--ink);border:1px solid #4a4a4e;padding:9px 12px;border-radius:0}
.search input:focus{outline:2px solid var(--flame);outline-offset:-1px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--chrome);border-bottom:1px solid #222224;padding:9px max(14px,env(safe-area-inset-right,0px)) 9px max(14px,env(safe-area-inset-left,0px))}
.opt .lg{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.opt .lg img{width:32px;height:32px;object-fit:contain}
.opt .nm{flex:1;min-width:0;font-size:17px;display:flex;flex-direction:column;gap:1px}
.opt .sub{font-size:12px;color:var(--mute);letter-spacing:.04em}
.opt .chk{width:28px;height:28px;flex:none;border:2px solid #6a6a6e;border-radius:50%;position:relative}
.opt .chk::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:#bdbdc0}
.opt[aria-pressed="true"] .chk{background:var(--flame);border-color:var(--flame)}
.opt[aria-pressed="true"] .chk::after{content:"✓";color:#fff;font-size:15px}
.league-opt{background:var(--chrome-2)}
.opt .lg.plate{background:#1c1c1e;border-radius:50%}
.conf-label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--mute);background:var(--ink);padding:10px max(14px,env(safe-area-inset-right,0px)) 7px max(14px,env(safe-area-inset-left,0px))}

.datanote{font-size:11px;color:var(--mute);text-align:center;padding:14px 16px 4px;letter-spacing:.04em}

/* ===== Reference pass: medium-gray app, condensed type, tight seams (matches the 2015 stream-app screenshots) ===== */
:root{
  --chrome:#4a4a4d;      /* card body + header */
  --chrome-2:#58585b;    /* action bar */
  --ink:#38383b;         /* seams between sections */
  --bar:#4a4a4d;         /* header bar = card gray */
  --mute:#b9b9bc;        /* source labels, timestamps */
}
.appbar{background:var(--bar);height:48px}
.wordmark b{font-weight:700;font-size:27px;letter-spacing:.02em}
.wordmark i{font-size:23px}
/* ticker: slightly darker band than the header, dark status strip, cards on top */
.ticker{background:#3a3a3d;padding:6px 0 7px;border-bottom:0;box-shadow:inset 0 2px 4px -2px rgba(0,0,0,.5)}
.ticker-label{font-family:var(--font-display);font-weight:400;font-size:12px;letter-spacing:.02em;text-transform:none;color:#c9c9cc}
.game{border-radius:0;box-shadow:0 1px 1px rgba(0,0,0,.35)}
.game-status{background:#2c2c2e;font-size:12px;font-weight:500;letter-spacing:.01em;padding:4px 5px 3px}
.team-row{font-size:14px}
.team-row .ab{font-weight:500;letter-spacing:0}
.team-row .sc{font-size:14.5px;font-weight:600}
.team-row .rec{font-size:11.5px;font-weight:400;top:-.6px}
.team-row .rk{font-size:10px}
/* story cards: gray body, light-gray source line, big condensed headline */
.card{border-bottom:0}
.card + .card,.card + .mini{border-top:3px solid var(--ink)}  /* the rail band itself separates the cards around it, like the ticker */
.card-head{padding:10px max(14px,env(safe-area-inset-right,0px)) 2px max(14px,env(safe-area-inset-left,0px))}
.card-head .src{font-family:var(--font-display);font-size:19px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--mute);gap:7px}
.src-chip{border-radius:2px}
.card h2{font-weight:500;font-size:25px;line-height:1.04;letter-spacing:0}
.card .ago{font-size:19px;font-weight:400;padding-top:3px}
.headline-wrap{padding-bottom:9px}
.actions{background:var(--chrome-2);font-size:18px;font-weight:400;color:#c6c6c9}
.actions button{padding:9px 0}
/* team rail: same darker band as the ticker, cards sitting on it with a buffer above and below */
.rail{background:#3a3a3d;padding:6px 4px 7px;gap:4px;box-shadow:inset 0 2px 4px -2px rgba(0,0,0,.5)}
.tile{box-shadow:0 1px 1px rgba(0,0,0,.35)}
.tile .t-name{font-size:13.5px;font-weight:500;letter-spacing:0}
.tile .t-ago{font-size:12px;font-weight:500;top:4px;right:5px}
.tile .dot{width:6px;height:6px;top:6px;left:6px}
.mini{border-bottom:1px solid var(--ink)}
.mini h3{font-weight:500;font-size:18px;line-height:1.06}
.mini .meta{font-family:var(--font-display);font-size:14px;letter-spacing:0;text-transform:none}
.filterbar,.league-head{background:var(--ink)}
.score-row,.alert{border-bottom:1px solid var(--ink)}
/* tab bar: lighter gray, condensed labels, My Teams icon stacked over its label */
.tabs{background:#5a5a5d;box-shadow:0 -1px 0 #444447}
.tab{font-size:24px;font-weight:400;color:#f0f0f2;height:56px}
.tab .count{top:7px;right:calc(50% - 40px)}
.tab-teams{flex-direction:column;gap:3px}
.tab-teams .bars{width:22px;gap:2px;opacity:.6}
.tab-teams .bars i{height:1.5px}
.tab-teams .lbl{display:flex;align-items:flex-start;line-height:1}
.tab-teams .pip{margin:2px 0 0 4px;width:6px;height:6px}

/* ===== My Teams drawer: one row per pick, pulled up from the My Teams tab ===== */
.drawer{position:absolute;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--chrome);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer-bar{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:var(--chrome)}
.drawer-bar button{position:relative;height:42px;background:#5e5e62;color:#ececee;font-family:var(--font-display);font-size:20px;box-shadow:0 1px 2px rgba(0,0,0,.35);overflow:hidden}
.drawer-bar .flag{position:absolute;top:0;right:12px;width:24px;height:30px;background:var(--flame);color:#fff;font-size:12px;font-weight:600;display:flex;justify-content:center;padding-top:5px;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.drawer-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#3a3a3d;box-shadow:inset 0 2px 4px -2px rgba(0,0,0,.5),inset 0 -2px 4px -2px rgba(0,0,0,.5);padding:10px 8px;display:flex;flex-direction:column;gap:10px}
.trow{position:relative;overflow:hidden;flex:none;display:flex;align-items:stretch;width:100%;min-height:60px;text-align:left;color:#fff;box-shadow:0 1px 1px rgba(0,0,0,.35)}
.trow:active{filter:brightness(1.08)}
/* same cropped-logo treatment as the ticker, scaled up for the taller row */
.trow .tlogo{position:absolute;left:-16px;top:50%;width:84px;height:84px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;pointer-events:none}
.trow .tlogo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(1px 0 1px rgba(0,0,0,.35))}
.trow .tlogo .logo-txt{font-size:44px;color:rgba(255,255,255,.3);margin-left:auto}
.trow .tname{flex:1;min-width:0;display:flex;align-items:center;padding:0 10px 0 78px;font-family:var(--font-display);font-size:23px;font-weight:400;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.trow .tname span{overflow:hidden;text-overflow:ellipsis;line-height:1.45}  /* tall enough that ascenders/descenders aren't clipped by the ellipsis box */
.trow .tago{flex:none;display:flex;align-items:center;padding:0 14px 0 6px;font-family:var(--font-display);font-size:18px;color:rgba(255,255,255,.72)}
.trow .tgame{flex:none;display:flex;align-items:center;gap:5px;padding:0 5px 0 8px;border-left:1px solid rgba(255,255,255,.7);font-family:var(--font-display);font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.tgame .tg-rows{display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:2px;font-size:14px;font-weight:400;line-height:1.15}
.tgame .tg-rows b{font-weight:400;text-align:right;min-width:12px}
.tgame .tg-st{writing-mode:vertical-rl;font-size:11px;font-weight:400;letter-spacing:.02em;white-space:nowrap;max-height:56px;overflow:hidden}
.tgame.live .tg-st{color:#fff}
.drawer-empty{color:var(--mute);font-family:var(--font-display);font-size:17px;text-align:center;padding:28px 16px}

/* ===== Team / league page: full page tinted in the team's color ===== */
.tpage{position:absolute;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;background:var(--tp-bg,#2e3a33);transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.tpage.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.tp-head{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:52px;background:var(--tp-bar,#36443b);border-bottom:1px solid rgba(255,255,255,.12);padding:0 max(4px,env(safe-area-inset-right,0px)) 0 max(4px,env(safe-area-inset-left,0px))}
.tp-head .back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff}
.tp-head .back svg{width:22px;height:22px}
.tp-title{justify-self:center;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;font-family:var(--font-display);font-size:26px;font-weight:400;color:#fff;line-height:1.3;white-space:nowrap}
.tp-title span{overflow:hidden;text-overflow:ellipsis}
.tp-title svg{width:12px;height:12px;flex:none}
.tp-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 16px}
.tp-sec{padding:12px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
/* game box */
.gbox-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--font-display);font-size:16px;color:rgba(255,255,255,.75);padding:2px 2px 6px;line-height:1.2}
.gbox-top .st{color:#fff}
.gbox-top a{color:#fff;text-decoration:none;white-space:nowrap}
.gbar{display:grid;grid-template-columns:1fr 74px 1fr;height:58px;background:rgba(0,0,0,.18)}
.gside{position:relative;overflow:hidden;display:flex;align-items:center;font-family:var(--font-display);font-size:34px;font-weight:300;color:#fff;font-variant-numeric:tabular-nums;line-height:1.2}
.gside.away{justify-content:flex-end;padding-right:14px}
.gside.home{justify-content:flex-start;padding-left:14px}
.gside .glogo{position:absolute;top:50%;width:76px;height:76px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center}
.gside.away .glogo{left:-14px}
.gside.home .glogo{right:-14px}
.gside .glogo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.gside .glogo .logo-txt{font-size:40px;color:rgba(255,255,255,.35)}
.gside .gsc{position:relative;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.gside .grec{position:relative;font-size:17px;font-weight:400;opacity:.85}
.gside.lost .gsc{opacity:.6}
.gmid{display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-family:var(--font-display);font-size:13px;line-height:1.1;text-align:center;padding:0 4px}
.gmid .at{font-size:20px;opacity:.7}
.gmid svg.bases{width:36px;height:28px}
.gmid .outs{display:flex;flex-direction:column;gap:3px}
.gmid .outs i{display:block;width:5px;height:5px;border:1px solid rgba(255,255,255,.7)}
.gmid .outs i.on{background:#fff}
/* line score */
.lscore{overflow-x:auto;margin-top:8px;font-family:var(--font-display);color:#fff}
.lscore table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.lscore th,.lscore td{padding:2px 4px;text-align:center;font-weight:400;white-space:nowrap}
.lscore th{color:rgba(255,255,255,.65);font-size:13px}
.lscore th.tot,.lscore td.tot{color:#fff;font-weight:600}
.lscore .rhe{color:var(--flame)}
.lscore td:first-child,.lscore th:first-child{text-align:left;padding-left:2px;color:rgba(255,255,255,.85);width:99%}
/* stories on the team page */
.tlead{position:relative;display:block;margin:12px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));aspect-ratio:16/11;overflow:hidden;background:#111;color:#fff;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tlead img,.tlead .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tlead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75))}
.tlead h3{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;margin:0;font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.08;text-wrap:balance;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tcard{display:flex;gap:10px;margin:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:#e7e7e4;color:#161616;text-decoration:none;min-height:96px;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.tcard .th{width:42%;max-width:170px;flex:none;position:relative;overflow:hidden;background:#bbb}
.tcard .th img,.tcard .th .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcard .tx{min-width:0;padding:8px 10px 8px 0;display:flex;flex-direction:column;gap:4px}
.tcard h4{margin:0;font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.08;text-wrap:balance}
.tcard .via{font-size:12px;color:#7d7d80}
.tp-empty{font-family:var(--font-display);font-size:17px;color:rgba(255,255,255,.75);text-align:center;padding:24px 16px}
.tp-games{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:10px max(12px,env(safe-area-inset-left,0px)) 2px}
.tp-games::-webkit-scrollbar{display:none}

/* team page tabs, pregame names, standings, schedule */
.tp-head{border-bottom:0}
.tp-tabs{flex:none;display:flex;gap:4px;background:var(--tp-bar,#36443b);padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid rgba(0,0,0,.25);overflow-x:auto;scrollbar-width:none}
.tp-tab{font-family:var(--font-display);font-size:19px;font-weight:400;color:rgba(255,255,255,.7);padding:6px 12px 7px;border-bottom:3px solid transparent;line-height:1.2;white-space:nowrap}
.tp-tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--flame)}
.linkish{font-family:var(--font-display);font-size:16px;color:#fff;white-space:nowrap}
.gside .gname{position:relative;display:flex;flex-direction:column;font-size:18px;font-weight:400;line-height:1.1;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.gside .gname small{font-size:13px;opacity:.8}
.gside.away .gname{align-items:flex-end;text-align:right}
.gside.away.pre{padding-left:56px}
.gside.home.pre{padding-right:56px}
.gside .gname{min-width:0;overflow:hidden}
.stand{margin:12px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.18);font-family:var(--font-display);color:#fff}
.stand-h{font-size:17px;padding:8px 10px 4px;color:#fff}
.stand table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.stand th{font-weight:400;font-size:12.5px;color:rgba(255,255,255,.6);padding:2px 8px 4px;text-align:right}
.stand td{padding:5px 8px;text-align:right;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap}
.stand td:first-child{text-align:left;width:99%;max-width:0;overflow:hidden;text-overflow:ellipsis}
.stand tr.me td{background:rgba(255,255,255,.12);font-weight:600}
.stl{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;vertical-align:middle;margin-right:7px;flex:none}
.stl img{width:100%;height:100%;object-fit:contain}
.stl .logo-txt{font-size:9px}
.sched{margin:6px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));font-family:var(--font-display);color:#fff}
.sch-month{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:12px 2px 5px}
.sch-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;padding:7px 8px;background:rgba(0,0,0,.18);margin-bottom:3px;color:#fff;text-decoration:none;font-size:16px}
.sch-row.next{box-shadow:inset 3px 0 0 var(--flame);background:rgba(255,255,255,.1)}
.sch-d{display:flex;flex-direction:column;font-size:12px;color:rgba(255,255,255,.65);line-height:1.1}
.sch-d b{font-size:15px;font-weight:500;color:#fff}
.sch-o{min-width:0;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.sch-o em{font-style:normal;color:rgba(255,255,255,.6);margin-right:6px;font-size:14px}
.sch-o small{font-size:11px;opacity:.7}
.sch-r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sch-r small{font-size:12px;opacity:.7}
.sch-r .w{color:#7fd67f;font-weight:600}
.sch-r .l{color:#ff8a7a;font-weight:600}
.sch-r .lv{color:#fff;font-weight:600}



/* ===== Game box v3: short, wide rows in team colors ===== */
.tp-head{background:linear-gradient(180deg,var(--tp-bar),var(--tp-bar2,var(--tp-bar)))}
.tp-tabs{background:var(--tp-bar2,var(--tp-bar))}
.gb{position:relative;overflow:hidden;background:#38383b;border-bottom:3px solid #2a2a2c;font-family:var(--font-display);color:#fff}
.gb-top{display:flex;justify-content:space-between;align-items:center;gap:10px;height:24px;padding:0 10px;font-size:13.5px;font-weight:600;line-height:1}
.gb-top .st{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.gb-top a,.gb-top .linkish{font-size:13px;font-weight:600;color:#fff;text-decoration:none;white-space:nowrap}
.gb-row{display:flex;height:36px}
.gb-a,.gb-h{position:relative;overflow:hidden;display:flex;align-items:center;min-width:0}
.gb-a{flex:0 0 50%;background:var(--ca);justify-content:flex-end;padding:0 10px}
.gb-h{flex:1 1 auto;background:var(--ch);padding:0 0 0 10px}
.gb-row b{font-size:25px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.gb-row b.lost{opacity:.7}
/* logos: cropped by the row/box edges */
.gb-logo{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.gb-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.gb-logo .logo-txt{font-size:26px;color:rgba(255,255,255,.3)}
.gb-logo.a{left:-8px;top:50%;width:54px;height:54px;transform:translateY(-50%)}
.gb-logo.h{right:-8px;top:50%;width:54px;height:54px;transform:translateY(-50%)}
.gb-logo.a2{left:-10px;top:50%;width:56px;height:56px;transform:translateY(-50%)}
/* pregame: name + record stacked where the score goes */
.gb.pre .gb-a{padding-left:46px}
.gb.pre .gb-h{padding-right:46px}
.gb-nm{display:flex;flex-direction:column;font-size:16px;font-weight:600;line-height:1.05;white-space:nowrap;min-width:0;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.gb-a .gb-nm{align-items:flex-end;text-align:right}
.gb-nm small{font-size:12.5px;font-weight:500;opacity:.85}
/* live/final: period headers ride in the home color, values line up below */
.gb-cells{display:flex;flex:none;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.gb-cells .c{width:var(--cw);text-align:center}
.gb-h .gb-cells{margin-left:auto;margin-right:44px;font-size:12px;font-weight:500;color:rgba(255,255,255,.85)}
.gb-h .gb-cells .tot{color:var(--flame);font-weight:600}
.gb-sub{position:relative;overflow:hidden;padding:3px 0 5px 50px}
.gb-line{display:flex;align-items:center;height:18px}
.gb-tn{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-tn small{font-size:12px;font-weight:500;color:rgba(255,255,255,.6)}
.gb-line .gb-cells{margin-right:44px}
.gb-line .gb-cells .tot{font-weight:700}
.gb-sit{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.gb-sit svg.bases{width:24px;height:18px}
.gb-sit .outs{display:flex;flex-direction:column;gap:2px}
.gb-sit .outs i{display:block;width:4px;height:4px;border:1px solid rgba(255,255,255,.7)}
.gb-sit .outs i.on{background:#fff}
.gb-gap{height:6px}

/* ===== Game box v4 fixes: even split, logos inside their own team block, line score fully in the gray area ===== */
.gb-a{flex:0 0 50%;padding:0 12px 0 48px}
.gb-h{flex:0 0 50%;padding:0 48px 0 12px}
.gb.post .gb-a{justify-content:flex-end}
.gb.post .gb-h{justify-content:flex-start}
.gb-sub{padding:4px 10px 6px 10px}
.gb-line .gb-cells{margin-right:0}
.gb-line.hd{height:16px}
.gb-line.hd .gb-cells{font-size:12px;font-weight:500;color:rgba(255,255,255,.65)}
.gb-line.hd .gb-cells .tot{color:var(--flame);font-weight:600}

/* taller rows (36 -> 44px) and the main score in the app's regular Barlow digits (not tabular), medium weight */
.gb-row{height:44px}
.gb-row b{font-family:var(--font-display);font-size:30px;font-weight:500;font-variant-numeric:normal;letter-spacing:.01em}
.gb-logo.a,.gb-logo.h{width:62px;height:62px}
.gb-a{padding-left:56px}
.gb-h{padding-right:56px}
.gb-top{height:26px}
.gb-nm{font-size:17px}
.gb-nm small{font-size:13px}
.gb-line{height:19px}

/* a tick taller again (44 -> 48px) */
.gb-row{height:48px}
.gb-row b{font-size:32px}
.gb-logo.a,.gb-logo.h{width:66px;height:66px}
.gb-a{padding-left:60px}
.gb-h{padding-right:60px}
/* team page header: same base gray as the main header, team name white and centered */
.tp-head,.tp-tabs{background:var(--bar)}
.tp-head{border-bottom:0}
.tp-tabs{border-bottom:1px solid rgba(0,0,0,.3)}
.tp-title{color:#fff;justify-content:center;text-align:center}
.tp-title{position:relative;overflow:visible;max-width:calc(100% - 40px)}
.tp-title svg{position:absolute;right:-18px;top:50%;transform:translateY(-50%)}  /* arrow sits outside so the name itself is centered */

/* last 3 plays under a live box score */
.gb-plays{border-top:1px solid rgba(255,255,255,.08);background:#333336}
.gp{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.gp:last-child{border-bottom:0}
.gp-logo{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.gp-logo img{width:100%;height:100%;object-fit:contain}
.gp-logo .logo-txt{font-size:10px}
.gp-txt{font-family:var(--font-body);font-size:13px;line-height:1.25;color:#e6e6e8;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gp.score .gp-txt{color:#fff;font-weight:700}
.gp-when{font-family:var(--font-display);font-size:13.5px;font-weight:500;color:rgba(255,255,255,.75);text-align:right;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}

/* plays sit seamlessly in the game box: same background, no divider; bigger logos and text */
.gb-plays{border-top:0;background:transparent;padding:2px 0 4px}
.gp{grid-template-columns:40px 1fr auto;gap:10px;padding:6px 10px;border-bottom:0}
.gp-logo{width:38px;height:38px}
.gp-txt{font-size:15px;line-height:1.25}
.gp-when{font-size:15px}

/* time/status strip: same height as a team row (21px) */
.game-status{height:21px;padding:0 5px;align-items:center}

/* headlines a step bolder, like the reference */
.card h2{font-weight:600;letter-spacing:-.005em}
.mini h3{font-weight:600}

/* schedule: ranking sits as a small number before the name with proper spacing */
.sch-rk{flex:none;font-size:12px;font-weight:500;color:rgba(255,255,255,.6);margin-right:5px;line-height:1}
.sch-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}



/* Alerts is display-only */
#tab-alerts,[data-go="alerts"]{cursor:default}
#tab-alerts:active{transform:none}
/* ===== Scores tab (v3, matches the stream-app scoreboard) ===== */
.app[data-view="scores"] .ticker{display:none}
#view-scores{background:#2c2c2e}
.sc-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px max(9px,env(safe-area-inset-right,0px)) 10px max(9px,env(safe-area-inset-left,0px));background:#3a3a3d}
.sc-chips::-webkit-scrollbar{display:none}
.sc-chip{flex:none;display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:17px;font-weight:500;color:#f0f0f2;background:#5b5b5f;padding:8px 15px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.sc-chip[aria-pressed="true"]{background:#77777c;box-shadow:inset 0 -3px 0 var(--flame),0 1px 2px rgba(0,0,0,.4)}

const hex = c => !c ? '#444' : (c[0]==='#' ? c : '#'+c);
function lum(c){ c = hex(c).slice(1); if(c.length!==6) return .3; const [r,g,b]=[0,2,4].map(i=>parseInt(c.substr(i,2),16)/255); return .2126*r+.7152*g+.0722*b; }
const teamBg = (color, alt) => (lum(color) > .78 && alt) ? hex(alt) : hex(color);
/* <img> that swaps itself for text if the logo can't load */
/* Dark-background ("500-dark") logo variants: ESPN publishes these for leagues and teams.
   Each <img> tries the dark version first, falls back to the regular logo, then to text. */
const darkUrl = u => !u ? '' : u.includes('/500-dark/') ? u : u.replace('/500/','/500-dark/');
window.hLogoErr = function(img, mode){
  const fb = img.getAttribute('data-fb');
  if(fb){ img.removeAttribute('data-fb'); img.src = fb; return; }
  const txt = img.getAttribute('data-txt') || '';
  if(mode==='ticker'){ const p = img.parentNode; p.classList.add('txt'); p.textContent = txt; return; }
  const b = document.createElement('b'); b.className = 'logo-txt'; b.textContent = txt; img.replaceWith(b);
};
function logoTag(src, text, mode, darkSrc){
  if(!src && !darkSrc) return '';
  const dark = darkSrc || darkUrl(src), fb = (src && src!==dark) ? src : '';
  return `<img src="${esc(dark)}"${fb?` data-fb="${esc(fb)}"`:''} data-txt="${esc(text)}" alt="" loading="lazy" onerror="hLogoErr(this${mode?",'"+mode+"'":''})">`;
}
const logoImg = (src, text) => src ? logoTag(src, text) : `<b class="logo-txt">${esc(text)}</b>`;
function timed(url, ms=7000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  return fetch(url,{signal:c.signal}).then(r=>{clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json();});
}
function ago(iso){ const m = Math.max(1, Math.round((Date.now()-new Date(iso))/60000)); return m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'; }

/* ---- Status strip: pregame "10/26 7:00PM CT" (date dropped on game day), live "3rd ... 2:50", "Final" ---- */
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function periodLabel(g){ const reg = (LG[g.lg]||{}).periods || 4; if(g.period>reg){ const k=g.period-reg; return (k>1?k:'')+'OT'; } return ordinal(g.period||1); }
function tzLabel(d){
  try{ const p = new Intl.DateTimeFormat('en-US',{timeZoneName:'shortGeneric'}).formatToParts(d).find(x=>x.type==='timeZoneName');
       if(p && p.value.length<=4) return p.value; }catch(e){}
  try{ const p = new Intl.DateTimeFormat('en-US',{timeZoneName:'short'}).formatToParts(d).find(x=>x.type==='timeZoneName');
       if(p) return p.value.replace(/^([A-Z])[SD]T$/,'$1T'); }catch(e){}
  return '';
}
function statusParts(g){
  if(g.postponed) return ['Postponed',''];
  if(g.lg==='mlb' && (g.live||g.final)) return [g.detail || (g.final?'Final':''), ''];
  if(g.final) return [g.period>((LG[g.lg]||{}).periods||4) ? 'Final/'+periodLabel(g) : 'Final',''];
  if(g.live){
    if(g.half) return ['Half',''];
    if(g.endPeriod) return ['End '+periodLabel(g),''];
    return [periodLabel(g), g.clock||''];
  }
  const d = new Date(g.date), now = new Date();
  const time = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s/g,'') + ' ' + tzLabel(d);
  const sameDay = d.toDateString()===now.toDateString();
  return [sameDay ? time : `${d.getMonth()+1}/${d.getDate()} ${time}`, ''];
}
const myTeamKeys = () => new Set(picks.filter(p=>p.type==='team').map(pickKey));
const gameHasMine = (g, mine) => mine.has(`${g.lg}:${g.a.id}`) || mine.has(`${g.lg}:${g.h.id}`);
function orderGames(list){
  const mine = myTeamKeys(), act = activeLeagues();
  const rank = g => g.live?0 : g.final?2 : 1;
  return list.filter(g => act.includes(g.lg))
    .sort((x,y)=> (gameHasMine(y,mine)-gameHasMine(x,mine)) || rank(x)-rank(y) || new Date(x.date)-new Date(y.date));
}
/* ---- Top Games (ticker): only games happening today, ranked by how much they're worth watching ----
   your teams > live (closer and later = higher) > big matchups (NFL, rankings, playoffs, national TV) > soonest kickoff;
   today's finals sort last */
const NATIONAL_TV = /^(ESPN|ESPN2|ABC|CBS|NBC|FOX|Fox|TNT|TBS|Prime Video|Peacock|NFL Net|NFL Network|MLB Network|NBA TV|truTV|FS1|Netflix)$/i;
function isToday(g){
  if(g.live) return true;                                   /* a late game past midnight still counts */
  const d = new Date(g.date), now = new Date();
  return d.toDateString()===now.toDateString();
}
function topGameScore(g, mine){
  let sc = 0;
  if(gameHasMine(g, mine)) sc += 1000;
  sc += ({nfl:120, cfb:30, nba:40, mlb:30, cbb:10})[g.lg] || 0;   /* a single NFL game outweighs a random weeknight game */
  const ra = g.a.rank||99, rh = g.h.rank||99;
  if(ra<=25 && rh<=25) sc += 160 + (50 - ra - rh);          /* ranked vs ranked */
  else if(Math.min(ra,rh)<=25) sc += 60 + (25 - Math.min(ra,rh));
  if(g.post) sc += 200;                                     /* playoffs */
  if(g.tv && NATIONAL_TV.test(g.tv)) sc += 40;
  if(g.live){
    sc += 400;
    const margin = Math.abs(Number(g.a.sc) - Number(g.h.sc));
    const close = g.lg==='mlb' ? 2 : (g.lg==='nfl'||g.lg==='cfb') ? 8 : 8;
    if(margin <= close) sc += 90 - margin*5;
    const reg = (LG[g.lg]||{}).periods || 4;
    if((g.period||0) >= reg) sc += 40;                     /* late in the game */
  } else if(g.final){
    sc -= 500;
  } else {
    const hrs = (new Date(g.date) - Date.now()) / 3600e3;
    sc += Math.max(0, 80 - hrs*6);                         /* starting soon */
  }
  return sc;
}
function topGames(list){
  const mine = myTeamKeys(), act = activeLeagues();
  return list.filter(g => act.includes(g.lg) && isToday(g))
    .map(g => [topGameScore(g, mine), g])
    .sort((x,y) => y[0]-x[0] || new Date(x[1].date)-new Date(y[1].date))
    .map(x => x[1]);
}

function teamRow(t, g){
  const showScore = g.live||g.final;
  const sc = showScore ? `<span class="sc">${esc(t.sc)}</span>` : '';
  const rec = (!showScore && t.rec) ? `<span class="rec">(${esc(t.rec)})</span>` : '';
  const loser = g.final && Number(t.sc) < Number((t===g.a?g.h:g.a).sc);
  const L = LG[g.lg] || {};
  const logo = t.logo || (t.ab ? (L.college ? (t.id?`https://a.espncdn.com/i/teamlogos/ncaa/500/${t.id}.png`:'') : `https://a.espncdn.com/i/teamlogos/${L.logoDir}/500/${t.ab.toLowerCase()}.png`) : '');
  const fallback = t.ab.slice(0,1);
  const mono = (logo || t.logoDark)
    ? `<span class="mono">${logoTag(logo, fallback, 'ticker', t.logoDark)}</span>`
    : `<span class="mono txt">${esc(fallback)}</span>`;
  return `<div class="team-row${loser?' loser':''}" style="background:${hex(t.color)}">
    ${mono}
    ${tickerMark(t,g)?`<span class="rk">${tickerMark(t,g)}</span>`:''}<span class="ab">${esc(t.ab)}${rec}</span>${sc}</div>`;
}

const tickerSlot = g => (LG[g.lg]||{}).college || (g.post && (g.a.seed || g.h.seed)) ? ' slot' : '';

function mini(st){
  const media = (st.thumb||st.img) ? `<img src="${esc(st.thumb||st.img)}" alt="" loading="lazy">` : art(st.art, st.title);
  const inner = `<div class="thumb">${media}</div><div class="txt"><h3>${esc(st.title)}</h3><span class="meta">${esc(st.src)} · ${esc(st.ago)}</span></div>`;
  return st.link ? `<a class="mini" href="${esc(st.link)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${inner}</a>` : `<div class="mini">${inner}</div>`;

/* A pick as it appears on a tile: league tiles use the league mark, team tiles the team logo */
function pickView(p){
  if(p.type==='league'){ const L = LG[p.lg]; return {key:p.lg, name:L.label, bg:L.color, logo:L.logo, text:L.label}; }
  return {key:pickKey(p), name: LG[p.lg].college ? p.location : p.nick, bg:teamBg(p.color,p.alt), logo:p.logo, text:p.ab};
}
function rail(){
  const tiles = picks.map(p => {
    const v = pickView(p), m = tileMeta[v.key] || {};
    const fresh = m.count && !seen.has(v.key);
    return `<button class="tile${fresh?'':' seen'}" style="background:${v.bg}" data-team="${esc(v.key)}" aria-pressed="${filter===v.key}" aria-label="${esc(v.name)} stories">
      <span class="dot"></span>${m.ago?`<span class="t-ago">${esc(m.ago)}</span>`:''}
      <span class="t-logo">${logoImg(v.logo, v.text)}</span><span class="t-name">${esc(v.name)}</span></button>`;
  }).join('');
  return `<div class="rail" aria-label="My teams">${tiles}
    <button class="tile add" data-edit aria-label="Add teams and leagues"><span class="plus">+</span><span class="t-name">${picks.length?'Edit':'Add Teams'}</span></button></div>`;
}
let streamShown = 5;                       /* full cards rendered so far on the main stream */
let streamObs = null;
function watchStreamEnd(){
  const sentinel = $('#streamMore'); if(!sentinel) return;
  if(!streamObs) streamObs = new IntersectionObserver(entries => {
    if(entries.some(en => en.isIntersecting)){ streamObs.disconnect(); const top = $('#view-teams').scrollTop; streamShown += 5; renderTeams(); $('#view-teams').scrollTop = top; }
  }, {root: $('#view-teams'), rootMargin: '0px 0px 600px 0px'});
  streamObs.disconnect(); streamObs.observe(sentinel);
}
function renderTeams(){
  const list = filter ? stories.filter(s=>s.key===filter) : stories;
  let html = '';
  if(filter){
    const p = picks.find(x=>pickKey(x)===filter); const v = p ? pickView(p) : {name:'Team'};
    html += rail() + `<div class="filterbar"><span>${esc(v.name)} stream · ${list.length} stories</span><button data-clear>All teams</button></div>`;
    html += list.length ? list.map((s,i)=> i===0?bigCard(s):mini(s)).join('') : `<div class="datanote">No new stories for ${esc(v.name)} yet.</div>`;
  } else {
    /* every story is a full card (newest first); the team rail sits after the first one */
    const show = list.slice(0, streamShown);

/* ================= Scores tab =================

let scTab = 'mine', scDay = 0, scMenu = false;
const scGroup = {cfb:'top25', cbb:'top25'};
const CFB_GROUPS = [['top25','Top 25','80'],['fbs','All FBS','80'],['acc','ACC','1'],['american','American','151'],['big12','Big 12','4'],['big10','Big Ten','5'],['cusa','C-USA','12'],['ind','FBS Independents','18'],['mac','MAC','15'],['mwc','Mountain West','17'],['pac12','Pac-12','9'],['sec','SEC','8'],['sunbelt','Sun Belt','37']];

const scCache = {};                       /* `${lg}|${group}|${yyyymmdd}` -> {list, t} */

const scGroups = lg => lg==='cfb' ? CFB_GROUPS : lg==='cbb' ? CBB_GROUPS : null;

function scUrl(lg, group, off){

}
async function loadScores(lg, group, off){

/* Football is played in weeks: NFL and CFB chips step through ESPN's season calendar instead of days */

async function loadWeekMeta(lg){
  if(weekMeta[lg] && !weekMeta[lg].err) return;

    const j = await timed(scUrl(lg, scGroupFor(lg,false), null), 12000);
    const weeks = [];
    (j.leagues[0].calendar||[]).forEach(c => { if(c.value==='2' || c.value==='3') (c.entries||[]).forEach(e =>

async function loadWeek(lg, group, idx){

const teamCache = {};          /* lg -> [{...team}] */
let pickerLg = 'nfl', pickerQuery = '', pickerOffline = {};
async function getTeams(lg){
  if(teamCache[lg]) return teamCache[lg];
  try{
    /* Standings list every team with logo and conference, and (unlike /teams) allow requests from other sites */
    const j = await timed(API_V2+LG[lg].path+'/'+LG[lg].teams, 12000);
    const out = [], ids = new Set();
    const walk = (g, conf) => {
      ((g.standings&&g.standings.entries)||[]).forEach(e => { const t = e.team; if(!t || ids.has(String(t.id)) || t.isActive===false) return; ids.add(String(t.id));
        out.push({lg, id:String(t.id), ab:t.abbreviation, location:t.location, nick:t.name || t.shortDisplayName, full:t.displayName,
          conf, logo:(t.logos&&t.logos[0]&&t.logos[0].href) || '',
          logoDark:((t.logos||[]).find(l=>(l.rel||[]).includes('dark'))||{}).href || ''}); });
      (g.children||[]).forEach(c => walk(c, c.shortName || c.abbreviation || c.name));
    };
    walk(j, j.shortName || j.abbreviation || LG[lg].label);
    if(!out.length) throw new Error('empty');
    const confs = [...new Set(out.map(t=>t.conf))].sort((a,b)=>a.localeCompare(b));
    teamCache[lg] = out.sort((a,b)=> confs.indexOf(a.conf)-confs.indexOf(b.conf) || a.full.localeCompare(b.full));
    pickerOffline[lg] = false;
  }catch(e){ teamCache[lg] = fallbackTeams(lg); pickerOffline[lg] = true; }

}

async function loadTeamGames(p){

function basesSvg(s){
  const d = (x,y,on) => `<rect x="${x}" y="${y}" width="9" height="9" transform="rotate(45 ${x+4.5} ${y+4.5})" fill="${on?'#fff':'rgba(0,0,0,.45)'}" stroke="rgba(255,255,255,.55)" stroke-width="1"/>`;
  return `<svg class="bases" viewBox="0 0 36 28" aria-label="Runners on base">${d(13.5,2,s.onSecond)}${d(24,12,s.onFirst)}${d(3,12,s.onThird)}</svg>`;
}
function gmid(g){
  const s = g.sit;
  if(g.live && g.lg==='mlb' && s){
    const outs = [0,1,2].map(i=>`<i class="${i<(s.outs||0)?'on':''}"></i>`).join('');
    return `<div class="gmid">${basesSvg(s)}<span class="outs" aria-label="${s.outs||0} outs">${outs}</span></div>`;
  }
  if(g.live && (g.lg==='nfl'||g.lg==='cfb') && s && (s.shortDownDistanceText||s.downDistanceText)){
    const l = String(s.possession)===String(g.a.id) ? '◂ ' : '', r = String(s.possession)===String(g.h.id) ? ' ▸' : '';
    return `<div class="gmid">${l}${esc(s.shortDownDistanceText||s.downDistanceText)}${r}</div>`;
  }
  return `<div class="gmid"><span class="at">${g.live||g.final?'':'@'}</span></div>`;
}
function teamLogoUrl(t, lg){ const L = LG[lg]||{}; return t.logo || (L.college ? (t.id?`https://a.espncdn.com/i/teamlogos/ncaa/500/${t.id}.png`:'') : `https://a.espncdn.com/i/teamlogos/${L.logoDir}/500/${(t.ab||'').toLowerCase()}.png`); }
function gside(t, g, which){

function scoresPreLabel(g){
  const d = new Date(g.date), today = d.toDateString()===new Date().toDateString();
  const time = g.tbd ? 'TBD' : d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s/g,'')+' '+tzLabel(d);
  return `${today ? '' : dayLabel(d)+' '}${time}${g.tv?' · '+g.tv:''}`;

function preLabel(g){
  const d = new Date(g.date), now = new Date(), tm = new Date(); tm.setDate(now.getDate()+1);
  const day = d.toDateString()===now.toDateString() ? 'Today' : d.toDateString()===tm.toDateString() ? 'Tomorrow' : dayLabel(d);
  const time = g.tbd ? 'TBD' : d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s/g,'')+' '+tzLabel(d);
  return `${day} ${time}${g.tv?' · '+g.tv:''}`;
}
/* ---- Game box: short, wide rows ----
   label line  : status/date ............................ link
   color row   : [away color: logo ... score or name+record][home color: score or name+record ... logo]  (50/50, each team's primary color)
   detail rows : (live/final only) period headers, then away / home name + record ..... period scores + TOT */
function gameBox(g, o={}){
  const show = g.live || g.final;
  const mlb = g.lg==='mlb', reg = (LG[g.lg]||{}).periods || 4;
  /* colors: scoreboard color, else a saved pick's color, else neutral */
  const pc = t => t.color || (picks.find(x=>x.type==='team' && x.lg===g.lg && String(x.id)===String(t.id))||{}).color || '#555558';
  g = {...g, a:{...g.a, color:pc(g.a)}, h:{...g.h, color:pc(g.h)}};
  let label, link = '';
  /* the whole box opens the game page; these are just the cue */
  if(g.final){ label = `${esc(statusParts(g)[0])}<span class="gb-date">${esc(dayLabel(new Date(g.date)))}</span>`; link = `<span class="gb-more">Box Score »</span>`; }
  else if(g.live){ label = esc(statusParts(g).filter(Boolean).join(' ')) + gsit(g); link = `<span class="gb-more">Gamecast »</span>`; }
  else { label = esc(o.scores ? scoresPreLabel(g) : preLabel(g)); link = o.scores ? `<span class="gb-more">Preview »</span>` : `<button class="linkish" data-tptab="schedule">Schedule »</button>`; }
  if(o.detail) link = '';
  const dg = gameAttr(g);
  const logo = (t, cls) => `<span class="gb-logo ${cls}">${logoTag(teamLogoUrl(t,g.lg), t.ab, '', t.logoDark)}</span>`;
  const rk = t => t.rank ? `<span class="gb-rk">${esc(t.rank)}</span>` : '';
  const nameRec = t => o.scores && show ? `<span class="ln">${rk(t)}${esc(t.name||t.ab)}</span><small class="plain">${t.rec?esc(t.rec):''}</small>`
                                         : `<span class="ln">${rk(t)}${esc(t.name||t.ab)}</span><small>${t.rec?' ('+esc(t.rec)+')':''}</small>`;
  const top = `<div class="gb-top"><span class="st">${label}</span>${link}</div>`;

  if(!show){
    return `<div class="gb pre"${dg}>${top}
      <div class="gb-row" style="--ca:${hex(g.a.color)};--ch:${hex(g.h.color)}">
        <div class="gb-a">${logo(g.a,'a')}<span class="gb-nm">${nameRec(g.a).replace('<small>','<small class="br">')}</span></div>
        <div class="gb-h"><span class="gb-nm">${nameRec(g.h).replace('<small>','<small class="br">')}</span>${logo(g.h,'h')}</div>
      </div></div>`;
  }
  const al = g.a.line||[], hl = g.h.line||[], n = Math.max(al.length, hl.length, reg);   /* all 4 quarters / 2 halves / 9 innings from the start */
  const heads = Array.from({length:n}, (_,i) => (i<reg || mlb) ? String(i+1) : (i-reg ? (i-reg+1)+'OT' : 'OT'));
  const totH = mlb ? ['R','H','E'] : [o.scores ? 'F' : 'TOT'];
  const cw = mlb ? 17 : 23;                              /* period column width */
  const cols = heads.length + totH.length;
  const cellsW = cols*cw;
  const lost = t => g.final && Number(t.sc) < Number((t===g.a?g.h:g.a).sc);
  const cell = v => `<span class="c">${v==null||v===''?'':esc(v)}</span>`;           /* periods not yet played stay empty */
  const tots = t => mlb ? [t.sc, t.hits??'', t.errors??''] : [t.sc];
  const vals = (t, arr) => heads.map((_,i)=>cell(arr[i])).join('') + tots(t).map(v=>`<span class="c tot">${esc(v)}</span>`).join('');
  return `<div class="gb post${g.final?' fin':''}" style="--cw:${cw}px"${dg}>${top}
    <div class="gb-row" style="--ca:${hex(g.a.color)};--ch:${hex(g.h.color)}">
      <div class="gb-a">${logo(g.a,'a')}<b class="${lost(g.a)?'lost':''}">${esc(g.a.sc)}</b></div>
      <div class="gb-h"><b class="${lost(g.h)?'lost':''}">${esc(g.h.sc)}</b>${logo(g.h,'h')}</div>
    </div>
    <div class="gb-sub">
      <div class="gb-line hd"><span class="gb-tn"></span><span class="gb-cells">${heads.map(h=>`<span class="c">${h}</span>`).join('')}${totH.map(h=>`<span class="c tot">${h}</span>`).join('')}</span></div>
      <div class="gb-line${g.final ? (lost(g.a)?' lose':' win') : ''}"><span class="gb-tn">${nameRec(g.a)}</span><span class="gb-cells">${vals(g.a, al)}</span></div>
      <div class="gb-line${g.final ? (lost(g.h)?' lose':' win') : ''}"><span class="gb-tn">${nameRec(g.h)}</span><span class="gb-cells">${vals(g.h, hl)}</span></div>
    </div>${g.live && !o.scores && !o.detail ? playsHtml(g) : ''}</div>`;
}
/* live situation, shown in the label line */
function gsit(g){
  const s = g.sit; if(!s) return '';
  if(g.lg==='mlb'){ const outs = [0,1,2].map(i=>`<i class="${i<(s.outs||0)?'on':''}"></i>`).join(''); return ` <span class="gb-sit">${basesSvg(s)}<span class="outs">${outs}</span></span>`; }
  if((g.lg==='nfl'||g.lg==='cfb') && (s.shortDownDistanceText||s.downDistanceText)) return ` <span class="gb-sit">· ${esc(s.shortDownDistanceText||s.downDistanceText)}</span>`;
  return '';
}
function tStoryLead(st){
  const media = st.img ? `<img src="${esc(st.img)}" alt="" loading="lazy">` : art(st.art, st.title);
  const inner = `${media}<h3>${esc(st.title)}</h3>`;
  return st.link ? `<a class="tlead" href="${esc(st.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="tlead">${inner}</div>`;
}
function tStoryCard(st){
  const media = (st.thumb||st.img) ? `<img src="${esc(st.thumb||st.img)}" alt="" loading="lazy">` : art(st.art, st.title);
  const inner = `<span class="th">${media}</span><span class="tx"><h4>${esc(st.title)}</h4><span class="via">via ${esc(st.byline||'ESPN')} · ${esc(st.ago)}</span></span>`;
  return st.link ? `<a class="tcard" href="${esc(st.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="tcard">${inner}</div>`;

function tickerCards(list){
  return `<div class="tp-games">${list.map(g => `<div class="game${tickerSlot(g)}"${gameAttr(g)}>
    <div class="game-status">${statusParts(g).map(s=>`<span>${esc(s)}</span>`).join('')}</div>${teamRow(g.a,g)}${teamRow(g.h,g)}</div>`).join('')}</div>`;

/* The team-schedule feed has no team colors, line scores or upcoming records, so each game shown
   in a box is filled in from ESPN's scoreboard for that game's date (finals cached; others refreshed each minute) */
const fullGame = {};
const etDate = iso => new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/New_York'}).replace(/-/g,'');
async function enrichGame(g){
  const c = fullGame[g.id];
  if(c && ((c.g && c.g.final) || Date.now()-c.t < 55e3)) return;   /* final cached, or fetched/in flight within the last minute */
  fullGame[g.id] = {g: (c&&c.g) || null, t: Date.now()};
  try{
    const L = LG[g.lg], d = etDate(g.date);
    const j = await timed(API+L.path+'/'+L.sb+(L.sb.includes('?')?'&':'?')+'dates='+d, 9000);
    const ev = (j.events||[]).find(e => String(e.id)===String(g.id));
    if(ev){ fullGame[g.id] = {g: parseEvent(ev, g.lg), t: Date.now()}; if(tpKey && tpTab==='stream') renderTeamPage(); }
  }catch(e){}
}
const full = g => (g && fullGame[g.id] && fullGame[g.id].g) || g;

/* ---- Last plays for live games (ESPN game summary; refreshed every ~30s while live) ---- */
const playsCache = {};
async function loadPlays(g){
  const c = playsCache[g.id];
  if(c && Date.now()-c.t < 30e3) return;
  playsCache[g.id] = {list:(c&&c.list)||[], t:Date.now()};
  try{
    const j = await timed(API+LG[g.lg].path+'/summary?event='+g.id, 9000);
    let raw = [];
    if(j.drives){   /* football: plays live inside drives; the drive's team is the team with the ball */
      const drives = (j.drives.previous||[]).concat(j.drives.current ? [j.drives.current] : []);
      const seen = new Set();
      drives.forEach(d => (d.plays||[]).forEach(pl => { if(seen.has(pl.id)) return; seen.add(pl.id); raw.push({...pl, teamId: pl.team&&pl.team.id || d.team&&d.team.id}); }));
    } else raw = (j.plays||[]).map(pl => ({...pl, teamId: pl.team&&pl.team.id}));
    /* keep real team plays: drop period/game markers, and for baseball keep at-bat results (not every pitch) */
    const marker = /(^|\s)(start|end)\b|end of|timeout|official|delay/i;
    const keep = pl => {
      const type = (pl.type&&pl.type.text)||'';
      if(!pl.text || !pl.teamId) return false;
      if(marker.test(type) || /^(end|start) of/i.test(pl.text)) return false;
      if(g.lg==='mlb') return pl.scoringPlay || /play result/i.test(type);
      return true;
    };
    const list = raw.filter(keep).slice(-3).reverse().map(pl => ({
      text: String(pl.text).replace(/^\(\d+:\d+(\.\d+)?\)\s*/,''),
      teamId: pl.teamId ? String(pl.teamId) : '',
      clock: pl.clock && pl.clock.displayValue,
      period: pl.period && pl.period.number,
      half: pl.period && pl.period.type,          /* MLB: Top / Bottom */
      outs: pl.outs,
      scoring: !!pl.scoringPlay
    }));
    playsCache[g.id] = {list, t:Date.now()};
    if(tpKey && tpTab==='stream') renderTeamPage();
  }catch(e){}
}
function playsHtml(g){
  const c = playsCache[g.id]; if(!c || !c.list.length) return '';
  return `<div class="gb-plays">${c.list.map(pl => {
    const t = pl.teamId===String(g.a.id) ? g.a : pl.teamId===String(g.h.id) ? g.h : null;
    const logo = t ? logoTag(teamLogoUrl(t,g.lg), t.ab, '', t.logoDark) : '';
    let when;
    if(g.lg==='mlb'){ const inn = pl.period ? `${pl.half ? (/^b/i.test(pl.half)?'Bot':'Top')+' ' : ''}${ordinal(pl.period)}` : '';
      when = `${pl.outs!=null ? `${pl.outs} Out${pl.outs===1?'':'s'}` : ''}${pl.outs!=null && inn ? '<br>' : ''}${inn}`; }
    else when = esc(pl.clock || '');
    return `<div class="gp${pl.scoring?' score':''}"><span class="gp-logo">${logo}</span><span class="gp-txt">${esc(pl.text)}</span><span class="gp-when">${when}</span></div>`;
  }).join('')}</div>`;
}

/* ---- Stream tab ---- */
function renderStream(p){
  const list = stories.filter(s=>s.key===tpKey), gs = gamesFor(p);
  let html = '';
  if(p.type==='team'){
    const now = new Date(), today = now.toDateString();
    const live = gs.find(g=>g.live);
    const next = live || gs.find(g=>!g.final && !g.postponed && new Date(g.date) >= new Date(now - 6*3600e3));
    const last = gs.filter(g=>g.final).pop();
    const gameday = next && (next.live || new Date(next.date).toDateString()===today);
    /* last game on top, next game below it; on gameday the game moves to the top */
    const boxes = gameday ? [[next,false],[last,true]] : [[last,true],[next,false]];
    boxes.forEach(([g]) => { if(g){ enrichGame(g); const fg = full(g); if(fg.live) loadPlays(fg); html += gameBox(fg); } });
    if(boxes.some(([g])=>g)) html += '<div class="gb-gap"></div>';
  } else {
    const order = g => g.live?0 : g.final?2 : 1;
    const lg = gs.slice().sort((x,y)=>order(x)-order(y) || new Date(x.date)-new Date(y.date)).slice(0,24);
    if(lg.length) html += tickerCards(lg);
  }
  if(list[0]) html += tStoryLead(list[0]);
  list.slice(1).forEach(s => html += tStoryCard(s));
  if(!list.length) html += `<div class="tp-empty">No new stories for ${esc(p.type==='league'?LG[p.lg].name:p.full)} yet.</div>`;
  return html;
}

/* ---- Standings tab ---- */
async function loadStandings(lg){
  if(standingsCache[lg]) return standingsCache[lg];
  /* college: by conference; NFL & MLB: by division (level=3); NBA: by conference */
  const q = LG[lg].college ? (lg==='cfb' ? '?group=80' : '?group=50') : (lg==='nfl'||lg==='mlb') ? '?level=3' : '';
  try{ standingsCache[lg] = await timed(API_V2+LG[lg].path+'/standings'+q, 12000); }catch(e){ standingsCache[lg] = {error:true}; }
  return standingsCache[lg];
}
function leafGroups(node, out=[], parent=''){
  if(node.standings && node.standings.entries && node.standings.entries.length) out.push({name: node.name || node.shortName || node.abbreviation || parent, short: node.shortName||node.abbreviation||'', entries: node.standings.entries});
  (node.children||[]).forEach(c => leafGroups(c, out, node.name));
  return out;
}
const statMap = e => { const m = {}; (e.stats||[]).forEach(s => { if(s.name) m[s.name]=s; if(s.type) m['t:'+s.type]=s; if(s.abbreviation) m['a:'+s.abbreviation]=s; }); return m; };
const sv = s => s ? (s.displayValue ?? s.summary ?? s.value ?? '') : '';
function standingsTable(grp, lg, hiId){
  const college = LG[lg].college, nfl = lg==='nfl';
  const pct = (txt) => { const m = String(txt).match(/(\d+)-(\d+)/); return m ? (+m[1]/((+m[1]+ +m[2])||1)) : 0; };
  const rows = grp.entries.map(e => ({e, m:statMap(e)}));
  let cols;
  if(college){
    cols = [['CONF', r => sv(r.m['t:vsconf']||r.m['vsConf']||r.m['a:CONF'])], ['OVR', r => sv(r.m['t:total']||r.m['overall']) || `${sv(r.m.wins)}-${sv(r.m.losses)}`]];
    rows.sort((x,y)=> pct(cols[0][1](y))-pct(cols[0][1](x)) || pct(cols[1][1](y))-pct(cols[1][1](x)));
  } else {
    cols = [['W', r=>sv(r.m.wins)], ['L', r=>sv(r.m.losses)]];
    if(nfl) cols.push(['T', r=>sv(r.m.ties)]);
    cols.push(['PCT', r=>sv(r.m.winPercent)]);
    if(!nfl) cols.push(['GB', r=>sv(r.m.gamesBehind)]);
    const seed = r => +(r.m.playoffSeed&&r.m.playoffSeed.value) || 99;
    rows.sort((x,y)=> (+(y.m.winPercent&&y.m.winPercent.value)||0)-(+(x.m.winPercent&&x.m.winPercent.value)||0) || seed(x)-seed(y));
  }
  const body = rows.map(r => { const t = r.e.team||{}, me = String(t.id)===String(hiId);
    const logo = (t.logos&&t.logos[0]&&t.logos[0].href) || '';
    return `<tr class="${me?'me':''}"><td><span class="stl">${logo?logoTag(logo, t.abbreviation||''):''}</span>${esc(t.shortDisplayName||t.displayName||t.name)}</td>${cols.map(c=>`<td>${esc(c[1](r) || '–')}</td>`).join('')}</tr>`; }).join('');
  return `<div class="stand"><div class="stand-h">${esc(grp.name)}</div><table><thead><tr><th></th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function renderStandings(p){
  const data = standingsCache[p.lg];
  if(!data){ loadStandings(p.lg).then(()=>{ if(tpKey===pickKey(p) && tpTab==='standings') renderTeamPage(); }); return `<div class="tp-empty">Loading standings…</div>`; }
  if(data.error) return `<div class="tp-empty">Couldn't load standings from ESPN. Pull to refresh or try again shortly.</div>`;
  let groups = leafGroups(data);
  if(p.type==='team'){
    const i = groups.findIndex(g => g.entries.some(e => String((e.team||{}).id)===String(p.id)));
    if(i>0) groups = [groups[i], ...groups.slice(0,i), ...groups.slice(i+1)];
  }
  return groups.length ? groups.map(g => standingsTable(g, p.lg, p.id)).join('') : `<div class="tp-empty">No standings available yet.</div>`;
}

/* ---- Schedule tab ---- */
function renderSchedule(p){
  if(p.type!=='team') return '';
  const gs = gamesFor(p);
  if(!tpGames[pickKey(p)]) return `<div class="tp-empty">Loading schedule…</div>`;
  if(!gs.length) return `<div class="tp-empty">No games found.</div>`;
  const now = new Date(); let nextMarked = false, month = '';
  const rows = gs.map(g => {
    const home = String(g.h.id)===String(p.id), me = home ? g.h : g.a, opp = home ? g.a : g.h;
    const d = new Date(g.date), m = d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    let head = ''; if(m!==month){ month = m; head = `<div class="sch-month">${esc(m)}</div>`; }
    let res;
    if(g.final){ const w = Number(me.sc) > Number(opp.sc);
      res = `<span class="${w?'w':'l'}">${w?'W':'L'}</span> ${esc(me.sc)}-${esc(opp.sc)}${g.period>((LG[g.lg]||{}).periods||4) && g.lg!=='mlb' ? ' OT':''}`; }
    else if(g.live) res = `<span class="lv">${esc(statusParts(g)[0])}</span> ${esc(me.sc)}-${esc(opp.sc)}`;
    else if(g.postponed) res = 'Postponed';
    else res = g.tbd ? 'TBD' : esc(d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s+/,' '));   /* "6:30 PM", no channel */
    const isNext = !nextMarked && !g.final && (g.live || d >= now - 6*3600e3) && (nextMarked = true);
    const inner = `<span class="sch-d">${esc(d.toLocaleDateString('en-US',{weekday:'short'}))}<b>${d.getMonth()+1}/${d.getDate()}</b></span>
      <span class="sch-o"><em>${home?'vs':'@'}</em><span class="stl">${logoTag(teamLogoUrl(opp,g.lg), opp.ab||'', '', opp.logoDark)}</span>${opp.rank?`<span class="sch-rk">${esc(opp.rank)}</span>`:''}<span class="sch-nm">${esc(opp.name||opp.ab)}</span></span>
      <span class="sch-r">${res}</span>`;
    return head + (g.link ? `<a class="sch-row${isNext?' next':''}" href="${esc(g.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="sch-row${isNext?' next':''}">${inner}</div>`);
  }).join('');
  const note = tpSource[pickKey(p)]==='range' && !['nfl','cfb'].includes(p.lg) ? `<div class="tp-empty" style="font-size:14px">Showing three weeks either side of today.</div>` : '';
  return `<div class="sched">${rows}</div>${note}`;
}

function renderTeamPage(){
  const p = picks.find(x=>pickKey(x)===tpKey); if(!p) return closeTeamPage();
  const v = pickView(p), page = $('#tpage');
  const base = p.type==='league' ? '#3a3a3d' : v.bg;
  const prim = lum(base) > .55 ? shade(base, .6) : hex(base);   /* team primary color (darkened only if very light, so white text reads) */
  page.style.setProperty('--tp-bg', '#2f2f31');                  /* page body stays gray */
  page.style.setProperty('--tp-bar', p.type==='league' ? '#4a4a4d' : prim);
  page.style.setProperty('--tp-bar2', p.type==='league' ? '#4a4a4d' : shade(prim, .82));   /* tabs a step darker than the name bar */
  $('#tpName').textContent = p.type==='league' ? LG[p.lg].name : p.full;
  const tabs = p.type==='team' ? ['stream','standings','schedule'] : ['stream','standings'];

/* ================= Game page =================
   Any game box or ticker card opens this page. Everything comes from ESPN's game summary:
   header (score/status), boxscore.players (per-sport player tables), boxscore.teams (team stats),
   plays / drives / scoringPlays, gameInfo and leaders (pregame). Live games refresh every 30s. */
const gameReg = {};                                   /* "lg:id" -> latest game object seen in any list */
function gameAttr(g){ if(!g || !g.id || !g.lg) return ''; const k = g.lg+':'+g.id; gameReg[k] = {...(gameReg[k]||{}), ...g}; return ` data-game="${k}"`; }
let gd = null;                                        /* {key, g, s (summary), tab, side, more, t} */
const gdKeep = (o, n) => { const r = {...o}; for(const k in n){ const v = n[k]; if(v==null || v==='' || v==='undefined' || (Array.isArray(v) && !v.length && (o[k]||[]).length)) continue; r[k] = v; } return r; };
const athName = a => { a = a || {}; return a.shortName || (a.firstName && a.lastName ? a.firstName[0]+'. '+a.lastName : a.displayName || ''); };
const gdTeamOf = (g, id) => String(id)===String(g.a.id) ? g.a : String(id)===String(g.h.id) ? g.h : null;
const gdLogo = (t, lg) => t ? logoTag(teamLogoUrl(t, lg), t.ab, '', t.logoDark) : '';

function openGame(key){
  const g = gameReg[key]; if(!g) return;
  const k = key;
  gd = {key:k, g, s:null, tab: g.live ? 'plays' : g.final ? 'box' : 'info', side: 'a', more: 0, t: 0};
  renderGame(); $('#gpBody').scrollTop = 0;

  loadGame(true);
