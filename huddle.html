function closeGame(){ gd = null; $('#gpage').classList.remove('open'); $('#gpage').setAttribute('aria-hidden','true'); }
const gameOpen = () => !!gd;

async function loadGame(force){
  if(!gd) return; const cur = gd;
  if(!force && Date.now()-cur.t < 25e3) return;
  cur.t = Date.now();
  try{
    const s = await timed(API+LG[cur.g.lg].path+'/summary?event='+cur.g.id, 10000);
    if(gd !== cur) return;
    cur.s = s;
    /* fresh score/status from the summary header, keeping colors, ranks and links we already had */
    const h = s.header, c = h && h.competitions && h.competitions[0];
    if(c){ const ng = parseEvent({...h, date:c.date, links:[]}, cur.g.lg);
      const g = {...cur.g, ...gdKeep({}, {live:ng.live, final:ng.final, postponed:ng.postponed, half:ng.half, endPeriod:ng.endPeriod, detail:ng.detail, period:ng.period, clock:ng.clock})};
      g.live = ng.live; g.final = ng.final;
      g.a = gdKeep(cur.g.a, {...ng.a, rank:ng.a.rank||cur.g.a.rank}); g.h = gdKeep(cur.g.h, {...ng.h, rank:ng.h.rank||cur.g.h.rank});
      if(s.situation) g.sit = s.situation; else if(!g.live) g.sit = null;
      cur.g = g; gameReg[cur.key] = g; }
    if(cur.tab==='info' && (cur.g.live || cur.g.final)) cur.tab = cur.g.live ? 'plays' : 'box';
  }catch(e){ cur.err = true; }
  if(gd === cur) renderGame();
}

function renderGame(){
  if(!gd) return;
  const {g, s} = gd, body = $('#gpBody'), y = body.scrollTop;
  $('#gpName').textContent = `${g.a.ab||g.a.name} @ ${g.h.ab||g.h.name}`;
  const started = g.live || g.final;
  const tabs = started ? [['plays','Plays'], ['box','Player Stats'], ['team','Team Stats']] : [['info','Preview']];
  if(!tabs.some(t=>t[0]===gd.tab)) gd.tab = tabs[0][0];
  let html = `<div class="gd-head">${gameBox(g, {detail:true})}</div>`;
  html += `<div class="gd-tabs" role="tablist">${tabs.map(([k,l]) => `<button class="tp-tab" data-gdtab="${k}" aria-selected="${k===gd.tab}">${l}</button>`).join('')}</div>`;
  if(!s) html += `<div class="gd-load">${gd.err ? 'Couldn’t load this game. Pull back and try again.' : 'Loading…'}</div>`;
  else html += gd.tab==='box' ? gdBox(g, s) : gd.tab==='team' ? gdTeamStats(g, s) : gd.tab==='plays' ? gdPlays(g, s) : gdInfo(g, s);
  body.innerHTML = html;
  body.scrollTop = y;
}

/* ---- Player stats: one fixed set of columns per table (at most 6), same width everywhere ---- */
const GD_COLS = {
  hoops:        [['MIN'],['PTS'],['REB'],['AST'],['FG'],['3PT']],
  batting:      [['AB'],['R'],['H'],['RBI'],['BB'],['K']],
  pitching:     [['IP'],['H'],['R'],['ER'],['BB'],['K']],
  passing:      [['C/ATT'],['YDS'],['AVG'],['TD'],['INT'],['RTG','QBR']],
  rushing:      [['CAR'],['YDS'],['AVG'],['TD'],['LONG','LNG']],
  receiving:    [['REC'],['YDS'],['AVG'],['TD'],['LONG','LNG'],['TGTS']],
  fumbles:      [['FUM'],['LOST'],['REC']],
  defensive:    [['TOT'],['SOLO'],['SACKS','SCK'],['TFL'],['PD'],['QB HTS','QB HUR']],
  interceptions:[['INT'],['YDS'],['TD']],
  kickReturns:  [['NO'],['YDS'],['AVG'],['LONG','LNG'],['TD']],
  puntReturns:  [['NO'],['YDS'],['AVG'],['LONG','LNG'],['TD']],
  kicking:      [['FG'],['PCT'],['LONG','LNG'],['XP'],['PTS']],
  punting:      [['NO'],['YDS'],['AVG'],['TB'],['In 20','IN 20'],['LONG','LNG']]
};
const GD_SHORT = {'QB HTS':'QBH', 'QB HUR':'QBH', 'In 20':'IN20', 'IN 20':'IN20', 'SACKS':'SCK', 'TGTS':'TGT', 'LONG':'LNG'};
/* indexes of the wanted columns in ESPN's label list (falls back to the first 6 if none match) */
function gdCols(labels, kind){
  const want = GD_COLS[kind];
  if(!want) return labels.slice(0,6).map((l,i)=>[i,l]);
  const up = labels.map(l => String(l).toUpperCase());
  const out = [];
  want.forEach(alts => { for(const a of alts){ const i = up.indexOf(a.toUpperCase()); if(i>=0){ out.push([i, GD_SHORT[labels[i]] || labels[i]]); break; } } });
  return out.length ? out : labels.slice(0,6).map((l,i)=>[i,l]);
}
function gdTable(head, labels, kind, rows, totals, opts={}){
  const cols = gdCols(labels, kind);
  const pick = arr => cols.map(([i]) => `<td>${esc((arr||[])[i] ?? '')}</td>`).join('');
  const body = rows.map(r => r.grp ? `<tr class="grp"><td colspan="${cols.length+1}">${esc(r.grp)}</td></tr>`
    : r.dnp ? `<tr><td>${r.name}</td><td class="dnp" colspan="${cols.length}">${esc(r.dnp)}</td></tr>`
    : `<tr><td class="${r.sub?'sub':''}">${r.name}</td>${pick(r.stats)}</tr>`).join('');
  const tot = totals && totals.some(x=>String(x).trim()) ? `<tr class="tot"><td>Team</td>${pick(totals)}</tr>` : '';
  return `<div class="gd-card gd-tbl"><table><colgroup><col>${cols.map(()=>'<col class="st">').join('')}</colgroup>
    <tr><th>${esc(head)}</th>${cols.map(([,l])=>`<th>${esc(l)}</th>`).join('')}</tr>${body}${tot}</table></div>`;
}
const gdNm = (a, pos) => `${esc(athName(a))}${pos ? `<small>${esc(pos)}</small>` : ''}`;
function gdBox(g, s){
  const P = (s.boxscore && s.boxscore.players) || [];
  if(!P.length) return `<div class="gd-load">No player stats yet.</div>`;
  const t = gd.side==='h' ? g.h : g.a;
  const tp = P.find(x => String(x.team && x.team.id)===String(t.id)) || P[gd.side==='h' ? 1 : 0];
  const btn = (k, tm) => `<button data-gdside="${k}" aria-pressed="${gd.side===k}" style="--tc:${hex(tm.color||'#555558')}">${gdLogo(tm, g.lg)}${esc(tm.name||tm.ab)}</button>`;
  let html = `<div class="gd-sec"><div class="gd-teams">${btn('a', g.a)}${btn('h', g.h)}</div>`;
  const groups = (tp && tp.statistics) || [];
  const lg = g.lg;
  if(lg==='nba' || lg==='cbb'){
    const st = groups[0]; if(!st) return html + `<div class="gd-load">No player stats yet.</div></div>`;
    const ath = st.athletes || [];
    const row = a => ({name: gdNm(a.athlete, (a.athlete.position||{}).abbreviation),
      dnp: a.didNotPlay || !(a.stats||[]).length ? (a.didNotPlay ? 'DNP'+(a.reason ? ' – '+cap(a.reason) : '') : '—') : null, stats: a.stats});
    const starters = ath.filter(a=>a.starter), bench = ath.filter(a=>!a.starter);
    const rows = [...(starters.length ? [{grp:'Starters'}] : []), ...starters.map(row), ...(bench.length ? [{grp:'Bench'}] : []), ...bench.map(row)];
    html += gdTable(t.ab||'', st.labels || st.names || [], 'hoops', rows, st.totals);
  } else if(lg==='mlb'){
    groups.forEach(st => {
      const bat = st.type==='batting';
      html += `<div class="gd-h">${bat ? 'Batting' : 'Pitching'}</div>` + gdTable(bat ? 'Hitters' : 'Pitchers', st.labels || st.names || [], bat ? 'batting' : 'pitching',
        (st.athletes||[]).map(a => ({name: gdNm(a.athlete, (a.position||a.athlete.position||{}).abbreviation), sub: bat && !a.starter, stats: a.stats})), st.totals);
    });
  } else {   /* football: one table per category */
    const name = {passing:'Passing', rushing:'Rushing', receiving:'Receiving', fumbles:'Fumbles', defensive:'Defense', interceptions:'Interceptions', kickReturns:'Kick Returns', puntReturns:'Punt Returns', kicking:'Kicking', punting:'Punting'};
    groups.filter(st => (st.athletes||[]).length).forEach(st => {
      html += `<div class="gd-h">${esc(name[st.name] || st.text || st.name)}</div>` + gdTable(t.ab||'', st.labels || st.names || [], st.name,
        st.athletes.map(a => ({name: gdNm(a.athlete), stats: a.stats})), st.athletes.length > 1 ? st.totals : null);
    });
  }
  return html + '</div>';
}
const cap = x => String(x).toLowerCase().replace(/(^|[\s-])\w/g, c=>c.toUpperCase());

/* ---- Team stats: side-by-side with a split bar ---- */
const MLB_TS = [['batting','H','Hits'],['batting','HR','Home Runs'],['batting','BB','Walks'],['batting','SO','Strikeouts'],['batting','LOB','Left on Base'],['batting','SB','Stolen Bases'],['batting','2B','Doubles'],['batting','AVG','Batting Avg'],['batting','OBP','On-Base %'],['batting','SLG','Slugging %'],['pitching','P','Pitches'],['pitching','ER','Earned Runs Allowed'],['fielding','E','Errors']];
function gdTeamStats(g, s){
  const T = (s.boxscore && s.boxscore.teams) || [];
  const ta = T.find(x=>x.homeAway==='away') || T[0], th = T.find(x=>x.homeAway==='home') || T[1];
  if(!ta || !th) return `<div class="gd-load">No team stats yet.</div>`;
  let rows = [];
  if(g.lg==='mlb'){
    const val = (t, grp, ab) => { const G = (t.statistics||[]).find(x=>x.name===grp); const st = G && (G.stats||[]).find(x=>x.abbreviation===ab); return st ? st.displayValue : null; };
    rows = MLB_TS.map(([grp, ab, label]) => [label, val(ta,grp,ab), val(th,grp,ab)]).filter(r => r[1]!=null && r[2]!=null);
  } else {
    const hs = {}; (th.statistics||[]).forEach(x => hs[x.name||x.label] = x.displayValue);
    rows = (ta.statistics||[]).filter(x => x.label && x.displayValue!=null).map(x => [x.label, x.displayValue, hs[x.name||x.label]]).filter(r => r[2]!=null);
  }
  if(!rows.length) return `<div class="gd-load">No team stats yet.</div>`;
  const num = v => { const m = String(v).match(/-?\d*\.?\d+/); return m ? parseFloat(m[0]) : NaN; };
  const lowBetter = /turnover|interception|fumble|penalt|foul|error|left on base|sack.*yards|earned runs allowed/i;
  /* very dark primaries (navy, black) disappear on the gray card, so those use the team's alternate color */
  const barC = t => { const c = hex(t.color||'#888'), al = t.alt ? hex(t.alt) : ''; return lum(c) < .12 && al && lum(al) > lum(c) && lum(al) < .9 ? al : lum(c) < .12 ? '#8a8a8e' : c; };
  const ca = barC(g.a), ch = barC(g.h);
  const secs = v => String(v).split(':').reduce((m,s)=>m*60+Number(s),0);
  const bar = (label, a, h) => { const clock = /:/.test(a) && /:/.test(h);   /* time of possession */
    const x = clock ? secs(a) : num(a), y = clock ? secs(h) : num(h);
    if(!(x>=0) || !(y>=0) || x+y===0) return '';
    const lo = lowBetter.test(label), aw = lo ? x < y : x > y, hw = lo ? y < x : y > x;
    return `<div class="gd-bar"><i class="${hw&&!aw?'lo':''}" style="--c:${ca};flex:${x}"></i><i class="${aw&&!hw?'lo':''}" style="--c:${ch};flex:${y}"></i></div>`; };
  return `<div class="gd-sec"><div class="gd-card gd-ts">
    <div class="gd-ts-hd"><span>${gdLogo(g.a,g.lg)}${esc(g.a.ab||g.a.name)}</span><span>${esc(g.h.ab||g.h.name)}${gdLogo(g.h,g.lg)}</span></div>
    ${rows.map(([l,a,h]) => `<div class="gd-st"><div class="gd-st-row"><b>${esc(a)}</b><span>${esc(l)}</span><b>${esc(h)}</b></div>${bar(l,a,h)}</div>`).join('')}
  </div></div>`;
}

/* ---- Plays: scoring summary + play-by-play (newest first while live) ---- */
function gdPlayList(g, s){
  let raw = [];
  if(s.drives){
    const drives = (s.drives.previous||[]).concat(s.drives.current ? [s.drives.current] : []), seen = new Set();
    drives.forEach((d, di) => (d.plays||[]).forEach(pl => { if(seen.has(pl.id)) return; seen.add(pl.id);
      raw.push({...pl, teamId: (pl.team&&pl.team.id) || (d.team&&d.team.id), drive: di, driveInfo: d}); }));
  } else raw = (s.plays||[]).map(pl => ({...pl, teamId: pl.team && pl.team.id}));
  if(g.lg==='mlb') raw = raw.filter(pl => pl.scoringPlay || /play result/i.test((pl.type&&pl.type.text)||''));   /* at-bat results, not every pitch */
  return raw.filter(pl => pl.text && !/^(end|start) of/i.test(pl.text.trim()) && !/^end (of )?(game|period|quarter|half)/i.test((pl.type&&pl.type.text)||''));   /* period markers become section headers */
}
function gdPlayRow(g, pl, withScore){
  const t = gdTeamOf(g, pl.teamId);
  let when;
  if(g.lg==='mlb') when = pl.outs!=null ? pl.outs+' Out'+(pl.outs===1?'':'s') : '';
  else when = esc((pl.clock && pl.clock.displayValue) || '');
  const sc = withScore && pl.awayScore!=null ? `<small>${esc(g.a.ab||'')} ${pl.awayScore}, ${esc(g.h.ab||'')} ${pl.homeScore}</small>` : '';
  return `<div class="gp${pl.scoringPlay?' score':''}"><span class="gp-logo">${gdLogo(t, g.lg)}</span><span class="gp-txt">${esc(String(pl.text).replace(/^\(\d+:\d+(\.\d+)?\)\s*/,''))}</span><span class="gp-when">${when}${sc}</span></div>`;
}
const gdPer = (g, pl) => { const p = pl.period||{};
  if(g.lg==='mlb') return `${p.type ? (/^b/i.test(p.type)?'Bottom':'Top')+' ' : ''}${ordinal(p.number||1)}`;
  const reg = (LG[g.lg]||{}).periods || 4, n = p.number||1;
  if(n > reg) return n-reg===1 ? 'Overtime' : (n-reg)+'OT';
  return reg===2 ? (n===1?'1st Half':'2nd Half') : ordinal(n)+' Quarter'; };
function gdPlays(g, s){
  let html = '<div class="gd-sec">';
  /* scoring summary (football and baseball) */
  let scoring = (s.scoringPlays||[]).map(pl => ({...pl, teamId: pl.team && pl.team.id, scoringPlay:true}));
  if(!scoring.length && g.lg==='mlb') scoring = gdPlayList(g, s).filter(pl => pl.scoringPlay);
  const scoringBlock = scoring.length ? `<div class="gd-h">Scoring Summary</div><div class="gd-card gd-plays">${(() => { let last = null, out = '';
      scoring.forEach(pl => { const pr = gdPer(g, pl); if(pr!==last){ out += `<div class="gd-sep"><b>${esc(pr)}</b></div>`; last = pr; } out += gdPlayRow(g, pl, true); });
      return out; })()}</div>` : '';
  /* play-by-play, newest first */
  const list = gdPlayList(g, s).slice().reverse();
  const limit = gd.more ? Infinity : 5;   /* latest 5, then every play */
  let pbp = '';
  if(list.length){
    let last = null, lastDrive = null, out = '';
    list.slice(0, limit).forEach(pl => {
      const pr = gdPer(g, pl);
      if(pr!==last){ out += `<div class="gd-sep"><b>${esc(pr)}</b></div>`; last = pr; lastDrive = null; }
      if(pl.driveInfo && pl.drive!==lastDrive){ const d = pl.driveInfo, t = gdTeamOf(g, d.team && d.team.id);
        out += `<div class="gd-sep"><span><b>${esc(t ? t.ab : (d.team&&d.team.abbreviation)||'')}</b>${d.displayResult ? ' · '+esc(d.displayResult) : ''}</span><span>${esc(d.description||'')}</span></div>`; lastDrive = pl.drive; }
      out += gdPlayRow(g, pl, !!pl.scoringPlay);
    });
    pbp = `<div class="gd-h">${g.live ? 'Latest Plays' : 'Play-by-Play'}</div><div class="gd-card gd-plays">${out}${list.length > limit ? `<button class="gd-more" data-gdmore>Show more plays</button>` : ''}</div>`;
  }
  if(!scoringBlock && !pbp) return html + `<div class="gd-load">No plays yet.</div></div>`;
  html += g.live ? pbp + scoringBlock : scoringBlock + pbp;
  return html + '</div>';
}

/* ---- Preview (before the game) ---- */
function gdInfo(g, s){
  const gi = s.gameInfo || {}, v = gi.venue || {}, ad = v.address || {};
  const d = new Date(g.date);

  let html = `<div class="gd-sec"><div class="gd-h">Game Info</div><div class="gd-card gd-info">${rows.map(([k,v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
  /* season leaders, away vs home by category */
  const L = s.leaders || [];
  const la = L.find(x => String(x.team&&x.team.id)===String(g.a.id)) || L[0], lh = L.find(x => String(x.team&&x.team.id)===String(g.h.id)) || L[1];

    html += `<div class="gd-h">Season Leaders</div><div class="gd-card gd-ld">${cats.map(n => { const c = la.leaders.find(x=>x.name===n); return `<div class="cat">${esc(c.displayName||n)}</div>${cell(la,n)}${cell(lh,n)}`; }).join('')}</div>`;

}

/* ================= Events ================= */

  if(e.target.closest('#drawerClose') || e.target.closest('#drawerDim')){ setDrawer(false); return; }
  const go = e.target.closest('[data-go]');
  if(go){ if(go.dataset.go==='alerts') return; setDrawer(false); showView(go.dataset.go); return; }
  const row = e.target.closest('[data-row]');
  if(row){ openTeamPage(row.dataset.row); return; }
  if(e.target.closest('#gpBack')){ closeGame(); return; }
  const gdt = e.target.closest('[data-gdtab]');
  if(gdt){ gd.tab = gdt.dataset.gdtab; gd.more = 0; renderGame(); const hd = $('#gpBody .gd-head'); if($('#gpBody').scrollTop > hd.offsetHeight) $('#gpBody').scrollTop = hd.offsetHeight; return; }
  const gds = e.target.closest('[data-gdside]');
  if(gds){ gd.side = gds.dataset.gdside; renderGame(); return; }
  if(e.target.closest('[data-gdmore]')){ gd.more++; renderGame(); return; }
  if(e.target.closest('#tpBack')){ closeTeamPage(); return; }
  const gm = e.target.closest('[data-game]');
  if(gm && !e.target.closest('[data-tptab]') && !e.target.closest('#gpage')){ openGame(gm.dataset.game); return; }
  const tt = e.target.closest('[data-tptab]');
  if(tt){ tpTab = tt.dataset.tptab; renderTeamPage._scrolled = false; renderTeamPage(); if(tpTab!=='schedule') $('#tpBody').scrollTop = 0; return; }
  if(e.target.closest('#tpTitle')){ showView('teams'); setDrawer(true); closeTeamPage(); return; }
  if(e.target.closest('[data-add]')){ openPicker(); setTimeout(()=>$('#teamSearch').focus(), 320); return; }
  if(e.target.closest('.search-btn')){ openPicker(); setTimeout(()=>$('#teamSearch').focus(), 320); return; }
  if(e.target.closest('[data-edit]') || e.target.closest('.gear')){ openPicker(); return; }
  if(e.target.closest('#pickerDone')){ closePicker(); return; }
  const lgTab = e.target.closest('.lg-tab');
  if(lgTab){ pickerLg = lgTab.dataset.lg; pickerQuery=''; $('#teamSearch').value=''; $('#pickerList').scrollTop=0; renderPickerBody(); return; }
  const pl = e.target.closest('[data-pick-league]');
  if(pl){ togglePick({type:'league', lg:pl.dataset.pickLeague}); pl.setAttribute('aria-pressed', isPicked(pl.dataset.pickLeague)); return; }
  const pt = e.target.closest('[data-pick-team]');
  if(pt){ const key = pt.dataset.pickTeam, [lg,id] = key.split(':'); const t = (teamCache[lg]||[]).find(x=>x.id===id);
    if(t){ const p = {type:'team', lg, id, ab:t.ab, location:t.location, nick:t.nick, full:t.full, color:t.color||'#3a3a3d', alt:t.alt, logo:t.logo}; togglePick(p); pt.setAttribute('aria-pressed', isPicked(key)); if(isPicked(key)) fillColors(p); }
    return; }
  const un = e.target.closest('[data-unpick]');
  if(un){ const p = picks.find(x=>pickKey(x)===un.dataset.unpick); if(p){ togglePick(p); renderPickerBody(); } return; }
  const tile = e.target.closest('[data-team]');
  if(tile){ openTeamPage(tile.dataset.team); return; }
  if(e.target.closest('[data-clear]')){ filter=null; renderTeams(); return; }
  const star = e.target.closest('[data-star]');
  if(star){ const k=star.dataset.star; starred.has(k)?starred.delete(k):starred.add(k); star.setAttribute('aria-pressed', starred.has(k)); }
});
$('#teamSearch').addEventListener('input', e => { pickerQuery = e.target.value; renderPickerBody(); });
document.addEventListener('keydown', e => { if(e.key!=='Escape') return; if($('#picker').classList.contains('open')) closePicker(); else if(gameOpen()) closeGame(); });

/* ================= Live data (ESPN public site API) ================= */
/* Box names: college = school only ("Ohio State", not "Ohio State Buckeyes"); pro = team name only ("Rangers", not "Texas Rangers") */
function shortName(tm, lg){
  if((LG[lg]||{}).college) return tm.location || tm.shortDisplayName || tm.displayName || '';
  return tm.name || tm.nickname || tm.shortDisplayName || tm.displayName || '';
}
function parseEvent(ev, lg){
  const comp = ev.competitions[0]; const status = comp.status || ev.status || {}; const st = status.type || {};
  const val = x => x==null ? '' : (typeof x==='object' ? (x.displayValue ?? x.value ?? '') : x);
  const side = ha => { const c = comp.competitors.find(x=>x.homeAway===ha) || {}; const tm = c.team || {};
    const rec = (c.records&&c.records[0]&&(c.records[0].summary||c.records[0].displayValue)) || (c.record&&c.record[0]&&c.record[0].displayValue) || '';
    return {id:String(tm.id), ab:tm.abbreviation, name:shortName(tm, lg), color:tm.color, alt:tm.alternateColor, logo:tm.logo || (tm.logos&&tm.logos[0]&&tm.logos[0].href) || '', logoDark:tm.logoDark || ((tm.logos||[]).find(l=>(l.rel||[]).includes('dark'))||{}).href || '',
      sc:val(c.score), rec, rank:(c.curatedRank&&c.curatedRank.current<=25)?c.curatedRank.current:null, seed:c.seed||null,
      line:(c.linescores||[]).map(l=>l.value ?? l.displayValue), hits:c.hits, errors:c.errors, winner:c.winner}; };
  const bc = (comp.broadcasts||[]).map(b => (b.names&&b.names[0]) || (b.media&&b.media.shortName) || '').filter(Boolean)[0] || '';
  return {lg, live:st.state==='in', final:st.state==='post' && st.name!=='STATUS_POSTPONED', postponed:st.name==='STATUS_POSTPONED',
    half:st.name==='STATUS_HALFTIME', endPeriod:st.name==='STATUS_END_PERIOD', detail:st.shortDetail,
    period:status.period, clock:status.displayClock, tbd:!!comp.timeValid===false && comp.timeValid!==undefined,
    a:side('away'), h:side('home'), date:ev.date || comp.date, id:ev.id, post:!!(ev.season&&ev.season.type===3), sit:comp.situation||null, tv:bc,
    link:((ev.links||[]).find(l=>(l.rel||[]).includes('summary'))||(ev.links||[])[0]||{}).href||''};
}
const toStory = (a, key, src, chip, chipColor, chipLogo) => ({key, src, chip, chipColor, chipLogo, title:a.headline, published:a.published, byline:a.byline||'',
  ago:ago(a.published), img:a.images&&a.images[0]&&a.images[0].url, link:a.links&&a.links.web&&a.links.web.href});
/* ---- Bleacher Report stories ----
   B/R has no public feed, but its league/team pages (which allow cross-site reads) embed each story's
   data: full headline, slug, publish time and thumbnail. Only B/R's own articles are kept. */
const BR = 'https://bleacherreport.com/';
const BR_LEAGUE = {nfl:'nfl', mlb:'mlb', nba:'nba', cfb:'college-football', cbb:'college-basketball'};
const brSlugOk = {};                      /* pickKey -> slug that worked */
const slugify = x => String(x||'').toLowerCase().replace(/&/g,'and').replace(/['’.]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function brSlugs(p){
  if(p.type==='league') return [BR_LEAGUE[p.lg]];
  if(LG[p.lg].college){ const sfx = p.lg==='cfb' ? '-football' : '-basketball';
    return [slugify(p.location)+sfx, slugify(p.location+' '+p.nick)+sfx]; }
  return [slugify(p.full)];
}
const unesc = x => { try{ return JSON.parse('"'+x+'"'); }catch(e){ return x; } };
function brParse(html){
  const t = html.replace(/\\"/g,'"').replace(/\\\\/g,'\\');
  const re = /"__typename":"StandaloneContentModule","id":"[^"]+","content":\{"__typename":"Article".*?"slug":"([^"]+)","articleTitle":"((?:[^"\\]|\\.)*)".*?"publishedDate":"([^"]+)".*?\},"contentID":"[^"]+","thumbnail":"([^"]*)","title":"((?:[^"\\]|\\.)*)"/g;
  const out = [], seen = new Set(); let m;
  while((m = re.exec(t))){ if(seen.has(m[1])) continue; seen.add(m[1]);
    out.push({slug:m[1], title:unesc(m[2]) || unesc(m[5]), published:m[3], img:m[4]}); }
  return out.sort((a,b)=> b.published.localeCompare(a.published));
}
async function brStories(p, key, src, chip, chipColor, chipLogo){
  const slugs = brSlugOk[key] ? [brSlugOk[key]] : brSlugs(p);
  for(const slug of slugs){
    try{
      const r = await fetchWithTimeout(BR+slug, 15000); if(!r.ok) continue;
      const list = brParse(await r.text()); if(!list.length) continue;
      brSlugOk[key] = slug;
      return list.slice(0, 8).map(a => ({key, src, chip, chipColor, chipLogo, title:a.title, published:a.published, ago:ago(a.published),
        byline:'Bleacher Report', img: a.img ? a.img.split('?')[0]+'?w=800' : '', thumb: a.img ? a.img.split('?')[0]+'?w=360' : '', link: BR + a.slug.replace(/^\//,'')}));
    }catch(e){}
  }
  return null;
}
function fetchWithTimeout(url, ms){ const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms); return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t)); }
async function storiesFor(p){
  const L = LG[p.lg];
  if(p.type==='league'){
    return (await brStories(p, p.lg, L.name, L.label, L.color, L.logo))
      || timed(API+L.path+'/news?limit=8').then(j => j.articles.map(a=>toStory(a, p.lg, L.name, L.label, L.color, L.logo)));
  }
  const v = pickView(p), key = pickKey(p);
  return (await brStories(p, key, p.full, p.ab, v.bg, p.logo))
    || timed(API+L.path+'/news?team='+p.id+'&limit=6').then(j => j.articles.map(a=>toStory(a, key, p.full, p.ab, v.bg, p.logo)));
}
let lastNewsAt = 0;
async function loadLive(force){
  const lgs = activeLeagues();
  const sb = await Promise.allSettled(lgs.map(k => timed(API+LG[k].path+'/'+LG[k].sb).then(j => j.events.map(e=>parseEvent(e,k)))));
  const got = sb.filter(r=>r.status==='fulfilled').flatMap(r=>r.value);
  if(!got.length && sb.every(r=>r.status==='rejected')) throw new Error('no live data');
  games = got;

  /* Stories come from Bleacher Report (league and team pages), refreshed every 10 minutes; ESPN is the fallback */
  if(force || !lastNewsAt || Date.now()-lastNewsAt > 10*60e3){
    lastNewsAt = Date.now();
    const feeds = await Promise.allSettled(picks.map(p => storiesFor(p)));
    const groups = feeds.map(r => r.status==='fulfilled' ? r.value : []);
    tileMeta = {};
    picks.forEach((p,i) => { const g = groups[i]; if(g.length){ const newest = g.reduce((m,s)=> new Date(s.published)>new Date(m.published)?s:m); tileMeta[pickKey(p)] = {ago:newest.ago, count:g.length}; } });
    /* Newest first across all of your streams; a story shared by two streams shows once */
    const out = [], seenTitles = new Set();
    groups.flat().sort((a,b) => new Date(b.published||0) - new Date(a.published||0))
      .forEach(s => { const k = s.link||s.title; if(!seenTitles.has(k)){ seenTitles.add(k); out.push(s); } });
    if(out.length) stories = out;
  }
  liveMode = true;
}
function sampleMode(){
  games = SAMPLE_GAMES;
  const keys = new Set(picks.map(pickKey));
  stories = SAMPLE_STORIES.filter(s => s.key==='featured' || keys.has(s.key));
  tileMeta = {}; stories.forEach(s => { if(!tileMeta[s.key]) tileMeta[s.key] = {ago:s.ago, count:1}; });
}
function refresh(){ return loadLive(true).then(renderAll).catch(()=>{}); }

/* ================= Boot ================= */
sampleMode(); renderAll();
/* loading screen stays up until the first real data arrives (or 12s, whichever comes first) */
const hideSplash = () => { const sp = $('#splash'); if(sp && !sp.classList.contains('done')){ sp.classList.add('done'); setTimeout(()=>sp.remove(), 450); } };
setTimeout(hideSplash, 12000);
picks.forEach(p => { if(p.type==='team' && !p.colorChecked) fillColors(p); });
refresh().finally(hideSplash);
setInterval(()=>{ if(liveMode) loadLive().then(()=>{ renderTicker(); renderScores(); if(drawerOpen()) renderDrawer(); if(tpKey){ const p = picks.find(x=>pickKey(x)===tpKey); if(p) loadTeamGames(p); } }).catch(()=>{}); }, 60000);
})();
</script>
