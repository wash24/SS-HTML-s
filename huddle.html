<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Huddle">
<meta name="theme-color" content="#141415">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Huddle Sports App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap">
<style>
/* Layout: 2015-era sports stream app — score ticker on top, full-bleed story cards, team-color tile rail, three-tab bar fixed at the bottom */
:root{
  --chrome:#2b2b2d;      /* app chrome / card body */
  --chrome-2:#3a3a3d;    /* raised strips */
  --ink:#141415;         /* deepest bg */
  --paper:#f2f2f0;       /* primary text */
  --mute:#a3a3a6;        /* timestamps, labels */
  --flame:#e8542a;       /* the one accent: active tab */
  --font-display:"Oswald","Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;
  --font-body:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--chrome);position:relative;overflow:hidden}

/* ---------- Top games ticker ---------- */
.ticker{background:var(--ink);display:flex;align-items:stretch;gap:0;flex:none;position:relative}
.ticker-label{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:6px 4px;border-right:1px solid #2f2f31;flex:none;display:flex;align-items:center;justify-content:center}
.ticker-rail{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 6px 8px 6px;scrollbar-width:none;flex:1;min-width:0}
.ticker-rail::-webkit-scrollbar{display:none}
.gear{flex:none;width:40px;display:flex;align-items:center;justify-content:center;color:var(--paper);border-left:1px solid #2f2f31}
.gear svg{width:20px;height:20px}
.game{flex:none;width:132px;scroll-snap-align:start;background:#1d1d1f;display:flex;flex-direction:column;font-family:var(--font-display)}
.game-status{font-size:12px;letter-spacing:.02em;padding:4px 7px 3px;color:#fff;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.team-row{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;height:28px;padding:0 7px 0 32px;font-size:16px;line-height:1;font-variant-numeric:tabular-nums}
/* Logo is oversized and pushed off the left edge so only its right side shows, clipped top/bottom/left by the row */
.team-row .mono{position:absolute;left:-17px;top:50%;width:46px;height:46px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;pointer-events:none}
.team-row .mono img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(1px 0 1px rgba(0,0,0,.35))}
.team-row .mono.txt{justify-content:flex-end;font-family:var(--font-display);font-weight:700;font-size:44px;letter-spacing:-.02em;color:rgba(255,255,255,.3);padding-right:0}
.team-row .ab,.team-row .sc,.team-row .rec{position:relative;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.team-row .ab{font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-row .rk{font-size:10px;opacity:.8;margin-right:2px}
.team-row .sc{font-weight:600;min-width:20px;text-align:right}
.team-row .rec{font-size:12px;font-weight:400;opacity:.8;margin-left:4px}
.team-row.loser{opacity:.62}

/* ---------- Views ---------- */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none!important}

/* story card */
.card{background:var(--chrome);border-bottom:6px solid var(--ink)}
.card-head{display:flex;align-items:flex-end;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.card-head .src{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:13px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.src-chip{min-width:22px;height:22px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff;border-radius:3px}
.card h2{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.08;margin:0;letter-spacing:.005em;text-wrap:balance;flex:1;min-width:0}
.card .ago{font-family:var(--font-display);font-size:18px;color:var(--mute);flex:none;align-self:flex-start;padding-top:22px}
.headline-wrap{display:flex;gap:10px;padding:0 max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}

.hero{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:#101014}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .art{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.hero .over{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--font-display);text-transform:uppercase}
.hero .over b{display:block;font-size:clamp(30px,10vw,46px);font-weight:700;letter-spacing:.02em;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero .over span{display:block;font-size:clamp(14px,4.4vw,20px);letter-spacing:.18em;font-weight:400;opacity:.85;margin-top:4px}

.actions{display:grid;grid-template-columns:repeat(4,1fr) 44px;background:var(--chrome-2);font-family:var(--font-display);font-size:15px;color:#cfcfd2}
.actions button{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 0}
.actions svg{width:17px;height:17px;fill:currentColor}
.actions button[aria-pressed="true"]{color:#ffc93a}

/* team tile rail */
.rail{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--ink);scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.tile{flex:none;width:86px;height:86px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;scroll-snap-align:start;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .dot{position:absolute;top:7px;left:7px;width:7px;height:7px;border-radius:50%;background:#fff}
.tile.seen .dot{display:none}
.tile .t-ago{position:absolute;top:5px;right:6px;font-family:var(--font-display);font-size:12px;opacity:.85}
.tile .badge{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.02em}
.tile .t-name{font-family:var(--font-display);font-size:14px;letter-spacing:.01em}
.tile[aria-pressed="true"]{outline:3px solid #fff;outline-offset:-3px}

.filterbar{display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mute);background:var(--ink)}
.filterbar button{color:var(--flame)}

/* compact story */
.mini{display:flex;gap:12px;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));background:var(--chrome);border-bottom:1px solid #222224}
.mini .thumb{width:96px;aspect-ratio:4/3;flex:none;background:#151517;overflow:hidden;position:relative}
.mini .thumb img{width:100%;height:100%;object-fit:cover}
.mini .thumb .art{position:absolute;inset:0}
.mini .txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.mini h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:18px;line-height:1.12;text-wrap:balance}
.mini .meta{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}

/* scores view */
.league-head{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--mute);background:var(--ink);padding:10px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.score-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--chrome);border-bottom:1px solid #222224;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.score-row .teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.score-row .tl{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.score-row .sw{width:6px;height:22px;flex:none}
.score-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-row .tl b{font-weight:600;min-width:28px;text-align:right}
.score-row .st{font-family:var(--font-display);font-size:13px;text-transform:uppercase;color:var(--mute);text-align:right;width:84px}
.score-row .st.live{color:#ff4b3a}

/* alerts view */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--chrome);border-bottom:1px solid #222224;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px))}
.alert .src-chip{width:34px;height:34px;font-size:12px;border-radius:50%;flex:none}
.alert p{margin:0;font-size:15px;line-height:1.3}
.alert .meta{font-size:12px;color:var(--mute);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.alert.unread p{font-weight:700}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1.25fr 1fr;background:#3b3b3e;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;box-shadow:0 -1px 0 #1b1b1d}
.tab{height:58px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-display);font-size:21px;color:#e5e5e7;position:relative}
.tab[aria-selected="true"]{background:var(--flame);color:#fff}
.tab .count{position:absolute;top:8px;right:calc(50% - 46px);background:#d7261e;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-family:var(--font-body);font-weight:700}
.tab .bars{width:20px;display:flex;flex-direction:column;gap:3px;opacity:.75}
.tab .bars i{display:block;height:2px;background:currentColor}
.tab .pip{width:7px;height:7px;border-radius:50%;background:#fff;margin-left:2px;align-self:flex-start;margin-top:17px}


/* tile logos + add tile */
.tile .t-logo{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.tile .t-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.logo-txt{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff}
.tile .t-name{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.add{background:var(--chrome-2);box-shadow:inset 0 0 0 2px #5a5a5e}
.tile.add .plus{font-family:var(--font-display);font-size:38px;line-height:.9;font-weight:400;color:var(--flame)}
.src-chip.logo{padding:1px}
.src-chip.logo img{width:20px;height:20px;object-fit:contain}
.src-chip .logo-txt{font-size:10px}
.ticker-empty{font-family:var(--font-display);color:var(--mute);font-size:14px;padding:22px 10px;white-space:nowrap}

/* team picker sheet */
.sheet{position:absolute;inset:0;z-index:20;background:var(--chrome);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.sheet-head h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.done{background:var(--flame);color:#fff;font-family:var(--font-display);font-size:17px;padding:7px 18px}
.picked-label,.section-label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--mute)}
.picked-label{background:var(--ink);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.section-label{background:var(--ink);padding:10px 14px 7px}
.picked{display:flex;gap:4px;overflow-x:auto;padding:6px 8px 10px;background:var(--ink);min-height:82px;scrollbar-width:none;flex:none}
.picked::-webkit-scrollbar{display:none}
.pchip{flex:none;width:66px;height:66px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-family:var(--font-display);font-size:11px}
.pchip img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.pchip>span:last-child{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .x{position:absolute;top:1px;right:4px;font-size:15px;line-height:1;opacity:.9}
.picked-empty{color:var(--mute);font-size:14px;padding:22px 6px}
.lg-tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--chrome-2);flex:none}
.lg-tab{padding:11px 0 9px;font-family:var(--font-display);font-size:17px;color:#cfcfd2;border-bottom:3px solid transparent}
.lg-tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--flame)}
.search{padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:var(--chrome-2);border-top:1px solid #2a2a2c;flex:none}
.search input{width:100%;font:16px var(--font-body);color:var(--paper);background:var(--ink);border:1px solid #4a4a4e;padding:9px 12px;border-radius:0}
.search input:focus{outline:2px solid var(--flame);outline-offset:-1px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--chrome);border-bottom:1px solid #222224;padding:9px max(14px,env(safe-area-inset-right,0px)) 9px max(14px,env(safe-area-inset-left,0px))}
.opt .lg{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.opt .lg img{width:32px;height:32px;object-fit:contain}
.opt .nm{flex:1;min-width:0;font-size:17px;display:flex;flex-direction:column;gap:1px}
.opt .sub{font-size:12px;color:var(--mute);letter-spacing:.04em}
.opt .chk{width:28px;height:28px;flex:none;border:2px solid #6a6a6e;border-radius:50%;position:relative}
.opt .chk::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:#bdbdc0}
.opt[aria-pressed="true"] .chk{background:var(--flame);border-color:var(--flame)}
.opt[aria-pressed="true"] .chk::after{content:"✓";color:#fff;font-size:15px}
.league-opt{background:var(--chrome-2)}
.opt .lg.plate{background:#1c1c1e;border-radius:50%}
.conf-label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--mute);background:var(--ink);padding:10px max(14px,env(safe-area-inset-right,0px)) 7px max(14px,env(safe-area-inset-left,0px))}

.datanote{font-size:11px;color:var(--mute);text-align:center;padding:14px 16px 4px;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<div class="app" id="app">
  <header class="ticker">
    <div class="ticker-label">Top Games</div>
    <div class="ticker-rail" id="ticker" aria-label="Top games"></div>
    <button class="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
  </header>

  <main class="views">
    <section class="view" id="view-teams" aria-label="My Teams"></section>
    <section class="view" id="view-scores" aria-label="Scores" hidden></section>
    <section class="view" id="view-alerts" aria-label="Alerts" hidden></section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="alerts" id="tab-alerts" aria-selected="false">Alerts<span class="count" id="alertCount">9+</span></button>
    <button class="tab" role="tab" data-view="teams" id="tab-teams" aria-selected="true"><span class="bars"><i></i><i></i><i></i></span>My Teams<span class="pip"></span></button>
    <button class="tab" role="tab" data-view="scores" id="tab-scores" aria-selected="false">Scores</button>
  </nav>

  <section class="sheet" id="picker" aria-hidden="true" aria-label="Edit my teams">
    <div class="sheet-head"><h2>My Teams</h2><button class="done" id="pickerDone">Done</button></div>
    <div class="picked-label">Selected · tap to remove</div>
    <div class="picked" id="picked"></div>
    <div class="lg-tabs" role="tablist">
      <button class="lg-tab" role="tab" data-lg="nfl">NFL</button><button class="lg-tab" role="tab" data-lg="mlb">MLB</button><button class="lg-tab" role="tab" data-lg="nba">NBA</button><button class="lg-tab" role="tab" data-lg="cfb">CFB</button><button class="lg-tab" role="tab" data-lg="cbb">CBB</button>
    </div>
    <div class="search"><input id="teamSearch" type="search" placeholder="Search teams" autocomplete="off" aria-label="Search teams"></div>
    <div class="sheet-body" id="pickerList"></div>
  </section>
</div>

<script>
(function(){
/* ================= Config ================= */
const NCAA_LOGO = 'https://a.espncdn.com/i/espn/misc_logos/500/ncaa.png';
const LG = {
  nfl:{label:'NFL', name:'NFL', path:'football/nfl', sb:'scoreboard?limit=100', teams:'standings', color:'#013369', periods:4,
       logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png', logoDir:'nfl'},
  mlb:{label:'MLB', name:'MLB', path:'baseball/mlb', sb:'scoreboard', teams:'standings', color:'#041E42', periods:9,
       logo:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png', logoDir:'mlb'},
  nba:{label:'NBA', name:'NBA', path:'basketball/nba', sb:'scoreboard', teams:'standings', color:'#C9082A', periods:4,
       logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png', logoDir:'nba'},
  cfb:{label:'CFB', name:'College Football', path:'football/college-football', sb:'scoreboard?groups=80&limit=500', teams:'standings?group=80', color:'#1f5f3a', periods:4,
       logo:NCAA_LOGO, logoDir:'ncaa', college:true},
  cbb:{label:'CBB', name:'College Basketball', path:'basketball/mens-college-basketball', sb:'scoreboard?groups=50&limit=500', teams:'standings?group=50', color:'#a9532a', periods:2,
       logo:NCAA_LOGO, logoDir:'ncaa', college:true},
};
const LG_ORDER = ['nfl','mlb','nba','cfb','cbb'];
const API = 'https://site.api.espn.com/apis/site/v2/sports/';
const API_V2 = 'https://site.api.espn.com/apis/v2/sports/';
const CORE = 'https://sports.core.api.espn.com/v2/sports/';
const STORE_KEY = 'huddle.picks.v1';

/* Offline fallback team lists (used only if ESPN can't be reached) */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex = c => !c ? '#444' : (c[0]==='#' ? c : '#'+c);
function lum(c){ c = hex(c).slice(1); if(c.length!==6) return .3; const [r,g,b]=[0,2,4].map(i=>parseInt(c.substr(i,2),16)/255); return .2126*r+.7152*g+.0722*b; }
const teamBg = (color, alt) => (lum(color) > .78 && alt) ? hex(alt) : hex(color);
/* <img> that swaps itself for text if the logo can't load */
const logoImg = (src, text, cls='') => src
  ? `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" onerror="this.outerHTML='<b class=&quot;logo-txt&quot;>${esc(text)}</b>'">`
  : `<b class="logo-txt">${esc(text)}</b>`;
function timed(url, ms=7000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  return fetch(url,{signal:c.signal}).then(r=>{clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json();});
}
function ago(iso){ const m = Math.max(1, Math.round((Date.now()-new Date(iso))/60000)); return m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'; }

/* ---- Status strip: pregame "10/26 7:00PM CT" (date dropped on game day), live "3rd ... 2:50", "Final" ---- */
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function periodLabel(g){ const reg = (LG[g.lg]||{}).periods || 4; if(g.period>reg){ const k=g.period-reg; return (k>1?k:'')+'OT'; } return ordinal(g.period||1); }
function tzLabel(d){
  try{ const p = new Intl.DateTimeFormat('en-US',{timeZoneName:'shortGeneric'}).formatToParts(d).find(x=>x.type==='timeZoneName');
       if(p && p.value.length<=4) return p.value; }catch(e){}
  try{ const p = new Intl.DateTimeFormat('en-US',{timeZoneName:'short'}).formatToParts(d).find(x=>x.type==='timeZoneName');
       if(p) return p.value.replace(/^([A-Z])[SD]T$/,'$1T'); }catch(e){}
  return '';
}
function statusParts(g){
  if(g.postponed) return ['Postponed',''];
  if(g.lg==='mlb' && (g.live||g.final)) return [g.detail || (g.final?'Final':''), ''];
  if(g.final) return [g.period>((LG[g.lg]||{}).periods||4) ? 'Final/'+periodLabel(g) : 'Final',''];
  if(g.live){
    if(g.half) return ['Half',''];
    if(g.endPeriod) return ['End '+periodLabel(g),''];
    return [periodLabel(g), g.clock||''];
  }
  const d = new Date(g.date), now = new Date();
  const time = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s/g,'') + ' ' + tzLabel(d);
  const sameDay = d.toDateString()===now.toDateString();
  return [sameDay ? time : `${d.getMonth()+1}/${d.getDate()} ${time}`, ''];
}
const myTeamKeys = () => new Set(picks.filter(p=>p.type==='team').map(pickKey));
const gameHasMine = (g, mine) => mine.has(`${g.lg}:${g.a.id}`) || mine.has(`${g.lg}:${g.h.id}`);
function orderGames(list){
  const mine = myTeamKeys(), act = activeLeagues();
  const rank = g => g.live?0 : g.final?2 : 1;
  return list.filter(g => act.includes(g.lg))
    .sort((x,y)=> (gameHasMine(y,mine)-gameHasMine(x,mine)) || rank(x)-rank(y) || new Date(x.date)-new Date(y.date));
}

function teamRow(t, g){
  const showScore = g.live||g.final;
  const sc = showScore ? `<span class="sc">${esc(t.sc)}</span>` : '';
  const rec = (!showScore && t.rec) ? `<span class="rec">(${esc(t.rec)})</span>` : '';
  const loser = g.final && Number(t.sc) < Number((t===g.a?g.h:g.a).sc);
  const L = LG[g.lg] || {};
  const logo = t.logo || (t.ab ? (L.college ? (t.id?`https://a.espncdn.com/i/teamlogos/ncaa/500/${t.id}.png`:'') : `https://a.espncdn.com/i/teamlogos/${L.logoDir}/500/${t.ab.toLowerCase()}.png`) : '');
  const fallback = esc(t.ab.slice(0,1));
  const mono = logo
    ? `<span class="mono"><img src="${esc(logo)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('txt');this.parentNode.textContent='${fallback}'"></span>`
    : `<span class="mono txt">${fallback}</span>`;
  return `<div class="team-row${loser?' loser':''}" style="background:${hex(t.color)}">
    ${mono}
    <span class="ab">${t.rank?`<span class="rk">${t.rank}</span>`:''}${esc(t.ab)}${rec}</span>${sc}</div>`;
}

  return {key:pickKey(p), name: LG[p.lg].college ? p.location : p.nick, bg:teamBg(p.color,p.alt), logo:p.logo, text:p.ab};

function renderTeams(){
  const list = filter ? stories.filter(s=>s.key===filter) : stories;
  let html = '';
  if(filter){
    const p = picks.find(x=>pickKey(x)===filter); const v = p ? pickView(p) : {name:'Team'};
    html += rail() + `<div class="filterbar"><span>${esc(v.name)} stream · ${list.length} stories</span><button data-clear>All teams</button></div>`;
    html += list.length ? list.map((s,i)=> i===0?bigCard(s):mini(s)).join('') : `<div class="datanote">No new stories for ${esc(v.name)} yet.</div>`;
  } else {
    const leadIdx = Math.max(0, list.findIndex(s=>s.img||s.art));
    const lead = list[leadIdx]; const rest = list.filter((_,i)=>i!==leadIdx);
    const [second, ...more] = rest;
    html += (lead?bigCard(lead):'') + rail() + (second?bigCard(second):'') + more.map(mini).join('');
  }
  html += `<div class="datanote">${liveMode?'Live scores and headlines from ESPN':'Sample scores and stories · live ESPN data loads when hosted'}</div>`;

/* ================= Team picker ================= */
const teamCache = {};          /* lg -> [{...team}] */
let pickerLg = 'nfl', pickerQuery = '', pickerOffline = {};
async function getTeams(lg){
  if(teamCache[lg]) return teamCache[lg];
  try{
    /* Standings list every team with logo and conference, and (unlike /teams) allow requests from other sites */
    const j = await timed(API_V2+LG[lg].path+'/'+LG[lg].teams, 12000);
    const out = [], ids = new Set();
    const walk = (g, conf) => {
      ((g.standings&&g.standings.entries)||[]).forEach(e => { const t = e.team; if(!t || ids.has(String(t.id)) || t.isActive===false) return; ids.add(String(t.id));
        out.push({lg, id:String(t.id), ab:t.abbreviation, location:t.location, nick:t.name || t.shortDisplayName, full:t.displayName,
          conf, logo:(t.logos&&t.logos[0]&&t.logos[0].href) || ''}); });
      (g.children||[]).forEach(c => walk(c, c.shortName || c.abbreviation || c.name));
    };
    walk(j, j.shortName || j.abbreviation || LG[lg].label);
    if(!out.length) throw new Error('empty');
    const confs = [...new Set(out.map(t=>t.conf))].sort((a,b)=>a.localeCompare(b));
    teamCache[lg] = out.sort((a,b)=> confs.indexOf(a.conf)-confs.indexOf(b.conf) || a.full.localeCompare(b.full));
    pickerOffline[lg] = false;
  }catch(e){ teamCache[lg] = fallbackTeams(lg); pickerOffline[lg] = true; }
  return teamCache[lg];
}
/* Team colors live on ESPN's core API; look them up when a team is picked */
async function fillColors(p){
  if(p.type!=='team' || p.colorChecked) return;
  try{ const j = await timed(CORE+LG[p.lg].path.replace('/','/leagues/')+'/teams/'+p.id, 8000);
    if(j.color) p.color = hex(j.color); if(j.alternateColor) p.alt = hex(j.alternateColor); p.colorChecked = true;
    savePicks(); if($('#picker').classList.contains('open')) renderPicked(); else renderAll();
  }catch(e){}
}
function renderPicked(){
  $('#picked').innerHTML = picks.length ? picks.map(p => { const v = pickView(p);
    return `<button class="pchip" style="background:${v.bg}" data-unpick="${esc(v.key)}" aria-label="Remove ${esc(v.name)}">
      <span class="x" aria-hidden="true">×</span>${logoImg(v.logo, v.text)}<span>${esc(v.name)}</span></button>`; }).join('')
    : `<div class="picked-empty">Nothing selected yet. Pick a league or team below.</div>`;
}
async function renderPickerBody(){
  document.querySelectorAll('.lg-tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.lg===pickerLg));
  const L = LG[pickerLg], body = $('#pickerList');
  const lgOn = isPicked(pickerLg);
  const head = `<button class="opt league-opt" data-pick-league="${pickerLg}" aria-pressed="${lgOn}">
      <span class="lg" style="background:${L.color}">${logoImg(L.logo, L.label)}</span>
      <span class="nm">All ${esc(L.name)}<span class="sub">League scores and top headlines</span></span><span class="chk" aria-hidden="true"></span></button>
    `;
  if(!teamCache[pickerLg]) body.innerHTML = head + `<div class="datanote">Loading ${esc(L.name)} teams…</div>`;
  const lgAtStart = pickerLg;
  const teams = await getTeams(pickerLg);
  if(lgAtStart!==pickerLg) return;
  const q = pickerQuery.trim().toLowerCase();
  const shown = q ? teams.filter(t => (t.full+' '+t.ab).toLowerCase().includes(q)) : teams;
  body.innerHTML = head + (pickerOffline[pickerLg] ? `<div class="datanote">Couldn't reach ESPN, so this is a short sample list. The full list loads when you're online.</div>` : '')
    + (shown.length ? shown.map((t,i) => { const key = `${t.lg}:${t.id}`, on = isPicked(key);
      const label = (!q && t.conf && (i===0 || shown[i-1].conf!==t.conf)) ? `<div class="conf-label">${esc(t.conf)}</div>` : '';
      return label + `<button class="opt" data-pick-team="${esc(key)}" aria-pressed="${on}">
        <span class="lg plate">${logoImg(t.logo, t.ab)}</span>
        <span class="nm">${esc(t.full)}<span class="sub">${esc(t.ab)}</span></span><span class="chk" aria-hidden="true"></span></button>`; }).join('')
      : `<div class="datanote">No ${esc(L.name)} teams match “${esc(pickerQuery)}”.</div>`);
}
function togglePick(p){
  const key = pickKey(p), i = picks.findIndex(x=>pickKey(x)===key);
  if(i>=0) picks.splice(i,1); else picks.push(p);
  if(filter===key) filter = null;
  savePicks(); renderPicked();
}
let picksAtOpen = '';
function openPicker(){
  picksAtOpen = JSON.stringify(picks);
  $('#picker').classList.add('open'); $('#picker').setAttribute('aria-hidden','false');
  renderPicked(); renderPickerBody();
}
function closePicker(){
  $('#picker').classList.remove('open'); $('#picker').setAttribute('aria-hidden','true');
  renderAll();
  if(JSON.stringify(picks)!==picksAtOpen) refresh();
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(tab){
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t===tab));
    document.querySelectorAll('.view').forEach(v=>v.hidden = v.id!=='view-'+tab.dataset.view);
    if(tab.dataset.view==='alerts'){ alerts.forEach(a=>a.unread=false); $('#alertCount').hidden = true; setTimeout(renderAlerts,1200); }
    return;
  }
  if(e.target.closest('[data-edit]') || e.target.closest('.gear')){ openPicker(); return; }
  if(e.target.closest('#pickerDone')){ closePicker(); return; }
  const lgTab = e.target.closest('.lg-tab');
  if(lgTab){ pickerLg = lgTab.dataset.lg; pickerQuery=''; $('#teamSearch').value=''; $('#pickerList').scrollTop=0; renderPickerBody(); return; }
  const pl = e.target.closest('[data-pick-league]');
  if(pl){ togglePick({type:'league', lg:pl.dataset.pickLeague}); pl.setAttribute('aria-pressed', isPicked(pl.dataset.pickLeague)); return; }
  const pt = e.target.closest('[data-pick-team]');
  if(pt){ const key = pt.dataset.pickTeam, [lg,id] = key.split(':'); const t = (teamCache[lg]||[]).find(x=>x.id===id);
    if(t){ const p = {type:'team', lg, id, ab:t.ab, location:t.location, nick:t.nick, full:t.full, color:t.color||'#3a3a3d', alt:t.alt, logo:t.logo}; togglePick(p); pt.setAttribute('aria-pressed', isPicked(key)); if(isPicked(key)) fillColors(p); }
    return; }
  const un = e.target.closest('[data-unpick]');
  if(un){ const p = picks.find(x=>pickKey(x)===un.dataset.unpick); if(p){ togglePick(p); renderPickerBody(); } return; }
  const tile = e.target.closest('[data-team]');
  if(tile){ const id = tile.dataset.team; seen.add(id); filter = (filter===id) ? null : id; renderTeams(); $('#view-teams').scrollTop = 0; return; }
  if(e.target.closest('[data-clear]')){ filter=null; renderTeams(); return; }
  const star = e.target.closest('[data-star]');
  if(star){ const k=star.dataset.star; starred.has(k)?starred.delete(k):starred.add(k); star.setAttribute('aria-pressed', starred.has(k)); }
});
$('#teamSearch').addEventListener('input', e => { pickerQuery = e.target.value; renderPickerBody(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#picker').classList.contains('open')) closePicker(); });

/* ================= Live data (ESPN public site API) ================= */
function parseEvent(ev, lg){
  const comp = ev.competitions[0]; const st = comp.status.type;
  const side = ha => { const c = comp.competitors.find(x=>x.homeAway===ha); const tm=c.team;
    return {id:String(tm.id), ab:tm.abbreviation, name:tm.shortDisplayName||tm.displayName, color:tm.color, logo:tm.logo,
      sc:c.score, rec:(c.records&&c.records[0]&&c.records[0].summary)||'', rank:(c.curatedRank&&c.curatedRank.current<=25)?c.curatedRank.current:null}; };
  return {lg, live:st.state==='in', final:st.state==='post' && st.name!=='STATUS_POSTPONED', postponed:st.name==='STATUS_POSTPONED',
    half:st.name==='STATUS_HALFTIME', endPeriod:st.name==='STATUS_END_PERIOD', detail:st.shortDetail,
    period:comp.status.period, clock:comp.status.displayClock,
    a:side('away'), h:side('home'), date:ev.date};
}
const toStory = (a, key, src, chip, chipColor, chipLogo) => ({key, src, chip, chipColor, chipLogo, title:a.headline, published:a.published,
  ago:ago(a.published), img:a.images&&a.images[0]&&a.images[0].url, link:a.links&&a.links.web&&a.links.web.href});
async function loadLive(){
  const lgs = activeLeagues();
  const sb = await Promise.allSettled(lgs.map(k => timed(API+LG[k].path+'/'+LG[k].sb).then(j => j.events.map(e=>parseEvent(e,k)))));
  const got = sb.filter(r=>r.status==='fulfilled').flatMap(r=>r.value);
  if(!got.length && sb.every(r=>r.status==='rejected')) throw new Error('no live data');
  games = got;

  /* One news feed per pick: league feeds for league tiles, team feeds for team tiles */
  const feeds = await Promise.allSettled(picks.map(p => {
    const L = LG[p.lg];
    if(p.type==='league') return timed(API+L.path+'/news?limit=8').then(j => j.articles.map(a=>toStory(a, p.lg, L.name, L.label, L.color, L.logo)));
    const v = pickView(p);
    return timed(API+L.path+'/news?team='+p.id+'&limit=6').then(j => j.articles.map(a=>toStory(a, pickKey(p), p.full, p.ab, v.bg, p.logo)));
  }));
  const groups = feeds.map(r => r.status==='fulfilled' ? r.value : []);
  tileMeta = {};
  picks.forEach((p,i) => { const g = groups[i]; if(g.length){ const newest = g.reduce((m,s)=> new Date(s.published)>new Date(m.published)?s:m); tileMeta[pickKey(p)] = {ago:newest.ago, count:g.length}; } });
  /* Round-robin across picks so every team gets a turn near the top, no duplicate headlines */
  const out = [], seenTitles = new Set();
  for(let i=0; i<8; i++) groups.forEach(g => { const s = g[i]; if(s && !seenTitles.has(s.title)){ seenTitles.add(s.title); out.push(s); } });
  if(out.length) stories = out;
  liveMode = true;
}
function sampleMode(){
  games = SAMPLE_GAMES;
  const keys = new Set(picks.map(pickKey));
  stories = SAMPLE_STORIES.filter(s => s.key==='featured' || keys.has(s.key));
  tileMeta = {}; stories.forEach(s => { if(!tileMeta[s.key]) tileMeta[s.key] = {ago:s.ago, count:1}; });
}
function refresh(){ return loadLive().then(renderAll).catch(()=>{}); }

/* ================= Boot ================= */
sampleMode(); renderAll();
picks.forEach(p => { if(p.type==='team' && !p.colorChecked) fillColors(p); });
refresh();
setInterval(()=>{ if(liveMode) loadLive().then(()=>{ renderTicker(); renderScores(); }).catch(()=>{}); }, 60000);
})();
</script>
</body></html>
