  return pickers + `<div class="cfp"><div class="cfh"><span class="ck">Rk</span><span class="ct">Team</span><span class="cvh" style="right:54px">Pts</span></div>${rows}</div>` +
    (others ? `<div class="sfoot">Others receiving votes: ${esc(others)}</div>` : '');
}
function rankingsTab(){
  const v = lazy('rank:' + S.rkWeek, () => fetchRankings(S.rkWeek));
  if (v === undefined) return graySpin;
  return rankingsHTML(v, T.id);
}

/* ================= Top Stories ================= */
let silentTop = false, TOP_ITEMS = [];
const TYPE_W = {story: 30, headlinenews: 26, blogentry: 18, media: 12, preview: 8, recap: 10};
function rankStories(articles, events){
  const rank = {};
  events.forEach(e => (e.competitions?.[0]?.competitors || []).forEach(c => { const r = rankOf(c); if (r && c.team?.id) rank[String(c.team.id)] = r; }));
  const now = Date.now();
  const STOP = new Set(['the', 'and', 'for', 'with', 'from', 'after', 'into', 'over', 'versus', 'vs', 'his', 'her', 'their', 'game', 'highlights']);
  const words = h => new Set(String(h || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)));
  const same = (x, y) => { let n = 0; x.forEach(w => { if (y.has(w)) n++; }); return n >= 3 && n / Math.max(x.size, y.size) >= 0.6; };
  const scored = [];
  articles.forEach((a, order) => {
    if (!a.headline || !(a.images || []).some(i => i.url)) return;
    const type = String(a.type || '').toLowerCase();
    const isVid = /media|video/.test(type);
    const teams = (a.categories || []).filter(c => c.type === 'team').map(c => String(c.teamId || c.team?.id || '')).filter(Boolean);
    const best = Math.min(...teams.map(t => rank[t] || 99), 99);
    if (/recap|preview/.test(type) && best === 99) return;
    const hrs = Math.max(0, (now - new Date(a.published || a.lastModified || now)) / 3.6e6);
    if (hrs > 96) return;
    let score = (TYPE_W[type] ?? 15) - hrs / 3 - order * 0.15;
    if (best <= 25) score += 14 + (best <= 10 ? 10 : 0) + (best <= 4 ? 6 : 0);
    scored.push({a, score, isVid, w: words(a.headline)});
  });
  scored.sort((x, y) => y.score - x.score);
  const out = []; let vids = 0;
  for (const it of scored) {
    if (out.some(o => same(o.w, it.w)) || (it.isVid && vids >= 6)) continue;
    out.push(it); if (it.isVid) vids++;
    if (out.length >= 25) break;
  }
  return out.map(o => o.a);
}
function topStoriesHTML(articles, events){
  const live = events.filter(e => evState(e) === 'in');
  const ranks = e => { const {away, home} = sides(e); return [rankOf(away), rankOf(home)].filter(Boolean); };
  live.sort((a, b) => (ranks(b).length ? 60 - Math.min(...ranks(b)) : 0) - (ranks(a).length ? 60 - Math.min(...ranks(a)) : 0));
  const show = live.length <= 2 ? live : live.filter(e => ranks(e).length).slice(0, 4);
  let html = '<div class="tsw">';
  show.forEach(e => {
    const comp = e.competitions[0], {away, home} = sides(e), st = comp.status || e.status;
    const ac = teamColor(away.team), hc = teamColor(home.team);
    const side = c => `<div class="tsside"><img src="${esc(darkLogo(c.team))}" alt=""><b>${esc(c.team?.abbreviation || '')}</b></div>`;
    html += `<div class="ts tsg" data-gid="${esc(e.id)}">
      <div class="tsimg" style="background:linear-gradient(115deg, ${ac} 0%, ${shade(ac, -0.35)} 49.8%, ${shade(hc, -0.35)} 50.2%, ${hc} 100%)">
        <img class="tsl a" src="${esc(darkLogo(away.team))}" alt=""><img class="tsl h" src="${esc(darkLogo(home.team))}" alt="">
        <div class="tsov">${esc(teamLoc(away.team) + ' vs. ' + teamLoc(home.team))}: Live</div></div>
      <div class="tsbar">${side(away)}<span class="tsn">${esc(away.score ?? '')}</span><div class="tsm"><small>${esc(netOf(comp))}</small><b>${esc(liveStatus(st))}</b></div><span class="tsn">${esc(home.score ?? '')}</span>${side(home)}</div>
    </div>`;
  });
  TOP_ITEMS = rankStories(articles, events);
  TOP_ITEMS.forEach((a, i) => {
    const img = (a.images.find(x => x.width >= 500) || a.images[0]).url;
    const isVid = /media|video/i.test(a.type || '');
    const href = a.links?.web?.href || a.links?.mobile?.href || '#';
    html += `<a class="ts" ${isVid ? `href="#" data-tsv="${i}"` : `href="${esc(href)}" target="_blank" rel="noopener"`}>
      <div class="tsimg"><img src="${esc(img)}" alt="" loading="lazy">${isVid ? '<i class="play"></i>' : ''}</div>
      <div class="tshl">${esc(a.headline.replace(/: Game Highlights$/i, ''))}</div></a>`;
  });
  if (!show.length && !TOP_ITEMS.length) html += '<div class="msg" style="color:#777"><b style="color:#333">No stories</b>Check back soon.</div>';
  return html + '</div>';
}
content.addEventListener('click', e => {
  if (S.view !== 'top') return;
  const g = e.target.closest('.tsg[data-gid]');
  if (g) { openGame(g.dataset.gid); return; }
  const v = e.target.closest('[data-tsv]');
  if (v) { e.preventDefault(); playMedia(TOP_ITEMS[+v.dataset.tsv]); }
});

/* ================= Video ================= */
let VIDS = [];
async function renderVideo(){
  clearTimeout(S.timer);
  const token = ++S.token;
  content.innerHTML = '<div class="spin" style="margin-top:50px"></div>';
  const today = todayET();
  const [n, sbT, sbY] = await Promise.allSettled([getJSON(`${API}/news?limit=60`), loadDay(today, '50'), loadDay(addDays(today, -1), '50')]);
  if (token !== S.token) return;
  const media = (n.value?.articles || []).filter(a => /media|video/i.test(a.type || '')).slice(0, 24);
  // look each clip up for its stream, length and description
  const queue = [...media];
  await Promise.all(Array.from({length: 6}, async () => { while (queue.length) { const a = queue.shift(); await clipFor(a.id); } }));
  if (token !== S.token) return;
  VIDS = [];
  const seen = new Set();
  const add = (c, extra) => { const k = String(c?.id || c?.headline || ''); if (!c || !k || seen.has(k)) return; seen.add(k); VIDS.push({...c, ...extra}); };
  media.forEach(a => {
    const c = CLIPS[a.id] || {id: a.id, headline: a.headline, description: a.description, thumbnail: a.images?.[0]?.url, links: a.links};
    add(c, {thumbnail: c.posterImages?.full?.href || c.thumbnail || a.images?.[0]?.url, published: a.published, gameId: c.gameId});
  });
  // highlights from ranked games of the last two days that are not in the feed yet
  const evs = [...(sbT.value || []), ...(sbY.value || [])].filter(e => evState(e) === 'post' && (rankOf(sides(e).away) || rankOf(sides(e).home))).slice(0, 8);
  const sums = await Promise.allSettled(evs.map(e => getJSON(`${API}/summary?event=${e.id}`, false, 600e3)));
  if (token !== S.token) return;
  sums.forEach(r => (r.value?.videos || []).forEach(v => add(v, {})));
  // a short game line under game highlights ("Minnesota upsets #1 Indiana 77-73" style)
  const lineFor = c => {
    const e = S.ev[c.gameId] || Object.values(S.ev).find(x => String(x.id) === String(c.gameId));
    if (!e || evState(e) !== 'post') return '';
    const {away, home} = sides(e);
    const [w, l] = away.winner ? [away, home] : [home, away];
    const rw = rankOf(w), rl = rankOf(l);
    const verb = rl && (!rw || rl < rw) ? 'upsets' : 'beats';
    return `${teamLoc(w.team)} ${verb} ${rl ? '#' + rl + ' ' : ''}${teamLoc(l.team)} ${scoreOf(w)}-${scoreOf(l)}`;
  };
  if (!VIDS.length) { content.innerHTML = '<div class="msg" style="margin-top:60px"><b>No videos yet</b>Check back soon.</div>'; return; }
  content.innerHTML = '<div class="vlist">' + VIDS.map((c, i) => {
    const head = String(c.headline || c.title || '').replace(/: Game Highlights$/i, ' Highlights');
    let cap = lineFor(c) || (c.description && c.description !== c.headline ? c.description : '');
    const when = c.published || c.originalPublishDate || c.lastModified;
    return `<button class="vc" data-vv="${i}"><div class="vth" style="background-image:url('${esc(c.thumbnail || c.posterImages?.default?.href || '')}')"><i class="play"></i>
      <div class="vov"><b>${esc(head)}</b><span>${esc(clipDur(c.duration))}</span></div></div>
      <div class="vcap">${esc(cap || head)}${when ? `<small>${esc(ago(when))}</small>` : ''}</div></button>`;
  }).join('') + '</div>';
}
content.addEventListener('click', e => {
  if (S.view !== 'video') return;
  const v = e.target.closest('[data-vv]');
  if (v) { const c = VIDS[+v.dataset.vv]; if (clipSrc(c)) playClip(c); else playMedia(c); }
});

/* ================= Teams directory ================= */
S.dirTab = 'conf'; S.dirConf = null;
let DIR = null;
async function loadDirectory(){
  if (DIR) return DIR;
  const confs = [];
  try {
    const d = await getJSON(`${API2}/standings?group=50&season=${seasonYear()}`);
    (d.children || []).forEach(c => {
      const teams = [];
      const walk = n => { (n?.standings?.entries || []).forEach(e => e.team?.id && teams.push(e.team)); (n?.children || []).forEach(walk); };
      walk(c);
      if (teams.length) confs.push({id: String(c.id || ''), name: (c.name || '').replace(/\s+Conference$/, '') || CONF_SHORT[c.id], teams});
    });
  } catch (e) {}
  const all = [...new Map(confs.flatMap(c => c.teams).map(t => [String(t.id), t])).values()];
  confs.forEach(c => c.teams.sort((a, b) => teamLoc(a).localeCompare(teamLoc(b))));
  confs.sort((a, b) => a.name.localeCompare(b.name));
  all.sort((a, b) => teamLoc(a).localeCompare(teamLoc(b)));
  return (DIR = {confs, all});
}
async function renderTeamsDir(){
  const token = ++S.token;
  const tabs = `<div class="dtabs"><button data-dt="conf"${S.dirTab === 'conf' ? ' class="on"' : ''}>By Conference</button><button data-dt="name"${S.dirTab === 'name' ? ' class="on"' : ''}>By Name</button></div>`;
  if (!DIR) content.innerHTML = tabs + '<div class="spin" style="margin-top:50px"></div>';
  const d = await loadDirectory();
  if (token !== S.token) return;
  if (!d.confs.length) { DIR = null; content.innerHTML = tabs + '<div class="msg">Teams are not available right now.</div>'; return; }
  const row = t => `<button class="drow dteam" data-team="${esc(t.id)}"><img src="${esc(LOGO_DARK(t.id))}" alt="" onerror="this.onerror=null;this.src='${esc(logoOf(t))}'"><span>${esc(teamLoc(t))}</span></button>`;
  let body = '';
  if (S.dirTab === 'name') body = '<div class="dgap" style="height:8px"></div>' + d.all.map(row).join('');
  else if (S.dirConf) {
    const c = d.confs.find(x => x.id === S.dirConf);
    body = `<button class="drow dback" data-dconf="">‹ <span>Conferences</span></button><div class="dlab">${esc(c?.name || '')}</div>` + (c?.teams || []).map(row).join('');
  } else body = `<div class="dlab">Division I</div>` + d.confs.map(c => `<button class="drow" data-dconf="${esc(c.id)}"><span>${esc(c.name)}</span></button>`).join('');
  content.innerHTML = tabs + `<div class="dlist">${body}</div>`;
  setTitle(S.dirTab === 'conf' && S.dirConf ? (CONF_SHORT[S.dirConf] || 'Teams') : 'Teams');
}
content.addEventListener('click', e => {
  if (S.view !== 'teams') return;
  const t = e.target.closest('[data-dt]');
  if (t) { S.dirTab = t.dataset.dt; S.dirConf = null; content.scrollTop = 0; renderTeamsDir(); return; }
  const c = e.target.closest('[data-dconf]');
  if (c) { S.dirConf = c.dataset.dconf || null; content.scrollTop = 0; renderTeamsDir(); return; }
  const tm = e.target.closest('.dteam[data-team]');
  if (tm) openTeam(tm.dataset.team);
});

/* ================= Statistics: national leaders ================= */
const LEADER_STATS = [
  {key: 'pointsPerGame', label: 'Points Per Game', col: 'PPG'},
  {key: 'reboundsPerGame', label: 'Rebounds Per Game', col: 'RPG'},
  {key: 'assistsPerGame', label: 'Assists Per Game', col: 'APG'},
  {key: 'stealsPerGame', label: 'Steals Per Game', col: 'SPG'},
  {key: 'blocksPerGame', label: 'Blocks Per Game', col: 'BPG'},
  {key: 'fieldGoalPercentage', label: 'Field Goal %', col: 'FG%'},
  {key: '3PointPct', label: '3-Point %', col: '3P%'},
  {key: 'FreeThrowPct', label: 'Free Throw %', col: 'FT%'},
  {key: '3PointsMadePerGame', alt: '3PointMadePerGame', label: '3-Pointers Per Game', col: '3PM'},
  {key: 'doubleDouble', label: 'Double-Doubles', col: 'DD'},
];
S.ldGroup = store.get('cbb.ldGroup', '50'); S.ldStat = store.get('cbb.ldStat', 'pointsPerGame');
const LEADERS = {};
async function leaders(group, st, yr){
  const d = await getJSON(`${CORE}/seasons/${yr}/types/2/groups/${group}/leaders?limit=50`, false, 600e3);
  const cat = (d.categories || []).find(c => c.name === st.key || c.name === st.alt);
  if (!cat) return null;
  const list = (cat.leaders || []).slice(0, 50);
  const got = await resolveRefs(list.flatMap(l => [l.athlete?.$ref, l.team?.$ref]));
  return list.map(l => {
    const p = got[fixRef(l.athlete?.$ref)] || {}, t = got[fixRef(l.team?.$ref)] || {};
    return {name: p.shortName || p.displayName, team: t.abbreviation || '', teamId: t.id, logo: t.logos?.[0]?.href || (t.id ? LOGO(t.id) : ''), value: l.displayValue ?? l.value};
  }).filter(r => r.name);
}
async function renderStatLeaders(){
  const token = ++S.token;
  const st = LEADER_STATS.find(x => x.key === S.ldStat) || LEADER_STATS[0];
  const groups = [['50', 'Division I'], ...CONF_LIST];
  const gName = (groups.find(g => g[0] === S.ldGroup) || groups[0])[1];
  const yr = seasonYear();
  const pickers = `<div class="pickers"><label class="pk"><i class="tri"></i><span>${esc(gName)}</span><select id="ldGroupSel">${groups.map(g => `<option value="${g[0]}"${g[0] === S.ldGroup ? ' selected' : ''}>${esc(g[1])}</option>`).join('')}</select></label>` +
    `<label class="pk"><i class="tri"></i><span>${esc(st.col)}</span><select id="ldStatSel">${LEADER_STATS.map(x => `<option value="${x.key}"${x.key === st.key ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}</select></label></div><div style="height:12px"></div>`;
  const key = `${yr}|${S.ldGroup}|${st.key}`;
  if (!LEADERS[key]) content.innerHTML = pickers + graySpin;
  let rows = LEADERS[key];
  if (!rows) { try { rows = await leaders(S.ldGroup, st, yr); } catch (e) {} if (rows?.length) LEADERS[key] = rows; }
  if (token !== S.token || S.view !== 'stats') return;
  if (!rows || !rows.length) { content.innerHTML = pickers + '<div class="gempty"><b>Statistics</b>Stat leaders are not available right now.</div>'; return; }
  const body = rows.map((r, i) => `<div class="ldr" data-team="${esc(r.teamId || '')}"><b class="lk">${i + 1}</b>${r.logo ? `<img src="${esc(r.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="li"></span>'}<span class="ln">${esc(r.name)}${r.team ? ` <small>${esc(r.team)}</small>` : ''}</span><span class="lv">${esc(r.value)}</span></div>`).join('');
  content.innerHTML = pickers + `<div class="scard" style="margin-top:0"><div class="ldh"><span>Rk</span><span>Player</span><span>${esc(st.col)}</span></div>${body}</div>`;
}

/* ================= side-menu pages ================= */
S.sconf = store.get('cbb.sconf', '7');
async function renderPage(){
  const token = ++S.token, view = S.view;
  if (view === 'standings') {
    const cl = CONF_LIST.find(c => c[0] === S.sconf) || CONF_LIST[0];
    const picker = `<div class="pickers"><label class="pk"><i class="tri"></i><span>${esc(cl[1])}</span><select id="sconfSel">${CONF_LIST.map(c => `<option value="${c[0]}"${c[0] === S.sconf ? ' selected' : ''}>${esc(c[1])}</option>`).join('')}</select></label></div><div style="height:12px"></div>`;
    content.innerHTML = picker + graySpin;
    let v = null;
    try { v = await fetchStandings(S.sconf, seasonYear()); } catch (e) {}
    if (token !== S.token) return;
    content.innerHTML = picker + standingsHTML(v, S.sconf, null);
  } else if (view === 'rankings') {
    content.innerHTML = graySpin;
    let v = null;
    try { v = await fetchRankings(S.rkWeek); } catch (e) {}
    if (token !== S.token) return;
    content.innerHTML = rankingsHTML(v, null);
  } else if (view === 'news') renderNews();
  else if (view === 'stats') renderStatLeaders();
  else if (view === 'teams') renderTeamsDir();
  else if (view === 'video') renderVideo();
  else if (view === 'top') {
    if (!silentTop) content.innerHTML = '<div class="spin" style="margin-top:50px;border-color:#aaa;border-top-color:#555"></div>';
    const today = todayET();
    const [n, sb] = await Promise.allSettled([getJSON(`${API}/news?limit=60`, silentTop), loadDay(today, '50', silentTop)]);
    if (token !== S.token) return;
    const y = content.scrollTop;
    content.innerHTML = topStoriesHTML(n.value?.articles || [], sb.value || []);
    if (silentTop) content.scrollTop = y;
    silentTop = false;
    clearTimeout(S.timer);
    S.timer = setTimeout(() => { if (S.view === 'top' && !document.hidden) { silentTop = true; renderPage(); } }, 30000);
  }
}
content.addEventListener('change', e => {
  if (e.target.id === 'rkWeekSel' || e.target.id === 'rkPollSel') {
    if (e.target.id === 'rkWeekSel') S.rkWeek = e.target.value; else S.pollName = e.target.value;
    if (S.view === 'team') renderTeam(true); else renderPage();
    return;
  }
  if (e.target.id === 'ldGroupSel') { S.ldGroup = e.target.value; store.set('cbb.ldGroup', S.ldGroup); renderStatLeaders(); return; }
  if (e.target.id === 'ldStatSel') { S.ldStat = e.target.value; store.set('cbb.ldStat', S.ldStat); renderStatLeaders(); return; }
  if (e.target.id === 'sconfSel') { S.sconf = e.target.value; store.set('cbb.sconf', S.sconf); renderPage(); }
});
content.addEventListener('click', e => {
  if (!['standings', 'rankings', 'stats'].includes(S.view)) return;
  const tr = e.target.closest('.strow[data-team], .cfr[data-team], .ldr[data-team]');
  if (tr && tr.dataset.team) openTeam(tr.dataset.team);
});
document.addEventListener('click', e => { if (!e.target.closest('#band')) closeMenu(); });

/* ---------------- boot ---------------- */
async function boot(){
  const startHash = location.hash;
  $('#badge').innerHTML = `<img src="${BADGE}" alt="">`;
  content.innerHTML = '<div class="spin"></div>';
  try {
    const d = await getJSON(`${API}/scoreboard?groups=50&limit=1000`);
    S.weeks = buildWeeks(d);
    S.season = d.leagues?.[0]?.season?.year || null;
    const today = todayET();
    S.weekKey = (S.weeks.find(w => w.from <= today && today <= w.to) || S.weeks.find(w => w.from > today) || S.weeks[S.weeks.length - 1] || {}).key || null;
  } catch (e) {}
  document.body.classList.remove('loading');
  if (!/^#team\//.test(startHash)) render();
  const tm = startHash.match(/^#team\/(\d+)/);
  if (tm) openTeam(tm[1], true);
  const m = startHash.match(/^#game\/(\d+)/);
  if (m) { try { history.replaceState(null, '', startHash); } catch (e) {} openGame(m[1], true); }
}
boot();
})();
