<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scoreline">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: iOS 6–era app shell. Horizontally paged glossy panels, footer with settings gear, page dots and a headline ticker. */
:root{
  --navy-0:#06101f;      /* app ground */
  --navy-1:#0d2347;      /* panel base */
  --navy-2:#173a70;      /* panel highlight */
  --navy-3:#2a5aa3;      /* tile highlight */
  --steel:#9fb6d8;       /* muted text */
  --ink:#ffffff;
  --amber:#ffb21f;       /* brand accent / live */
  --live:#ff4b3a;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
/* Per-sport panel themes (swap hex values to match the scoreboard pages) */
.page{--p-hi:#173a70;--p-base:#0d2347;--p-deep:#0a1c3b;--p-line:rgba(160,195,255,.35);
  --t-hi:rgba(90,140,220,.55);--t-mid:rgba(30,70,140,.55);--t-lo:rgba(18,45,95,.65);--t-line:rgba(190,215,255,.55);--t-sub:#c9d6ea;--b-hi:#3e6fbf;--b-lo:#1d4689}
/* Colors pulled from each scoreboard page's .bg-pattern gradient (0/16/34/55/78% stops) */
.th-red{--p-hi:#c42020;--p-base:#941414;--p-deep:#661010;--p-line:rgba(212,122,122,0.55);
  --t-hi:rgba(212,122,122,0.55);--t-mid:rgba(196,32,32,0.6);--t-lo:rgba(148,20,20,0.75);--t-line:rgba(238,220,220,0.6);--t-sub:#eedcdc;--b-hi:#c42020;--b-lo:#661010}
.th-nfl{--p-hi:#1f7a3d;--p-base:#155c2e;--p-deep:#0a3d1f;--p-line:rgba(143,196,163,0.55);
  --t-hi:rgba(143,196,163,0.55);--t-mid:rgba(31,122,61,0.6);--t-lo:rgba(21,92,46,0.75);--t-line:rgba(223,233,226,0.6);--t-sub:#dfe9e2;--b-hi:#1f7a3d;--b-lo:#0a3d1f}
.th-mlb{--p-hi:#1f6cc4;--p-base:#145094;--p-deep:#0f3463;--p-line:rgba(126,170,212,0.55);
  --t-hi:rgba(126,170,212,0.55);--t-mid:rgba(31,108,196,0.6);--t-lo:rgba(20,80,148,0.75);--t-line:rgba(221,229,238,0.6);--t-sub:#dde5ee;--b-hi:#1f6cc4;--b-lo:#0f3463}
.th-nba{--p-hi:#d66a00;--p-base:#a34d00;--p-deep:#6b3300;--p-line:rgba(232,163,102,0.55);
  --t-hi:rgba(232,163,102,0.55);--t-mid:rgba(214,106,0,0.6);--t-lo:rgba(163,77,0,0.75);--t-line:rgba(240,221,201,0.6);--t-sub:#f0ddc9;--b-hi:#d66a00;--b-lo:#6b3300}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0a0a0a;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
.app{position:relative;height:100%;display:flex;flex-direction:column;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),
    radial-gradient(120% 70% at 50% 0%,#3a3a3a 0%,#1a1a1a 55%,#0a0a0a 100%);
  padding-top:env(safe-area-inset-top,0px)}


/* pager */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:10px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));display:flex;max-width:100vw}
.panel{flex:1;min-width:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,var(--p-hi) 0%,var(--p-base) 120px,var(--p-deep) 100%);
  border:1px solid var(--p-line);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.panel-head{position:relative;flex:none;text-align:center;padding:12px 10px 10px}
.panel-head::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.05));pointer-events:none}
.panel-head::after{content:attr(data-watermark);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:italic 900 64px/1 var(--font);letter-spacing:-2px;color:rgba(255,255,255,.06);pointer-events:none;white-space:nowrap;overflow:hidden}
.panel-head h1{position:relative;margin:0;font-size:33px;font-weight:700;letter-spacing:-.5px;text-shadow:0 -1px 0 rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.35)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 10px;overscroll-behavior:contain}
.section{margin:8px -8px 6px;padding:5px 12px;font-size:14px;font-weight:700;
  background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.2));border-top:1px solid rgba(0,0,0,.5);border-bottom:1px solid rgba(255,255,255,.12);
  text-shadow:0 -1px 0 #000;display:flex;justify-content:space-between;align-items:baseline}
.section small{font-size:11px;font-weight:600;color:var(--steel)}

/* game tile */
.tile{display:block;color:inherit;text-decoration:none;margin:8px 4px;border-radius:7px;overflow:hidden;
  background:linear-gradient(180deg,var(--t-hi),var(--t-mid) 40%,var(--t-lo));
  border:1px solid var(--t-line);box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.tile:active{filter:brightness(1.25)}
.t-top{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 2px;font-size:12px;font-weight:700;color:var(--t-sub);text-transform:uppercase;letter-spacing:.2px}
.t-top .rt{display:flex;gap:8px;align-items:center;white-space:nowrap}
.t-top .tv{color:#fff}
.t-top .lg{color:var(--amber)}
.t-top.live{color:#fff}
.t-top.live .st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;box-shadow:0 0 6px var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 10px;align-items:center;column-gap:5px;padding:3px 0 3px 8px;font-size:17px;font-weight:700;text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.row img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.row .rk{font-size:12px;font-weight:600;color:var(--t-sub);margin-right:4px}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc.rec{font-size:14px;font-weight:600;color:var(--t-sub)}
.row .sc{font-variant-numeric:tabular-nums;text-align:right;min-width:24px}
.row.loser{color:var(--t-sub)}
.row .win{width:0;height:0;border-style:solid;border-width:6px 8px 6px 0;border-color:transparent #fff transparent transparent;justify-self:end;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.blurb{padding:6px 8px 7px;font-size:13px;line-height:1.3;color:#eef3fb;background:rgba(0,0,0,.28);border-top:1px solid rgba(0,0,0,.4)}
.blurb:empty{display:none}
.badge{width:28px;height:28px;font-size:9px!important;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;letter-spacing:-.2px;color:#fff;border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.6);overflow:hidden}
.notice{margin:8px 4px 0;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:600;color:#1a1200;background:linear-gradient(#ffd06a,#ffb21f);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

.more{display:block;margin:12px 4px 4px;padding:10px;text-align:center;border-radius:7px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;
  background:linear-gradient(var(--b-hi),var(--b-lo));border:1px solid var(--p-deep);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 rgba(255,255,255,.15);text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.empty{margin:20px 6px;text-align:center;color:var(--steel);font-size:14px;line-height:1.4}
.empty button{margin-top:8px}
.skel{height:92px;margin:8px 4px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* footer */
.foot{flex:none;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(#20262e,#0d1015)}
.dotsbar{display:flex;align-items:center;height:30px;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));background:#0a0a0a}
.gear{width:28px;height:28px;border:0;background:none;padding:2px;cursor:pointer}
.gear svg{width:22px;height:22px;fill:#8c95a3;filter:drop-shadow(0 -1px 0 #000)}
.dots{flex:1;display:flex;justify-content:center;gap:9px;margin-right:28px}
.dots button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:#4a5566;cursor:pointer}
.dots button.on{background:#fff}
.ticker{display:flex;align-items:stretch;height:26px;border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.ticker .lab{flex:none;width:56px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-style:italic;color:#fff;background:linear-gradient(#5a5a5a,#1c1c1c 55%,#000);border-right:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 -1px 0 #000}
.ticker .rail{flex:1;min-width:0;overflow:hidden;position:relative;background:linear-gradient(#1a1a1a,#000);color:#fff;font-size:14px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.ticker .txt{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.brand{flex:none;display:flex;align-items:center;padding:0 10px;font:italic 900 15px/1 var(--font);letter-spacing:-.5px;color:#fff;
  background:linear-gradient(#e8382b,#b3100a 55%,#8f0c07);border-left:1px solid #000;text-shadow:0 -1px 0 rgba(0,0,0,.5);clip-path:polygon(10px 0,100% 0,100% 100%,0 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.brand span{color:#fff}

/* settings sheet */
.sheet{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet .box{width:100%;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(#5d6a7d,#2f3947);border-top:1px solid #8a97aa;box-shadow:0 -4px 16px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:17px;text-align:center;text-shadow:0 -1px 0 #000}
.sheet p{margin:0;font-size:13px;line-height:1.4;color:#dde3ec;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.btn{display:block;width:100%;padding:11px;border-radius:9px;font:700 16px var(--font);color:#fff;cursor:pointer;
  background:linear-gradient(#5a8be0,#2459b8 50%,#1a4aa3);border:1px solid #0d2a62;box-shadow:inset 0 1px 0 rgba(255,255,255,.45);text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.btn.dark{background:linear-gradient(#4c5563,#262c35 50%,#1c2129);border-color:#0b0d11}
.btn:focus-visible,.dots button:focus-visible,.gear:focus-visible,.tile:focus-visible,.more:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pager{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="pager" id="pager" aria-label="Score pages"></main>

  <footer class="foot">
    <div class="dotsbar">
      <button class="gear" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
      <div class="dots" id="dots" role="tablist"></div>
    </div>
    <div class="ticker">
      <div class="lab" id="tickLab">TOP</div>
      <div class="rail"><div class="txt" id="tickTxt">Loading headlines…</div></div>
      <div class="brand">SCORE<span>LINE</span></div>
    </div>
  </footer>

  <div class="sheet" id="sheet" hidden>
    <div class="box">
      <h2>Settings</h2>
      <p id="updated">Not updated yet.</p>
      <p>Scores refresh every 30 seconds while games are live and every 2 minutes otherwise. To install, open this page in Safari, tap Share, then Add to Home Screen.</p>
      <button class="btn" id="refreshBtn">Refresh Now</button>
      <button class="btn dark" id="closeBtn">Done</button>
    </div>
  </div>
</div>

<script>
/* ===== Config: point these at your existing scoreboard pages ===== */
const SPORTS = [
  { key:'cfb', theme:'red', name:'College Football', tag:'NCAAF', mark:'NCAAF', path:'football/college-football',          params:'groups=80&limit=300', college:true,  page:'ncaafb-scoreboard.html' },
  { key:'nfl', theme:'nfl', name:'NFL',              tag:'NFL',   mark:'NFL',   path:'football/nfl',                       params:'',                    college:false, page:'nfl-scoreboard.html' },
  { key:'mlb', theme:'mlb', name:'MLB',              tag:'MLB',   mark:'MLB',   path:'baseball/mlb',                       params:'',                    college:false, page:'mlb-scoreboard.html' },
  { key:'ncb', theme:'red', name:'College Hoops',    tag:'NCAAB', mark:'NCAAB', path:'basketball/mens-college-basketball', params:'groups=50&limit=300', college:true,  page:'ncaabb-scoreboard.html' },
  { key:'nba', theme:'nba', name:'NBA',              tag:'NBA',   mark:'NBA',   path:'basketball/nba',                     params:'',                    college:false, page:'nba-scoreboard.html' },
];
// Where tapping a game goes. Default: the game's own page from the feed.
const gameLink = (sport, ev) => (ev.links && ev.links[0] && ev.links[0].href) || '#';
const API = 'https://site.api.espn.com/apis/site/v2/sports/';
const TOP_COUNT = 12;

/* ===== Sample games: shown only when a live feed can't be reached (e.g. in a preview) ===== */
const H = 36e5;
function mk(id, st, detail, hrs, away, home, extra = {}){
  const team = ([name, abbr, color, score, rank, rec], side) => ({
    homeAway: side, score: String(score ?? ''), winner: st === 'post' && extra.win === side,
    team: { location: name, displayName: name, shortDisplayName: name, abbreviation: abbr, color },
    curatedRank: { current: rank || 99 }, records: rec ? [{ summary: rec }] : [],
  });
  return { id, date: new Date(Date.now() + hrs * H).toISOString(), links: [], season: { type: extra.post ? 3 : 2 },
    competitions: [{ status: { type: { state: st, shortDetail: detail, name: st === 'pre' ? 'STATUS_SCHEDULED' : 'X' } },
      competitors: [team(away, 'away'), team(home, 'home')],
      headlines: extra.head ? [{ shortLinkText: extra.head }] : [],
      situation: extra.play ? { lastPlay: { text: extra.play } } : null,
      broadcasts: extra.tv ? [{ names: [extra.tv] }] : [], venue: extra.venue ? { fullName: extra.venue } : null,
      notes: extra.note ? [{ headline: extra.note }] : [] }] };
}
const SAMPLE = {
  cfb: [
    mk('c1','post','Final',-20,['Penn State','PSU','1c3a6e',24,null,'6-1'],['Ohio State','OSU','bb0000',38,2,'7-0'],{win:'home',head:'Sample recap: Ohio State pulls away in the fourth quarter at home.'}),
    mk('c2','in','3rd 6:12',-1,['Georgia','UGA','ba0c2f',17,5,'6-1'],['Texas','TEX','bf5700',20,3,'6-1'],{play:'Sample play: 14-yard completion to the Georgia 41.'}),
    mk('c3','pre','',6,['Washington','UW','4b2e83',null,null,'5-2'],['Oregon','ORE','154733',null,4,'7-0'],{tv:'Sample TV',venue:'Autzen Stadium'}),
  ],
  nfl: [
    mk('n1','post','Final',-30,['Dallas','DAL','041e42',20],['Philadelphia','PHI','004c54',27],{win:'home',head:'Sample recap: Philadelphia holds on late to win the division matchup.'}),
    mk('n2','pre','',36,['Buffalo','BUF','00338d',null,null,'5-2'],['Kansas City','KC','e31837',null,null,'6-1'],{tv:'Sample TV',venue:'Arrowhead Stadium'}),
  ],
  mlb: [
    mk('m1','post','Final',-26,['Los Angeles','LAD','005a9c',5],['New York','NYY','132448',3],{win:'away',post:true,head:'Sample recap: Los Angeles takes the series opener on the road.'}),
    mk('m2','pre','',18,['Los Angeles','LAD','005a9c'],['New York','NYY','132448'],{post:true,note:'Sample: Game 2',venue:'Yankee Stadium'}),
  ],
  ncb: [
    mk('b1','pre','',300,['Kansas','KU','0051ba',null,7],['Duke','DUKE','003087',null,3],{note:'Sample: season opener',venue:'Neutral site'}),
  ],
  nba: [
    mk('a1','in','4th 2:48',-0.5,['Golden State','GSW','1d428a',104],['Los Angeles','LAL','552583',101],{play:'Sample play: corner three ties the game, then a go-ahead layup.'}),
    mk('a2','post','Final',-22,['New York','NYK','006bb6',109],['Boston','BOS','007a33',116],{win:'home',head:'Sample recap: Boston pulls away with a 12-2 run in the fourth.'}),
  ],
};
const SAMPLE_NEWS = SPORTS.map(s => ({ tag: s.tag, text: `Sample headline for ${s.name}. Live headlines appear when this page runs on your own site.` }));

/* ===== State ===== */
const state = { data:{}, errors:{}, sample:{}, updated:null, news:[] };
const pager = document.getElementById('pager');
const dotsEl = document.getElementById('dots');
const pages = [{ key:'top', name:'The Lead', mark:'LEAD', theme:'red' }, ...SPORTS];

if (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');

/* ===== Build shell ===== */
pages.forEach((p, i) => {
  const sec = document.createElement('section');
  sec.className = 'page th-' + p.theme; sec.id = 'p-' + p.key; sec.setAttribute('aria-label', p.name);
  sec.innerHTML = `<div class="panel"><div class="panel-head" data-watermark="${p.mark}"><h1>${p.name}</h1></div>
    <div class="scroll" id="s-${p.key}"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>`;
  pager.appendChild(sec);
  const d = document.createElement('button');
  d.setAttribute('role','tab'); d.setAttribute('aria-label', p.name);
  d.onclick = () => pager.scrollTo({ left: i * pager.clientWidth, behavior: 'smooth' });
  dotsEl.appendChild(d);
});
let current = 0;
function syncDots(){
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  current = Math.max(0, Math.min(pages.length - 1, i));
  [...dotsEl.children].forEach((d, j) => { d.classList.toggle('on', j === current); d.setAttribute('aria-selected', j === current); });
  try { localStorage.setItem('scoreline.page', current); } catch(e){}
}
pager.addEventListener('scroll', () => requestAnimationFrame(syncDots), { passive:true });
addEventListener('resize', () => pager.scrollLeft = current * pager.clientWidth);
try { const saved = +localStorage.getItem('scoreline.page'); if (saved > 0) requestAnimationFrame(() => { pager.scrollLeft = saved * pager.clientWidth; syncDots(); }); } catch(e){}
syncDots();

/* ===== Helpers ===== */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
const hm = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });

// Logo built for dark backgrounds (e.g. a white "A" for Alabama). Uses the feed's own dark entry when it has one,
// otherwise the CDN's 500-dark folder. If that image is missing, logoFallback() swaps in the standard logo.
function darkVariant(team){
  const tagged = (team.logos || []).find(l => (l.rel || []).includes('dark'));
  if (tagged) return tagged.href;
  const base = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
  return /\/500\//.test(base) ? base.replace('/500/', '/500-dark/') : base;
}
function logoFallback(img){
  if (img.dataset.std && img.src !== img.dataset.std) { const std = img.dataset.std; img.dataset.std = ''; img.src = std; }
  else img.style.visibility = 'hidden';
}
function normalize(sport, ev){
  const c = ev.competitions[0];
  const st = c.status.type;
  const date = new Date(ev.date);
  const teams = [...c.competitors].sort((a, b) => (a.homeAway === 'away' ? -1 : 1) - (b.homeAway === 'away' ? -1 : 1)).map(t => {
    const r = t.curatedRank && t.curatedRank.current;
    return {
      name: sport.college ? (t.team.location || t.team.shortDisplayName) : t.team.displayName,
      abbr: t.team.abbreviation || (t.team.shortDisplayName || '').slice(0,3).toUpperCase(), color: t.team.color || '2a5aa3',
      logo: t.team.logo || (t.team.logos && t.team.logos[0] && t.team.logos[0].href) || '',
      darkLogo: darkVariant(t.team),
      rank: r && r <= 25 ? r : null,
      score: t.score, winner: !!t.winner,
      record: t.records && t.records[0] && t.records[0].summary,
    };
  });
  let label, blurb = '';
  if (st.state === 'post') {
    label = `${md(date)}: ${st.shortDetail.replace(/^Final/i,'FINAL')}`;
    blurb = (c.headlines && c.headlines[0] && (c.headlines[0].shortLinkText || c.headlines[0].description)) || '';
  } else if (st.state === 'in') {
    label = st.shortDetail;
    blurb = (c.situation && c.situation.lastPlay && c.situation.lastPlay.text) || (c.situation && c.situation.downDistanceText) || '';
  } else {
    label = st.name === 'STATUS_SCHEDULED' ? `${md(date)}: ${hm(date)}` : `${md(date)}: ${st.shortDetail}`;
    const tv = c.broadcasts && c.broadcasts[0] && c.broadcasts[0].names && c.broadcasts[0].names.join('/');
    const venue = c.venue && c.venue.fullName;
    blurb = venue || '';
    if (c.notes && c.notes[0] && c.notes[0].headline) blurb = c.notes[0].headline + (blurb ? ' · ' + blurb : '');
  }
  if (!blurb && c.notes && c.notes[0]) blurb = c.notes[0].headline;
  const scores = teams.map(t => +t.score || 0);
  const bc = c.broadcasts && c.broadcasts[0] && c.broadcasts[0].names && c.broadcasts[0].names.join('/');
  const tv = st.state === 'post' ? '' : (bc || (c.geoBroadcasts && c.geoBroadcasts[0] && c.geoBroadcasts[0].media && c.geoBroadcasts[0].media.shortName) || '');
  return { id: ev.id, sport, state: st.state, date, label, blurb, tv, teams, link: gameLink(sport, ev),
    margin: Math.abs(scores[0] - (scores[1] || 0)), post: ev.season && ev.season.type === 3 };
}

function interest(g){
  let s = 0;
  if (g.state === 'in') s += 60;
  if (g.state === 'post') s += 25;
  if (g.post) s += 45;
  g.teams.forEach(t => { if (t.rank) s += 26 - t.rank; });
  if (g.teams.every(t => t.rank)) s += 20;
  if (g.state !== 'pre' && g.margin <= 7) s += 12;
  if (!g.sport.college) s += 8;
  const hrs = Math.abs(Date.now() - g.date) / 36e5;
  s -= Math.min(hrs, 72) * 0.6;
  return s;
}

function tileHTML(g, showLeague){
  const live = g.state === 'in';
  const rows = g.teams.map(t => {
    const showScore = g.state !== 'pre';
    const loser = g.state === 'post' && !t.winner && g.teams.some(x => x.winner);
    return `<div class="row${loser ? ' loser' : ''}">
      ${t.logo ? `<img src="${esc(t.darkLogo || t.logo)}" data-std="${esc(t.logo)}" alt="" loading="lazy" onerror="logoFallback(this)">` : `<span class="badge" style="background:#${esc(t.color)}">${esc(t.abbr)}</span>`}
      <span class="nm">${t.rank ? `<span class="rk">${t.rank}</span>` : ''}${esc(t.name)}</span>
      ${showScore ? `<span class="sc">${esc(t.score)}</span>` : `<span class="sc rec">${esc(t.record || '')}</span>`}
      ${t.winner && g.state === 'post' ? '<i class="win"></i>' : '<span></span>'}
    </div>`;
  }).join('');
  return `<a class="tile" href="${esc(g.link)}" target="_blank" rel="noopener">
    <div class="t-top${live ? ' live' : ''}"><span class="st">${esc(g.label)}</span><span class="rt">${g.tv ? `<span class="tv">${esc(g.tv)}</span>` : ''}${showLeague ? `<span class="lg">${g.sport.tag}</span>` : ''}</span></div>
    ${rows}<div class="blurb">${esc(g.blurb)}</div></a>`;
}

function grouped(games, showLeague){
  const order = [['in','Live Now'],['post','Last Results'],['pre','Upcoming']];
  return order.map(([k, title]) => {
    const list = games.filter(g => g.state === k);
    if (!list.length) return '';
    return `<div class="section">${title}<small>${list.length} ${list.length === 1 ? 'game' : 'games'}</small></div>` + list.map(g => tileHTML(g, showLeague)).join('');
  }).join('');
}

/* ===== Render ===== */
const NOTICE = '<div class="notice">Sample games. Live scores load when this page runs on your own site.</div>';
function renderSport(sport){
  const el = document.getElementById('s-' + sport.key);
  const games = state.data[sport.key];
  const more = sport.page ? `<a class="more" href="${esc(sport.page)}">Full ${esc(sport.name)} Scoreboard ›</a>` : '';
  if (!games) {
    if (state.errors[sport.key]) el.innerHTML = `<div class="empty">Couldn't reach ${esc(sport.name)} scores. Check your connection and try again.<br><button class="btn" onclick="refresh()">Try Again</button></div>${more}`;
    return;
  }
  if (!games.length) { el.innerHTML = `<div class="empty">No ${esc(sport.name)} games on today's slate.</div>${more}`; return; }
  games.sort((a, b) => {
    if (a.state === 'post' && b.state === 'post') return b.date - a.date || interest(b) - interest(a);
    return a.date - b.date || interest(b) - interest(a);
  });
  el.innerHTML = (state.sample[sport.key] ? NOTICE : '') + grouped(games, false) + more;
}

function renderTop(){
  const el = document.getElementById('s-top');
  const all = SPORTS.flatMap(s => state.data[s.key] || []);
  if (!all.length) {
    if (SPORTS.every(s => state.errors[s.key])) el.innerHTML = `<div class="empty">Couldn't reach the score feeds. Check your connection and try again.<br><button class="btn" onclick="refresh()">Try Again</button></div>`;
    return;
  }
  const picks = [...all].sort((a, b) => interest(b) - interest(a)).slice(0, TOP_COUNT);
  picks.sort((a, b) => interest(b) - interest(a));
  el.innerHTML = (SPORTS.some(s => state.sample[s.key]) ? NOTICE : '') + grouped(picks, true);
}

/* ===== Data ===== */
async function loadSport(sport){
  try {
    const r = await fetch(API + sport.path + '/scoreboard' + (sport.params ? '?' + sport.params : ''), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    state.data[sport.key] = (j.events || []).map(ev => normalize(sport, ev));
    state.errors[sport.key] = false;
    state.sample[sport.key] = false;
  } catch (e) {
    if (SAMPLE[sport.key]) { state.data[sport.key] = SAMPLE[sport.key].map(ev => normalize(sport, ev)); state.sample[sport.key] = true; }
    else state.errors[sport.key] = true;
  }
  renderSport(sport);
}

async function refresh(){
  await Promise.all(SPORTS.map(loadSport));
  renderTop();
  state.updated = new Date();
  document.getElementById('updated').textContent = 'Last updated ' + hm(state.updated) + '.';
  schedule();
}
let timer;
function schedule(){
  clearTimeout(timer);
  const anyLive = SPORTS.some(s => (state.data[s.key] || []).some(g => g.state === 'in'));
  timer = setTimeout(refresh, anyLive ? 30000 : 120000);
}

/* ===== Ticker ===== */
async function loadNews(){
  const res = await Promise.all(SPORTS.map(async s => {
    try {
      const r = await fetch(API + s.path + '/news?limit=5');
      const j = await r.json();
      return (j.articles || []).map(a => ({ tag: s.tag, text: a.headline })).filter(a => a.text);
    } catch (e) { return []; }
  }));
  const mixed = [];
  for (let i = 0; i < 5; i++) res.forEach(list => list[i] && mixed.push(list[i]));
  state.news = mixed.length ? mixed : SAMPLE_NEWS;
}
const CRAWL_SPEED = 50;   // pixels per second while crawling
const SLIDE_MS = 380;      // rise-in and lift-out duration
const HOLD_START = 1600;   // pause after a headline rises in
const HOLD_END = 1300;      // pause once the end of the headline is showing
const PAD = 10;
let tickIdx = 0, crawl = null;
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
function nextTick(){
  const lab = document.getElementById('tickLab'), txt = document.getElementById('tickTxt');
  if (!state.news.length) { setTimeout(nextTick, 3000); return; }
  const item = state.news[tickIdx++ % state.news.length];
  lab.textContent = item.tag; txt.textContent = item.text;
  const railW = txt.parentElement.clientWidth, h = txt.parentElement.clientHeight;
  crawl = { phase:'in', t0:null, x: PAD, y: h, h, endX: Math.min(PAD, railW - txt.scrollWidth - PAD), last:null };
}
function crawlFrame(ts){
  const txt = document.getElementById('tickTxt');
  const c = crawl;
  if (c) {
    if (c.t0 == null) c.t0 = ts;
    const el = ts - c.t0, dt = c.last == null ? 0 : Math.min(ts - c.last, 100);
    c.last = ts;
    if (c.phase === 'in') { const k = Math.min(el / SLIDE_MS, 1); c.y = c.h * (1 - ease(k)); if (k === 1) { c.phase = 'hold'; c.t0 = ts; } }
    else if (c.phase === 'hold') { if (el >= HOLD_START) { c.phase = 'crawl'; c.t0 = ts; } }
    else if (c.phase === 'crawl') { c.x = Math.max(c.endX, c.x - CRAWL_SPEED * dt / 1000); if (c.x <= c.endX) { c.phase = 'hold2'; c.t0 = ts; } }
    else if (c.phase === 'hold2') { if (el >= HOLD_END) { c.phase = 'out'; c.t0 = ts; } }
    else if (c.phase === 'out') { const k = Math.min(el / SLIDE_MS, 1); c.y = -c.h * ease(k); if (k === 1) { crawl = null; nextTick(); } }
    txt.style.transform = `translate3d(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px,0)`;
  }
  requestAnimationFrame(crawlFrame);
}
requestAnimationFrame(crawlFrame);

/* ===== Settings, icon ===== */

const sheet = document.getElementById('sheet');
document.getElementById('gear').onclick = () => { sheet.hidden = false; document.getElementById('closeBtn').focus(); };
document.getElementById('closeBtn').onclick = () => sheet.hidden = true;
sheet.onclick = e => { if (e.target === sheet) sheet.hidden = true; };
document.getElementById('refreshBtn').onclick = () => { sheet.hidden = true; refresh(); loadNews(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

refresh();
loadNews().then(nextTick);
</script>
