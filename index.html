<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scoreline">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
/* Layout: iOS 6–era app shell. Horizontally paged glossy panels, footer with settings gear, page dots and a headline ticker. */
:root{
  --navy-0:#06101f;      /* app ground */
  --navy-1:#0d2347;      /* panel base */
  --navy-2:#173a70;      /* panel highlight */
  --navy-3:#2a5aa3;      /* tile highlight */
  --steel:#9fb6d8;       /* muted text */
  --ink:#ffffff;
  --amber:#ffb21f;       /* brand accent / live */
  --live:#ff4b3a;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
/* Per-sport panel themes (swap hex values to match the scoreboard pages) */
.page{--p-hi:#173a70;--p-base:#0d2347;--p-deep:#0a1c3b;--p-line:rgba(160,195,255,.35);
  --t-hi:rgba(90,140,220,.55);--t-mid:rgba(30,70,140,.55);--t-lo:rgba(18,45,95,.65);--t-line:rgba(190,215,255,.55);--t-sub:#c9d6ea;--b-hi:#3e6fbf;--b-lo:#1d4689}
/* Colors pulled from each scoreboard page's .bg-pattern gradient (0/16/34/55/78% stops) */
.th-red{--p-hi:#c42020;--p-base:#941414;--p-deep:#661010;--p-line:rgba(212,122,122,0.55);
  --t-hi:rgba(212,122,122,0.55);--t-mid:rgba(196,32,32,0.6);--t-lo:rgba(148,20,20,0.75);--t-line:rgba(238,220,220,0.6);--t-sub:#eedcdc;--b-hi:#c42020;--b-lo:#661010}
.th-nfl{--p-hi:#1f7a3d;--p-base:#155c2e;--p-deep:#0a3d1f;--p-line:rgba(143,196,163,0.55);
  --t-hi:rgba(143,196,163,0.55);--t-mid:rgba(31,122,61,0.6);--t-lo:rgba(21,92,46,0.75);--t-line:rgba(223,233,226,0.6);--t-sub:#dfe9e2;--b-hi:#1f7a3d;--b-lo:#0a3d1f}
.th-mlb{--p-hi:#1f6cc4;--p-base:#145094;--p-deep:#0f3463;--p-line:rgba(126,170,212,0.55);
  --t-hi:rgba(126,170,212,0.55);--t-mid:rgba(31,108,196,0.6);--t-lo:rgba(20,80,148,0.75);--t-line:rgba(221,229,238,0.6);--t-sub:#dde5ee;--b-hi:#1f6cc4;--b-lo:#0f3463}
.th-nba{--p-hi:#d66a00;--p-base:#a34d00;--p-deep:#6b3300;--p-line:rgba(232,163,102,0.55);
  --t-hi:rgba(232,163,102,0.55);--t-mid:rgba(214,106,0,0.6);--t-lo:rgba(163,77,0,0.75);--t-line:rgba(240,221,201,0.6);--t-sub:#f0ddc9;--b-hi:#d66a00;--b-lo:#6b3300}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0a0a0a;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
.app{position:relative;height:100%;display:flex;flex-direction:column;
  background:#0a0a0a;
  padding-top:env(safe-area-inset-top,0px)}


/* pager */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));display:flex;max-width:100vw}
.panel{flex:1;min-width:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;border-radius:0;overflow:hidden;
  background:linear-gradient(180deg,var(--p-hi) 0%,var(--p-base) 120px,var(--p-deep) 100%);
  border:1px solid var(--p-line);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.6)}
.fbar{position:relative;flex:none;z-index:5}
.fmenu{position:absolute;left:8px;right:8px;top:100%;max-height:min(60vh,360px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(var(--p-base),var(--p-deep));border:1px solid var(--p-line);box-shadow:0 8px 20px rgba(0,0,0,.7)}
.fmenu button{display:block;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid rgba(0,0,0,.35);box-shadow:0 1px 0 rgba(255,255,255,.08);
  background:none;color:#fff;font:600 15px var(--font);cursor:pointer;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.fmenu button.on{background:rgba(0,0,0,.28);font-weight:800}
.fmenu button.on::after{content:"✓";float:right}
.news{display:flex;gap:10px;margin:8px 4px;padding:8px;color:#fff;text-decoration:none;
  background:linear-gradient(180deg,var(--t-hi),var(--t-mid) 40%,var(--t-lo));border:1px solid var(--t-line);box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.news img{flex:none;width:84px;height:56px;object-fit:cover;border:1px solid rgba(255,255,255,.5)}
.news div{min-width:0;display:flex;flex-direction:column;gap:2px;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.news b{font-size:14px;line-height:1.25}
.news span{font-size:12px;line-height:1.3;color:var(--t-sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news small{font-size:11px;font-weight:700;color:var(--t-sub)}
.news:active{filter:brightness(1.2)}
.st-page{padding:10px 4px 14px}
.hd-tab:focus-visible,.seg button:focus-visible,.bell:focus-visible,.fsel:focus-visible,.fmenu button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 10px;overscroll-behavior:contain}
.section{margin:8px -8px 6px;padding:5px 12px;font-size:13px;font-weight:800;letter-spacing:.6px;
  background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.2));border-top:1px solid rgba(0,0,0,.5);border-bottom:1px solid rgba(255,255,255,.12);
  text-shadow:0 -1px 0 #000;display:flex;justify-content:space-between;align-items:baseline}
.section small{font-size:11px;font-weight:600;color:var(--steel)}

/* game tile */
.tile{display:block;color:inherit;text-decoration:none;margin:8px 4px;border-radius:0;overflow:hidden;
  background:linear-gradient(180deg,var(--t-hi),var(--t-mid) 40%,var(--t-lo));
  border:1px solid var(--t-line);box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.tile:active{filter:brightness(1.25)}
.t-top{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 2px;font-size:12px;font-weight:700;color:var(--t-sub);text-transform:uppercase;letter-spacing:.2px}
.t-top .rt{display:flex;gap:8px;align-items:center;white-space:nowrap}
.t-top .tv{color:#fff}
.t-top .lg{color:var(--amber)}
.t-top.live{color:#fff}
@keyframes pulse{50%{opacity:.35}}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 10px;align-items:center;column-gap:5px;padding:3px 0 3px 8px;font-size:17px;font-weight:700;text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.row img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.row .poss{width:14px;height:9px;margin-left:5px;vertical-align:1px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.row .rk{font-size:12px;font-weight:600;color:var(--t-sub);margin-right:4px}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc.rec{font-size:14px;font-weight:600;color:var(--t-sub)}
.row .sc{font-variant-numeric:tabular-nums;text-align:right;min-width:24px}
.row.loser{color:var(--t-sub)}
.row .win{width:0;height:0;border-style:solid;border-width:6px 8px 6px 0;border-color:transparent #fff transparent transparent;justify-self:end;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.blurb{padding:5px 8px 7px;font-size:13px;line-height:1.3;color:#fff;border-top:1px solid rgba(255,255,255,.18)}
.blurb:empty{display:none}
.badge{width:28px;height:28px;font-size:9px!important;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;letter-spacing:-.2px;color:#fff;border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.6);overflow:hidden}
.notice{margin:8px 4px 0;padding:6px 8px;border-radius:0;font-size:12px;font-weight:600;color:#1a1200;background:linear-gradient(#ffd06a,#ffb21f);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

.more{display:block;margin:12px 4px 4px;padding:10px;text-align:center;border-radius:0;color:#fff;text-decoration:none;font-weight:700;font-size:14px;
  background:linear-gradient(var(--b-hi),var(--b-lo));border:1px solid var(--p-deep);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 rgba(255,255,255,.15);text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.empty{margin:20px 6px;text-align:center;color:var(--steel);font-size:14px;line-height:1.4}
.empty button{margin-top:8px}
.skel{height:92px;margin:8px 4px;border-radius:0;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* footer */
.foot{flex:none;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(#20262e,#0d1015)}
.dotsbar{display:flex;align-items:center;height:30px;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));background:#0a0a0a}
.gear{width:28px;height:28px;border:0;background:none;padding:2px;cursor:pointer}
.gear svg{width:22px;height:22px;fill:#8c95a3;filter:drop-shadow(0 -1px 0 #000)}
.dots{flex:1;display:flex;justify-content:center;align-items:center;gap:9px;margin-right:28px}
.dots button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:#4a5566;cursor:pointer}
.dots button.on{width:15px;height:15px;margin:-4px 0;background:radial-gradient(circle,#fff 0 28%,#6b7380 30% 52%,#e9ecf1 54%);box-shadow:0 0 0 1px #000}
.ticker{display:flex;align-items:stretch;height:26px;border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.ticker .lab{flex:none;width:56px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-style:italic;color:#fff;background:linear-gradient(#5a5a5a,#1c1c1c 55%,#000);border-right:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 -1px 0 #000}
.ticker .rail{flex:1;min-width:0;overflow:hidden;position:relative;background:linear-gradient(#1a1a1a,#000);color:#fff;font-size:14px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.ticker .txt{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.brand{flex:none;display:flex;align-items:center;padding:0 10px;font:italic 900 15px/1 var(--font);letter-spacing:-.5px;color:#fff;
  background:linear-gradient(#e8382b,#b3100a 55%,#8f0c07);border-left:1px solid #000;text-shadow:0 -1px 0 rgba(0,0,0,.5);clip-path:polygon(10px 0,100% 0,100% 100%,0 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.brand span{color:#fff}

/* header: inner frame, sport line art, bottom rule that steps down into the slanted menu tab */
.panel-head{position:relative;flex:none;text-align:center;padding:13px 54px 21px;}
.hd-art{position:absolute;top:5px;left:5px;right:5px;bottom:6px;background-repeat:no-repeat;background-position:right center;background-size:auto 100%;pointer-events:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 17px),calc(100% - 38px) calc(100% - 17px),calc(100% - 51px) 100%,0 100%)}
.hd-art[data-art="hoops"]{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27400%27%20height%3D%2780%27%20viewBox%3D%270%200%20400%2080%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%27.1%27%20stroke-width%3D%271.2%27%3E%3Ccircle%20cx%3D%27330%27%20cy%3D%2740%27%20r%3D%2734%27/%3E%3Ccircle%20cx%3D%27330%27%20cy%3D%2740%27%20r%3D%279%27/%3E%3Cpath%20d%3D%27M0%2018h120l26%2036H0M146%2054a40%2040%200%200%200%200-36%27/%3E%3Cpath%20d%3D%27M60%208l14%2014m0-14L60%2022%27%20/%3E%3C/svg%3E")}
.hd-art[data-art="football"]{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27400%27%20height%3D%2780%27%20viewBox%3D%270%200%20400%2080%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%27.1%27%20stroke-width%3D%271.2%27%3E%3Cpath%20d%3D%27M40%200v80M100%200v80M160%200v80M240%200v80M300%200v80M360%200v80%27/%3E%3Cpath%20d%3D%27M70%2036v8M130%2036v8M270%2036v8M330%2036v8%27/%3E%3Cpath%20d%3D%27M200%200v80%27%20stroke-opacity%3D%27.24%27/%3E%3C/svg%3E")}
.hd-art[data-art="baseball"]{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27400%27%20height%3D%2780%27%20viewBox%3D%270%200%20400%2080%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%27.1%27%20stroke-width%3D%271.2%27%3E%3Cpath%20d%3D%27M330%2070l-40-40%2040-40%2040%2040z%27/%3E%3Ccircle%20cx%3D%27330%27%20cy%3D%2730%27%20r%3D%276%27/%3E%3Cpath%20d%3D%27M0%2070q120-90%20260-40%27/%3E%3Cpath%20d%3D%27M20%2010h60%27/%3E%3C/svg%3E")}
.hd-art[data-art="lead"]{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27400%27%20height%3D%2780%27%20viewBox%3D%270%200%20400%2080%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%27.1%27%20stroke-width%3D%271.2%27%3E%3Ccircle%20cx%3D%27340%27%20cy%3D%2740%27%20r%3D%2742%27/%3E%3Cpath%20d%3D%27M0%2060q100-60%20220-20t180-20%27/%3E%3Cpath%20d%3D%27M20%2015l12%2012m0-12L20%2027%27/%3E%3C/svg%3E")}
.panel-head::before{content:"";position:absolute;inset:0 0 48% 0;background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.05));pointer-events:none}
.panel-head::after{content:"";position:absolute;inset:4px 4px 5px 4px;border:1px solid rgba(255,255,255,.3);border-bottom:0;pointer-events:none}
.panel-head.has-tab::after{border-right:0}
.hd-rr{position:absolute;top:4px;right:4px;width:1px;bottom:22px;background:rgba(255,255,255,.3)}
.hd-rule{position:absolute;left:4px;right:4px;bottom:5px;height:1px;background:rgba(255,255,255,.3)}
.panel-head.has-tab .hd-rule{right:56px}
.panel-head h1{position:relative;margin:0;font-size:26px;font-weight:700;letter-spacing:-.3px;text-shadow:0 -1px 0 rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.45)}
.hd-tab{position:absolute;right:4px;bottom:5px;width:52px;height:18px;padding:0;border:0;background:none;cursor:pointer}
.hd-tab::before{content:"";position:absolute;inset:0 0 -1px 0;clip-path:polygon(13px 0,100% 0,100% 100%,0 100%);background:color-mix(in srgb,var(--p-hi) 50%,var(--p-base));background:linear-gradient(var(--p-hi),var(--p-base)) 0 -38px/100% 120px}
.gm-venue div+div{margin-top:3px}
.hd-tab svg{position:relative;display:block;width:52px;height:18px;overflow:visible}
.hd-tab .edge{fill:none;stroke:rgba(255,255,255,.3);stroke-width:1}
.hd-tab .tri{fill:#fff;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.35));transform-origin:36px 10px;transition:transform .2s}
.hd-tab.open .tri{transform:rotate(180deg)}
/* menu row on its own darker band, like the date strips */
.tabbar{flex:none;display:flex;gap:6px;align-items:stretch;padding:6px 6px 6px;background:linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,.24));border-bottom:1px solid rgba(0,0,0,.35);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.seg{flex:1;display:flex;border:1px solid rgba(0,0,0,.6);border-radius:8px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.14)}
.seg button{flex:1;min-width:0;padding:0 2px;height:32px;border:0;border-left:1px solid rgba(0,0,0,.38);font:700 14.5px var(--font);color:#fff;cursor:pointer;text-shadow:0 -1px 0 rgba(0,0,0,.45);white-space:nowrap;
  background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,.14) 50%,rgba(255,255,255,.04) 51%,rgba(255,255,255,.1)),var(--p-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.seg button:first-child{border-left:0}
.seg button.on{background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.04) 50%,rgba(0,0,0,.1) 51%,rgba(0,0,0,.02)),var(--p-base);box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.bell{flex:none;width:40px;height:34px;padding:0;cursor:pointer;border-radius:5px;border:1px solid rgba(0,0,0,.5);
  background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.bell svg{width:21px;height:21px;fill:var(--t-sub);opacity:.75;transform:rotate(-14deg)}
/* filter strip */
.fsel{width:100%;display:flex;align-items:center;justify-content:space-between;height:31px;padding:0 9px 0 10px;cursor:pointer;border:0;color:#fff;font:700 15px var(--font);text-shadow:0 -1px 0 rgba(0,0,0,.45);
  background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.14) 50%,rgba(255,255,255,.08));border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(0,0,0,.45)}
.fsel i{display:flex;flex-direction:column;gap:3px}
.fsel i b{display:block;width:21px;height:3.5px;background:rgba(255,255,255,.55)}
/* compact game boxes (sport pages) */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px;row-gap:14px;padding:6px 4px 6px}
.tile.mini{margin:0;padding:0 0 4px;overflow:visible;border:1px solid rgba(255,255,255,.5);box-shadow:0 1px 3px rgba(0,0,0,.5);
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.13) 52%,rgba(255,255,255,.05) 52%,rgba(255,255,255,.03)),var(--t-mid)}
.tile.mini .t-top{padding:4px 6px 0;margin-bottom:4px;line-height:14px;font-size:12.5px;font-weight:700;letter-spacing:0;color:rgba(255,255,255,.55);text-shadow:none}
.tile.mini .t-top.live{color:#fff}
.mrow{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;column-gap:7px;height:31px;padding:0 9px 0 5px;font-size:18px;font-weight:700;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.mrow img,.mrow .badge{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.mrow .badge{font-size:8px!important}
.mrow .ab{display:flex;align-items:center;min-width:0;font-size:16px;line-height:1;white-space:nowrap;overflow:hidden}
.mrow .ab i{font-style:normal;font-size:13px;line-height:1;font-weight:400;color:var(--t-sub);margin-left:3px;text-shadow:none}
.mrow .ab .poss{flex:none;width:13px;height:8px;margin-left:4px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.mrow .sc{font-size:17px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.mrow .sc.rec{font-size:13px;line-height:1;font-weight:600;color:var(--t-sub)}

    if (wins.every(w => w != null)) {

function interest(g){
  let s = 0;
  if (g.state === 'in') s += 60;
  if (g.state === 'post') s += 25;
  if (g.post) s += 45;
  g.teams.forEach(t => { if (t.rank) s += 26 - t.rank; });
  if (g.teams.every(t => t.rank)) s += 20;
  if (g.state !== 'pre' && g.margin <= 7) s += 12;
  if (!g.sport.college) s += 8;
  const hrs = Math.abs(Date.now() - g.date) / 36e5;
  s -= Math.min(hrs, 72) * 0.6;
  return s;
}

// Day strips: YESTERDAY / TODAY / TOMORROW (other dates by name). Live games always count as today.
const dayKey = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
function dayLabel(k){
  const diff = Math.round((k - dayKey(Date.now())) / 864e5);
  if (diff === 0) return 'TODAY';
  if (diff === 1) return 'TOMORROW';
  if (diff === -1) return 'YESTERDAY';
  return new Date(k).toLocaleDateString([], { weekday:'long', month:'short', day:'numeric' }).toUpperCase();
}
// Day strips and order.
// Mornings (before noon, nothing underway yet today): YESTERDAY's results lead, then TODAY, then what's ahead.
// From noon on, or once a game today has started: TODAY leads, then upcoming days, then YESTERDAY at the bottom.
// Inside a day: live games first, then upcoming by start time, then finals (The Lead orders by game interest instead).
// Sport pages: if exactly one game is live, it sits on top of TODAY as a full box until a second game goes live.
function grouped(games, byInterest, compact){
  const today = dayKey(Date.now());
  const days = new Map();
  games.forEach(g => { const k = g.state === 'in' ? today : dayKey(g.date); if (!days.has(k)) days.set(k, []); days.get(k).push(g); });
  const started = (days.get(today) || []).some(g => g.state !== 'pre') || new Date().getHours() >= 12;
  const keys = [...days.keys()];
  const future = keys.filter(k => k >= today).sort((a, b) => a - b);
  const past = keys.filter(k => k < today).sort((a, b) => b - a);
  const order = started || !past.length ? [...future, ...past] : [past[0], ...future, ...past.slice(1)];
  const rankState = { in: 0, pre: 1, post: 2 };
  return order.map(k => {
    const list = days.get(k).sort((a, b) =>
      (rankState[a.state] - rankState[b.state]) * (byInterest ? (a.state === 'in' || b.state === 'in' ? 1 : 0) : 1)
      || (byInterest ? interest(b) - interest(a) : a.date - b.date));
    let html = `<div class="section">${dayLabel(k)}</div>`;
    if (!compact) return html + list.map(tileHTML).join('');
    const live = list.filter(g => g.state === 'in');
    let rest = list;
    if (live.length === 1) { html += tileHTML(live[0]); rest = list.filter(g => g !== live[0]); }
    if (rest.length === 1) html += tileHTML(rest[0]);
    else if (rest.length) html += `<div class="grid2">${rest.map(miniHTML).join('')}</div>`;
    return html;
  }).join('');
}

function renderTop(){
  const el = document.getElementById('s-top');
  const all = SPORTS.flatMap(s => state.data[s.key] || []);
  if (!all.length) {
    if (SPORTS.every(s => state.errors[s.key])) el.innerHTML = `<div class="empty">Couldn't reach the score feeds. Check your connection and try again.<br><button class="btn" onclick="refresh()">Try Again</button></div>`;
    return;
  }
  // Every live game; finals from roughly the last day; games starting within the next day and a half.
  // Ranked by interest (stakes, rankings, closeness, recency), at most 4 per sport so one league can't take over.
  const now = Date.now();
  const inWindow = g => g.state === 'in' || (g.state === 'post' ? now - g.date < 30 * 36e5 : g.date - now < 36 * 36e5);
  const ranked = all.filter(inWindow).sort((a, b) => (b.state === 'in') - (a.state === 'in') || interest(b) - interest(a));
  const perSport = {}, picks = [];
  for (const g of ranked) {
    if (picks.length >= TOP_COUNT) break;
    const n = perSport[g.sport.key] || 0;
    if (g.state !== 'in' && n >= 4) continue;
    perSport[g.sport.key] = n + 1; picks.push(g);
  }
  if (!picks.length) picks.push(...[...all].sort((a, b) => interest(b) - interest(a)).slice(0, TOP_COUNT));
  el.innerHTML = (SPORTS.some(s => state.sample[s.key]) ? NOTICE : '') + grouped(picks, true);
}

function leaderPool(t, side, sum){

const findCat = (pool, re) => pool.find(c => c.leaders && c.leaders[0] && (re.test(c.name || '') || re.test(c.abbreviation || '') || re.test(c.shortDisplayName || '')));

// Football stat lines. Passing reads "2 TD/1 INT, 245 YDS"; rushing and receiving always end in YDS.
function fbStat(label, l, live){
  const dv = String(l.displayValue || '').replace(/(\d),(?=\d{3}\b)/g, '$1');
  const num = typeof l.value === 'number' ? String(l.value) : (dv.match(/^[\d,]+/) || [''])[0];
  const yds = (dv.match(/([\d,]+)\s*YDS/i) || [])[1] || num;
  if (label === 'PASS' && live) {
    // Live and final games: "14/21, 202 YDS, 2 TD"
    const ca = dv.match(/(\d+)\/(\d+)/), td = (dv.match(/(\d+)\s*TD/i) || [])[1];
    if (ca || yds) return [ca && `${ca[1]}/${ca[2]}`, yds && `${yds} YDS`, `${td || 0} TD`].filter(Boolean).join(', ');
    return dv;
  }
  if (label === 'PASS') {
    const td = (dv.match(/(\d+)\s*TD/i) || [])[1], int = (dv.match(/(\d+)\s*INT/i) || [])[1];
    const lead = td != null || int != null ? `${td || 0} TD, ${int || 0} INT, ` : '';
    return yds ? `${lead}${yds} YDS` : dv;
  }
  if (/YDS/i.test(dv)) return dv;
  return yds ? `${yds} YDS` : dv;
}

// Basketball game total for a leader's category: "31 PTS". Box score row first, else the feed's own value.
function bbLine(label, l, box, t, side){

  const st = team && team.statistics && team.statistics[0];

    if (row && row.stats && L.indexOf(label) >= 0) return `${row.stats[L.indexOf(label)]} ${label}`;
  }

// Top performers. Basketball box scores give a full stat line for each team's leading scorer;

function performers(g, sum){
  const box = sum && sum.boxscore && sum.boxscore.players;
  const basketball = g.sport.key === 'nba' || g.sport.key === 'ncb';
  return g.teams.map((t, side) => {

    const fam = sportFamily(g.sport.key);

    else picks = pool.filter(c => c.leaders && c.leaders[0]).slice(0, 3).map(c => [c.shortDisplayName || c.displayName || c.name, c]);

function stCalc(entries, college){
  const stat = (e, test) => (e.stats || []).find(test);
  const num = (e, re) => { const x = stat(e, y => re.test(y.name || '') || re.test(y.abbreviation || '')); if (!x) return null; const v = x.value ?? parseFloat(x.displayValue); return isNaN(v) ? null : +v; };

    }
    const p = college ? null : num(e, /^(winPercent|winPct|PCT)$/i);
    const pct = p != null ? (p > 1 ? p / 100 : p) : (r.w != null ? ((r.w + r.l + r.t) ? (r.w + r.t / 2) / (r.w + r.l + r.t) : 0) : null);
    return { e, ...r, pct, gb0: college ? null : num(e, /^(gamesBehind|GB)$/i) };
  });
  const lead = rows.filter(r => r.w != null).reduce((a, b) => (!a || (b.w - b.l) > (a.w - a.l) ? b : a), null);
  rows.forEach(r => {
    let v = r.gb0;
    if (v == null && lead && r.w != null) v = ((lead.w - r.w) + (r.l - lead.l)) / 2;
    r.gb = v == null ? '' : v <= 0 ? '-' : v.toFixed(1);
  });
  return rows;
}
function stTable(title, entries, college, isMe, sort){
  const pro = !college;
  let rows = stCalc(entries, college);
  if (sort) rows = rows.sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1) || (b.w ?? 0) - (a.w ?? 0));
  const body = rows.map(r => `<tr class="${isMe && isMe(r.e) ? 'me' : ''}"><td class="tm">${esc(stEntryName(r.e, college))}</td><td>${r.w ?? ''}</td><td>${r.l ?? ''}</td><td>${r.pct == null ? '' : r.pct.toFixed(3).replace(/^0/, '')}</td>${pro ? `<td>${esc(r.gb)}</td>` : ''}</tr>`).join('');
  return `<div class="gm-st"><table><colgroup><col><col style="width:30px"><col style="width:30px"><col style="width:48px">${pro ? '<col style="width:42px">' : ''}</colgroup><thead><tr><th class="tm">${esc(title)}</th><th>W</th><th>L</th><th>PCT</th>${pro ? '<th>GB</th>' : ''}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const stTitle = gr => String(gr.header || gr.name || '').replace(/^\d{4}(-\d{2})?\s+/, '').replace(/\s+Standings$/i, '');

// Standings below the stats: home team's conference/division first, then the away team's (one table if shared).
function standingsHTML(g, sum){
  const groups = sum && sum.standings && sum.standings.groups;
  if (!groups || !groups.length) return '';
  const college = g.sport.college;
  const ids = g.teams.map(t => String(t.id)), names = g.teams.map(t => t.name);
  const isMe = e => ids.includes(stEntryId(e)) || names.includes(stEntryName(e, college));
  const groupOf = id => groups.find(gr => ((gr.standings && gr.standings.entries) || []).some(e => stEntryId(e) === id || (g.teams.find(t => String(t.id) === id) || {}).name === stEntryName(e, college)));
  const order = [];
  [ids[1], ids[0]].forEach(id => { const gr = groupOf(id); if (gr && !order.includes(gr)) order.push(gr); });
  if (!order.length) return '';
  return `<div class="gm-strip">Standings</div><div class="gm-stw">${order.map(gr => stTable(stTitle(gr), (gr.standings && gr.standings.entries) || [], college, isMe)).join('')}</div>`;
}

function gameHTML(g){
  const [a, h] = g.teams;
  const side = (t, cls) => {
    const lost = g.state === 'post' && !t.winner && g.teams.some(x => x.winner);
    const big = g.state === 'pre' ? `<span class="pre">${t.rank ? `<i>${t.rank}</i> ` : ''}${esc(t.abbr)}</span>` : `<b>${esc(t.score)}</b><span>${esc(t.abbr)}</span>`;
    return `<div class="gm-side ${cls}">${logoImg(t)}<div class="gm-num${lost ? ' lost' : ''}">${t.rank && g.state !== 'pre' ? `<small>#${t.rank}</small>` : ''}${big}${t.record ? `<small>(${esc(t.record)})</small>` : ''}</div></div>`;
  };
  let mid;
  if (g.state === 'post') mid = `<div class="gm-mid">${esc(g.detail.replace(/^Final/i, 'Final'))}</div>`;
  else if (g.state === 'in') mid = `<div class="gm-mid live">${esc(g.detail)}${g.tv ? `<small>${esc(g.tv)}</small>` : ''}</div>`;
  else mid = `<div class="gm-mid pre">${esc(dateWord(g.date))}<small>${esc(g.detail && !/^\d/.test(g.detail) && !/\d:\d\d/.test(g.detail) ? g.detail : hm(g.date))}</small></div>`;

  const sum = summaries[g.sport.key + ':' + g.id];
  const perf = g.state === 'pre' ? [] : performers(g, sum && sum.data);
  const perfHTML = perf.some(Boolean)
    ? `<div class="gm-strip">${g.state === 'pre' ? 'Season Leaders' : 'Top Performers'}</div><div class="gm-perf">${perf.map(x => x || '<div class="gm-col"></div>').join('')}</div>`
    : (sum && sum.loading ? `<div class="gm-strip">${g.state === 'pre' ? 'Season Leaders' : 'Top Performers'}</div><div class="gm-wait">Loading stats…</div>` : '');

  let info = '';
  if (g.state === 'pre') {
    const v = sum && sum.data && sum.data.gameInfo && sum.data.gameInfo.venue;
    const place = [v && v.fullName || g.venue, v && v.address ? [v.address.city, v.address.state].filter(Boolean).join(', ') : g.venueAddr].filter(Boolean).join(', ');
    const fam = sportFamily(g.sport.key);
    let lead;
    {
      const cols = g.teams.map((t, side) => {
        const pool = leaderPool(t, side, sum && sum.data);
        const items = PRE_CATS[fam].map(([label, re]) => {
          const c = findCat(pool, re);
          if (!c) return '';
          const l = c.leaders[0];
          const stat = fam === 'football' ? fbStat(label, l) : fam === 'basketball' ? `${leaderValue(label, l)} ${({ PTS:'PPG', AST:'APG', REB:'RPG' })[label]}` : leaderValue(label, l);
          return card(label, l.athlete, stat);
        }).join('');
        return items ? `<div class="gm-col"><div class="gm-who">${esc(t.short)}</div>${items}</div>` : '';
      });
      lead = cols.some(Boolean) ? `<div class="gm-strip">Stat Leaders</div><div class="gm-perf">${cols.map(x => x || '<div class="gm-col"></div>').join('')}</div>` : '';
    }
    info = (place || g.tv ? `<div class="gm-venue">${place ? `<div>${esc(place)}</div>` : ''}${g.tv ? `<div>${esc(g.tv)}</div>` : ''}</div>` : '')
      + (lead || (sum && sum.loading ? '<div class="gm-strip">Stat Leaders</div><div class="gm-wait">Loading stats…</div>' : ''));
  }
  const footLabel = g.state === 'post' ? 'Recap' : g.state === 'in' ? 'Live Game' : 'Preview';
  const foot = g.link && g.link !== '#' ? `<a class="gm-foot" href="${esc(g.link)}" target="_blank" rel="noopener"><div><small>Full game page</small><span>${footLabel}</span></div><i></i></a>` : '';

  return `<button class="gm-x" id="gmClose" aria-label="Close">✕</button>
    <div class="gm-in"><div class="gm-head">${side(a, 'away')}${mid}${side(h, 'home')}</div>
    ${linescoreHTML(g)}${perfHTML}${info}${standingsHTML(g, sum && sum.data)}${foot}</div>`;
}

function renderGame(keepScroll){
  const g = openGid && findGame(openGid);
  if (!g) { closeGame(); return; }
  const prev = gm.querySelector('.gm-in'), y = keepScroll && prev ? prev.scrollTop : 0;
  let box = gm.querySelector('.gm');
  if (!box) { box = document.createElement('div'); box.className = 'gm'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); gm.appendChild(box); }
  box.className = 'gm th-' + gmTheme;
  box.setAttribute('aria-label', g.teams.map(t => t.name).join(' at '));
  box.innerHTML = gameHTML(g);
  box.querySelector('.gm-in').scrollTop = y;
  box.querySelectorAll('.gm-ln em').forEach(em => {
    const r = document.createRange(); r.selectNodeContents(em);
    const over = () => r.getBoundingClientRect().width > em.getBoundingClientRect().width - 0.5;
    let fs = 12;
    while (over() && fs > 9) { fs -= 0.5; em.style.fontSize = fs + 'px'; }
  });
  document.getElementById('gmClose').onclick = closeGame;
}

async function loadSummary(g){
  const key = g.sport.key + ':' + g.id;
  if (!summaries[key]) summaries[key] = { loading: true };
  if (state.sample[g.sport.key]) { summaries[key] = { data: SAMPLE_SUMMARY[g.id] || null }; return; }
  try {
    const r = await fetch(API + g.sport.path + '/summary?event=' + encodeURIComponent(g.id), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    summaries[key] = { data: await r.json() };
  } catch (e) { summaries[key] = { data: (summaries[key] && summaries[key].data) || null }; }
}

async function openGame(gid, theme){
  const g = findGame(gid);
  if (!g) return;
  openGid = gid; gmTheme = theme || g.sport.theme;
  gm.hidden = false; pager.style.overflowX = 'hidden';
  const key = gid;
  if (!summaries[key] || !summaries[key].data) summaries[key] = { loading: true };
  renderGame(false);
  document.getElementById('gmClose').focus({ preventScroll: true });
  await loadSummary(g);
  if (openGid === gid) renderGame(true);
  clearInterval(gmTimer);
  if (g.state === 'in') gmTimer = setInterval(async () => { const cur = findGame(gid); if (!cur || openGid !== gid) return; await loadSummary(cur); renderGame(true); }, 30000);
}
function closeGame(){
  openGid = null; clearInterval(gmTimer);
  gm.hidden = true; gm.innerHTML = ''; pager.style.overflowX = '';
}
gm.addEventListener('click', e => { if (e.target === gm) closeGame(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openGid) closeGame(); });
pager.addEventListener('click', e => {
  const tile = e.target.closest('.tile[data-gid]');
  if (!tile) return;
  e.preventDefault();
  const pg = tile.closest('.page');
  const th = pg && [...pg.classList].find(c => c.startsWith('th-'));
  openGame(tile.dataset.gid, th ? th.slice(3) : null);
});

/* ===== Data ===== */
const ymd = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
function dateRange(){ const d = new Date(); return ymd(new Date(d.getTime() - 864e5)) + '-' + ymd(new Date(d.getTime() + 864e5)); }
async function getJSON(url){
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
// Daily sports: try one yesterday→tomorrow request, then each day on its own, then the feed's default day.
async function fetchEvents(sport){
  const base = API + sport.path + '/scoreboard';
  const qs = extra => { const q = [sport.params, extra].filter(Boolean).join('&'); return q ? '?' + q : ''; };
  if (sport.daily) {
    try { return (await getJSON(base + qs('dates=' + dateRange()))).events || []; } catch (e) {}
    const days = [-1, 0, 1].map(o => ymd(new Date(Date.now() + o * 864e5)));
    const res = await Promise.allSettled(days.map(d => getJSON(base + qs('dates=' + d))));
    const ok = res.filter(r => r.status === 'fulfilled');
    if (ok.length) { const m = new Map(); ok.forEach(r => (r.value.events || []).forEach(e => m.set(e.id, e))); return [...m.values()]; }
  }
  return (await getJSON(base + qs(''))).events || [];
}
async function loadSport(sport){
  try {
    const events = await fetchEvents(sport);
    // one odd game never takes down the whole sport
    state.data[sport.key] = events.flatMap(ev => { try { return [normalize(sport, ev)]; } catch (e) { console.warn('Skipped game', ev && ev.id, e); return []; } });
    state.errors[sport.key] = false;
  } catch (e) {
    state.errors[sport.key] = true;
    if (state.sample[sport.key]) state.data[sport.key] = undefined;
  }
  state.sample[sport.key] = false;
}

async function refresh(){
  await Promise.all(SPORTS.map(loadSport));
  // Sample games only when no feed is reachable at all (the hosted preview); on your site a failed sport shows a retry message.
  if (SPORTS.every(sp => state.errors[sp.key] && !state.data[sp.key])) SPORTS.forEach(sp => {
    if (SAMPLE[sp.key]) { state.data[sp.key] = SAMPLE[sp.key].map(ev => normalize(sp, ev)); state.sample[sp.key] = true; state.errors[sp.key] = false; }
  });
  await Promise.all(Object.keys(CONFS).map(k => { const f = filterOf(k); return f !== 'top25' && f !== CONFS[k].all[0] ? loadConf(sportOf(k), f) : null; }));
  SPORTS.forEach(renderSport);
  renderTop();
  if (openGid) renderGame(true);
  state.updated = new Date();
  document.getElementById('updated').textContent = 'Last updated ' + hm(state.updated) + '.';
  schedule();
}
let timer;
function schedule(){
  clearTimeout(timer);
  const anyLive = SPORTS.some(s => (state.data[s.key] || []).some(g => g.state === 'in'));
  timer = setTimeout(refresh, anyLive ? 30000 : 120000);
}

/* ===== Ticker ===== */
async function loadNews(){
  const res = await Promise.all(SPORTS.map(async s => {
    try {
      const r = await fetch(API + s.path + '/news?limit=5');
      const j = await r.json();
      return (j.articles || []).map(a => ({ tag: s.tag, text: a.headline })).filter(a => a.text);
    } catch (e) { return []; }
  }));
  const mixed = [];
  for (let i = 0; i < 5; i++) res.forEach(list => list[i] && mixed.push(list[i]));
  state.news = mixed.length ? mixed : SAMPLE_NEWS;
}
const CRAWL_SPEED = 50;   // pixels per second while crawling
const SLIDE_MS = 380;      // rise-in and lift-out duration
const HOLD_START = 1600;   // pause after a headline rises in
const HOLD_END = 1300;      // pause once the end of the headline is showing
const PAD = 10;
let tickIdx = 0, crawl = null;
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
function nextTick(){
  const lab = document.getElementById('tickLab'), txt = document.getElementById('tickTxt');
  if (!state.news.length) { setTimeout(nextTick, 3000); return; }
  const item = state.news[tickIdx++ % state.news.length];
  lab.textContent = item.tag; txt.textContent = item.text;
  const railW = txt.parentElement.clientWidth, h = txt.parentElement.clientHeight;
  crawl = { phase:'in', t0:null, x: PAD, y: h, h, endX: Math.min(PAD, railW - txt.scrollWidth - PAD), last:null };
}
function crawlFrame(ts){
  const txt = document.getElementById('tickTxt');
  const c = crawl;
  if (c) {
    if (c.t0 == null) c.t0 = ts;
    const el = ts - c.t0, dt = c.last == null ? 0 : Math.min(ts - c.last, 100);
    c.last = ts;
    if (c.phase === 'in') { const k = Math.min(el / SLIDE_MS, 1); c.y = c.h * (1 - ease(k)); if (k === 1) { c.phase = 'hold'; c.t0 = ts; } }
    else if (c.phase === 'hold') { if (el >= HOLD_START) { c.phase = 'crawl'; c.t0 = ts; } }
    else if (c.phase === 'crawl') { c.x = Math.max(c.endX, c.x - CRAWL_SPEED * dt / 1000); if (c.x <= c.endX) { c.phase = 'hold2'; c.t0 = ts; } }
    else if (c.phase === 'hold2') { if (el >= HOLD_END) { c.phase = 'out'; c.t0 = ts; } }
    else if (c.phase === 'out') { const k = Math.min(el / SLIDE_MS, 1); c.y = -c.h * ease(k); if (k === 1) { crawl = null; nextTick(); } }
    txt.style.transform = `translate3d(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px,0)`;
  }
  requestAnimationFrame(crawlFrame);
}
requestAnimationFrame(crawlFrame);

/* ===== Settings, icon ===== */

const sheet = document.getElementById('sheet');
document.getElementById('gear').onclick = () => { sheet.hidden = false; document.getElementById('closeBtn').focus(); };
document.getElementById('closeBtn').onclick = () => sheet.hidden = true;
sheet.onclick = e => { if (e.target === sheet) sheet.hidden = true; };
document.getElementById('refreshBtn').onclick = () => { sheet.hidden = true; refresh(); loadNews(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

refresh();
loadNews().then(nextTick);
</script>
