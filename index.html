<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scoreline">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
/* Layout: iOS 6–era app shell. Horizontally paged glossy panels, footer with settings gear, page dots and a headline ticker. */
:root{
  --navy-0:#06101f;      /* app ground */
  --navy-1:#0d2347;      /* panel base */
  --navy-2:#173a70;      /* panel highlight */
  --navy-3:#2a5aa3;      /* tile highlight */
  --steel:#9fb6d8;       /* muted text */
  --ink:#ffffff;
  --amber:#ffb21f;       /* brand accent / live */
  --live:#ff4b3a;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
/* Per-sport panel themes (swap hex values to match the scoreboard pages) */
.page{--p-hi:#173a70;--p-base:#0d2347;--p-deep:#0a1c3b;--p-line:rgba(160,195,255,.35);
  --t-hi:rgba(90,140,220,.55);--t-mid:rgba(30,70,140,.55);--t-lo:rgba(18,45,95,.65);--t-line:rgba(190,215,255,.55);--t-sub:#c9d6ea;--b-hi:#3e6fbf;--b-lo:#1d4689}
/* Colors pulled from each scoreboard page's .bg-pattern gradient (0/16/34/55/78% stops) */
.th-red{--p-hi:#c42020;--p-base:#941414;--p-deep:#661010;--p-line:rgba(212,122,122,0.55);
  --t-hi:rgba(212,122,122,0.55);--t-mid:rgba(196,32,32,0.6);--t-lo:rgba(148,20,20,0.75);--t-line:rgba(238,220,220,0.6);--t-sub:#eedcdc;--b-hi:#c42020;--b-lo:#661010}
.th-nfl{--p-hi:#1f7a3d;--p-base:#155c2e;--p-deep:#0a3d1f;--p-line:rgba(143,196,163,0.55);
  --t-hi:rgba(143,196,163,0.55);--t-mid:rgba(31,122,61,0.6);--t-lo:rgba(21,92,46,0.75);--t-line:rgba(223,233,226,0.6);--t-sub:#dfe9e2;--b-hi:#1f7a3d;--b-lo:#0a3d1f}
.th-mlb{--p-hi:#1f6cc4;--p-base:#145094;--p-deep:#0f3463;--p-line:rgba(126,170,212,0.55);
  --t-hi:rgba(126,170,212,0.55);--t-mid:rgba(31,108,196,0.6);--t-lo:rgba(20,80,148,0.75);--t-line:rgba(221,229,238,0.6);--t-sub:#dde5ee;--b-hi:#1f6cc4;--b-lo:#0f3463}
.th-nba{--p-hi:#d66a00;--p-base:#a34d00;--p-deep:#6b3300;--p-line:rgba(232,163,102,0.55);
  --t-hi:rgba(232,163,102,0.55);--t-mid:rgba(214,106,0,0.6);--t-lo:rgba(163,77,0,0.75);--t-line:rgba(240,221,201,0.6);--t-sub:#f0ddc9;--b-hi:#d66a00;--b-lo:#6b3300}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0a0a0a;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
.app{position:relative;height:100%;display:flex;flex-direction:column;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),
    radial-gradient(120% 70% at 50% 0%,#3a3a3a 0%,#1a1a1a 55%,#0a0a0a 100%);
  padding-top:env(safe-area-inset-top,0px)}


/* pager */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));display:flex;max-width:100vw}
.panel{flex:1;min-width:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,var(--p-hi) 0%,var(--p-base) 120px,var(--p-deep) 100%);
  border:1px solid var(--p-line);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.6)}
.panel-head{position:relative;flex:none;text-align:center;padding:12px 10px 10px}
.panel-head::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.03));pointer-events:none}
.panel-head::after{content:attr(data-watermark);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:italic 900 64px/1 var(--font);letter-spacing:-2px;color:rgba(255,255,255,.06);pointer-events:none;white-space:nowrap;overflow:hidden}
.panel-head h1{position:relative;margin:0;font-size:33px;font-weight:700;letter-spacing:-.5px;text-shadow:0 -1px 0 rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.35)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 10px;overscroll-behavior:contain}
.section{margin:8px -8px 6px;padding:5px 12px;font-size:13px;font-weight:800;letter-spacing:.6px;
  background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.2));border-top:1px solid rgba(0,0,0,.5);border-bottom:1px solid rgba(255,255,255,.12);
  text-shadow:0 -1px 0 #000;display:flex;justify-content:space-between;align-items:baseline}
.section small{font-size:11px;font-weight:600;color:var(--steel)}

/* game tile */
.tile{display:block;color:inherit;text-decoration:none;margin:8px 4px;border-radius:7px;overflow:hidden;
  background:linear-gradient(180deg,var(--t-hi),var(--t-mid) 40%,var(--t-lo));
  border:1px solid var(--t-line);box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.tile:active{filter:brightness(1.25)}
.t-top{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 2px;font-size:12px;font-weight:700;color:var(--t-sub);text-transform:uppercase;letter-spacing:.2px}
.t-top .rt{display:flex;gap:8px;align-items:center;white-space:nowrap}
.t-top .tv{color:#fff}
.t-top .lg{color:var(--amber)}
.t-top.live{color:#fff}
.t-top.live .st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;box-shadow:0 0 6px var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 10px;align-items:center;column-gap:5px;padding:3px 0 3px 8px;font-size:17px;font-weight:700;text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.row img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.row .rk{font-size:12px;font-weight:600;color:var(--t-sub);margin-right:4px}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc.rec{font-size:14px;font-weight:600;color:var(--t-sub)}
.row .sc{font-variant-numeric:tabular-nums;text-align:right;min-width:24px}
.row.loser{color:var(--t-sub)}
.row .win{width:0;height:0;border-style:solid;border-width:6px 8px 6px 0;border-color:transparent #fff transparent transparent;justify-self:end;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.blurb{padding:5px 8px 7px;font-size:13px;line-height:1.3;color:#fff;border-top:1px solid rgba(255,255,255,.18)}
.blurb:empty{display:none}
.badge{width:28px;height:28px;font-size:9px!important;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;letter-spacing:-.2px;color:#fff;border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.6);overflow:hidden}
.notice{margin:8px 4px 0;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:600;color:#1a1200;background:linear-gradient(#ffd06a,#ffb21f);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

.more{display:block;margin:12px 4px 4px;padding:10px;text-align:center;border-radius:7px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;
  background:linear-gradient(var(--b-hi),var(--b-lo));border:1px solid var(--p-deep);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 rgba(255,255,255,.15);text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.empty{margin:20px 6px;text-align:center;color:var(--steel);font-size:14px;line-height:1.4}
.empty button{margin-top:8px}
.skel{height:92px;margin:8px 4px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* footer */
.foot{flex:none;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(#20262e,#0d1015)}
.dotsbar{display:flex;align-items:center;height:30px;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));background:#0a0a0a}
.gear{width:28px;height:28px;border:0;background:none;padding:2px;cursor:pointer}
.gear svg{width:22px;height:22px;fill:#8c95a3;filter:drop-shadow(0 -1px 0 #000)}
.dots{flex:1;display:flex;justify-content:center;gap:9px;margin-right:28px}
.dots button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:#4a5566;cursor:pointer}
.dots button.on{background:#fff}
.ticker{display:flex;align-items:stretch;height:26px;border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.ticker .lab{flex:none;width:56px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-style:italic;color:#fff;background:linear-gradient(#5a5a5a,#1c1c1c 55%,#000);border-right:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 -1px 0 #000}
.ticker .rail{flex:1;min-width:0;overflow:hidden;position:relative;background:linear-gradient(#1a1a1a,#000);color:#fff;font-size:14px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.ticker .txt{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.brand{flex:none;display:flex;align-items:center;padding:0 10px;font:italic 900 15px/1 var(--font);letter-spacing:-.5px;color:#fff;
  background:linear-gradient(#e8382b,#b3100a 55%,#8f0c07);border-left:1px solid #000;text-shadow:0 -1px 0 rgba(0,0,0,.5);clip-path:polygon(10px 0,100% 0,100% 100%,0 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.brand span{color:#fff}

/* game pop-up */
.gm-veil{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(18px,env(safe-area-inset-left,0px));
  background:rgba(0,0,0,.6)}
.gm{position:relative;width:100%;max-width:420px;max-height:100%;display:flex;flex-direction:column;border-radius:6px;
  background:linear-gradient(180deg,var(--p-hi) 0%,var(--p-base) 45%,var(--p-deep) 100%);
  border:1px solid var(--p-line);box-shadow:0 0 0 1px rgba(0,0,0,.7),0 12px 30px rgba(0,0,0,.75);animation:gm-in .22s ease-out}
@keyframes gm-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.gm-x{position:absolute;top:-13px;right:-13px;z-index:2;width:34px;height:34px;border-radius:50%;padding:0;cursor:pointer;
  border:2px solid #fff;background:radial-gradient(circle at 50% 30%,#8a8a8a,#3a3a3a 70%);box-shadow:0 2px 6px rgba(0,0,0,.7);
  color:#fff;font:700 20px/1 var(--font);display:flex;align-items:center;justify-content:center}
.gm-x:focus-visible,.gm-foot:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.gm-in{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:6px;min-height:0}
.gm-head{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;padding:14px 10px 12px;text-shadow:0 -1px 0 rgba(0,0,0,.55)}
.gm-head::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.04));pointer-events:none}
.gm-side{position:relative;display:flex;align-items:center;gap:4px;min-width:0}
.gm-side.home{flex-direction:row-reverse}
.gm-side img,.gm-side .badge{flex:none;width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.gm-side .badge{font-size:13px!important}
.gm-num{flex:1;min-width:0;text-align:center;line-height:1.05}
.gm-num b{display:block;font-size:clamp(28px,9vw,40px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.gm-num b.pre{font-size:26px;letter-spacing:0;padding:6px 0 2px}
.gm-num span{display:block;font-size:15px;font-weight:800}
.gm-num small{display:block;font-size:13px;font-weight:600;color:var(--t-sub)}
.gm-num.lost b{color:var(--t-sub)}
.gm-mid{position:relative;text-align:center;font-size:13px;min-width:44px;font-weight:800;text-transform:uppercase;max-width:96px}
.gm-mid small{display:block;margin-top:3px;font-size:11px;font-weight:700;color:var(--t-sub)}
.gm-mid.live::before{content:"";display:block;margin:0 auto 4px;width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 6px var(--live);animation:pulse 1.4s infinite}
.gm-ls{margin:0 10px 10px;border-radius:4px;background:rgba(0,0,0,.2);box-shadow:inset 0 1px 3px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.12);overflow-x:auto}
.gm-ls table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;text-shadow:0 -1px 0 rgba(0,0,0,.55)}
.gm-ls th{padding:8px 6px 2px;font-size:13px;font-weight:700;color:var(--t-sub);text-align:center;min-width:26px}
.gm-ls td{padding:5px 6px;font-size:19px;font-weight:700;text-align:center}
.gm-ls td.tm{text-align:left;padding-left:12px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.gm-ls tr:last-child td{padding-bottom:9px}
.gm-ls td.tot{font-weight:800;border-left:1px solid rgba(255,255,255,.15)}
.gm-ls .lost td{color:var(--t-sub)}
.gm-ls .arw{width:12px;padding:0 6px 0 0}
.gm-ls.dense td{font-size:15px;padding:5px 3px}
.gm-ls.dense th{font-size:12px;padding:8px 3px 2px;min-width:16px}
.gm-ls.dense td.tm{padding-left:10px}
.gm-ls .arw i{display:inline-block;width:0;height:0;border-style:solid;border-width:5px 7px 5px 0;border-color:transparent #fff transparent transparent}
.gm-strip{padding:6px 12px;font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.2));border-top:1px solid rgba(0,0,0,.5);border-bottom:1px solid rgba(255,255,255,.12);text-shadow:0 -1px 0 #000}
.gm-perf{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 12px 12px}
.gm-col{min-width:0;display:flex;flex-direction:column;gap:9px}
.gm-who{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.gm-card{display:flex;gap:9px;align-items:flex-start}
.gm-shot{flex:none;width:58px;height:66px;border-radius:2px;background:linear-gradient(#f2f2f2,#cfcfcf);border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 3px rgba(0,0,0,.6);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.gm-shot img{width:100%;height:100%;object-fit:cover;object-position:top}
.gm-shot svg{width:80%;fill:#9a9a9a}
.gm-shot.sm{width:38px;height:44px}
.gm-stats{display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:1px;font-size:14px;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.gm-stats dt{font-weight:800}
.gm-stats dd{margin:0;font-weight:600}
.gm-ln{min-width:0;font-size:13px;line-height:1.25;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.gm-ln b{display:block;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--t-sub)}
.gm-ln span{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-ln em{display:block;font-style:normal;font-weight:600}
.gm-info{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:5px;padding:10px 12px 12px;font-size:14px;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.gm-info dt{font-weight:800;color:var(--t-sub);text-transform:uppercase;font-size:12px;padding-top:2px}
.gm-info dd{margin:0;font-weight:600}
.gm-num .pre{display:block;font-size:clamp(16px,5.4vw,22px);font-weight:800;padding-top:2px;white-space:nowrap}
.gm-num .pre i{font-style:normal;font-size:13px;color:var(--t-sub);vertical-align:3px}
.gm-mid.pre{font-size:15px;text-transform:none;max-width:110px}
.gm-mid.pre small{font-size:13px;color:#fff;margin-top:2px}
.gm-venue{margin:0 0 0;padding:8px 12px;font-size:14px;font-weight:700;background:rgba(0,0,0,.18);border-top:1px solid rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.1);text-shadow:0 -1px 0 rgba(0,0,0,.55)}
.gm-lead{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);column-gap:10px;row-gap:4px;padding:10px 12px 12px;font-size:15px;text-shadow:0 -1px 0 rgba(0,0,0,.55)}
.gl-h{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl-k{font-weight:800;font-size:13px;padding-top:2px}
.gl-v{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.gl-v b{font-weight:800;font-variant-numeric:tabular-nums}
.gl-v .none{color:var(--t-sub)}
.gm-wait{padding:14px 12px;color:var(--t-sub);font-size:13px}
.gm-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:#fff;text-decoration:none;
  background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.28));border-top:1px solid rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.gm-foot small{display:block;font-size:11px;font-weight:600;color:var(--t-sub)}
.gm-foot span{font-size:19px;font-weight:800}
.gm-foot i{width:0;height:0;border-style:solid;border-width:8px 0 8px 10px;border-color:transparent transparent transparent rgba(255,255,255,.85);font-style:normal}
.gm-foot:active{filter:brightness(1.2)}
/* settings sheet */
.sheet{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet .box{width:100%;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(#5d6a7d,#2f3947);border-top:1px solid #8a97aa;box-shadow:0 -4px 16px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:17px;text-align:center;text-shadow:0 -1px 0 #000}
.sheet p{margin:0;font-size:13px;line-height:1.4;color:#dde3ec;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.btn{display:block;width:100%;padding:11px;border-radius:9px;font:700 16px var(--font);color:#fff;cursor:pointer;
  background:linear-gradient(#5a8be0,#2459b8 50%,#1a4aa3);border:1px solid #0d2a62;box-shadow:inset 0 1px 0 rgba(255,255,255,.45);text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.btn.dark{background:linear-gradient(#4c5563,#262c35 50%,#1c2129);border-color:#0b0d11}
.btn:focus-visible,.dots button:focus-visible,.gear:focus-visible,.tile:focus-visible,.more:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pager{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="pager" id="pager" aria-label="Score pages"></main>

  <footer class="foot">
    <div class="dotsbar">

/* ===== State ===== */
const state = { data:{}, errors:{}, sample:{}, updated:null, news:[] };
const pager = document.getElementById('pager');
const dotsEl = document.getElementById('dots');
const pages = [{ key:'top', name:'The Lead', mark:'LEAD', theme:'red' }, ...SPORTS];

if (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');

/* ===== Build shell ===== */
pages.forEach((p, i) => {
  const sec = document.createElement('section');
  sec.className = 'page th-' + p.theme; sec.id = 'p-' + p.key; sec.setAttribute('aria-label', p.name);
  sec.innerHTML = `<div class="panel"><div class="panel-head" data-watermark="${p.mark}"><h1>${p.name}</h1></div>
    <div class="scroll" id="s-${p.key}"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>`;
  pager.appendChild(sec);
  const d = document.createElement('button');
  d.setAttribute('role','tab'); d.setAttribute('aria-label', p.name);
  d.onclick = () => pager.scrollTo({ left: i * pager.clientWidth, behavior: 'smooth' });
  dotsEl.appendChild(d);
});
let current = 0;
function syncDots(){
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  current = Math.max(0, Math.min(pages.length - 1, i));
  [...dotsEl.children].forEach((d, j) => { d.classList.toggle('on', j === current); d.setAttribute('aria-selected', j === current); });
  try { localStorage.setItem('scoreline.page', current); } catch(e){}
}
pager.addEventListener('scroll', () => requestAnimationFrame(syncDots), { passive:true });
addEventListener('resize', () => pager.scrollLeft = current * pager.clientWidth);
try { const saved = +localStorage.getItem('scoreline.page'); if (saved > 0) requestAnimationFrame(() => { pager.scrollLeft = saved * pager.clientWidth; syncDots(); }); } catch(e){}
syncDots();

/* ===== Helpers ===== */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
const hm = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });

// Logo built for dark backgrounds (e.g. a white "A" for Alabama). Uses the feed's own dark entry when it has one,
// otherwise the CDN's 500-dark folder. If that image is missing, logoFallback() swaps in the standard logo.
function darkVariant(team){
  const tagged = (team.logos || []).find(l => (l.rel || []).includes('dark'));
  if (tagged) return tagged.href;
  const base = team.logo || (team.logos && team.logos[0] && team.logos[0].href) || '';
  return /\/500\//.test(base) ? base.replace('/500/', '/500-dark/') : base;
}
function logoFallback(img){
  if (img.dataset.std && img.src !== img.dataset.std) { const std = img.dataset.std; img.dataset.std = ''; img.src = std; }
  else img.style.visibility = 'hidden';
}
function normalize(sport, ev){
  const c = ev.competitions[0];
  const st = c.status.type;
  const date = new Date(ev.date);
  const teams = [...c.competitors].sort((a, b) => (a.homeAway === 'away' ? -1 : 1) - (b.homeAway === 'away' ? -1 : 1)).map(t => {
    const r = t.curatedRank && t.curatedRank.current;
    return {
      name: sport.college ? (t.team.location || t.team.shortDisplayName) : t.team.displayName,
      abbr: t.team.abbreviation || (t.team.shortDisplayName || '').slice(0,3).toUpperCase(), color: t.team.color || '2a5aa3',
      logo: t.team.logo || (t.team.logos && t.team.logos[0] && t.team.logos[0].href) || '',
      darkLogo: darkVariant(t.team),
      rank: r && r <= 25 ? r : null,
      score: t.score, winner: !!t.winner,
      record: t.records && t.records[0] && t.records[0].summary,
      id: t.team.id, short: t.team.shortDisplayName || t.team.name || t.team.abbreviation,
      lines: (t.linescores || []).map(l => l.displayValue ?? l.value),
      hits: t.hits, errors: t.errors, leaders: t.leaders || [],
    };
  });
  let label, blurb = '';
  if (st.state === 'post') {
    label = `${md(date)}: ${st.shortDetail.replace(/^Final/i,'FINAL')}`;
    blurb = (c.headlines && c.headlines[0] && (c.headlines[0].shortLinkText || c.headlines[0].description)) || '';
  } else if (st.state === 'in') {
    label = st.shortDetail;
    blurb = (c.situation && c.situation.lastPlay && c.situation.lastPlay.text) || (c.situation && c.situation.downDistanceText) || '';
  } else {
    label = st.name === 'STATUS_SCHEDULED' ? `${md(date)}: ${hm(date)}` : `${md(date)}: ${st.shortDetail}`;
    const tv = c.broadcasts && c.broadcasts[0] && c.broadcasts[0].names && c.broadcasts[0].names.join('/');
    const venue = c.venue && c.venue.fullName;
    blurb = venue || '';
    if (c.notes && c.notes[0] && c.notes[0].headline) blurb = c.notes[0].headline + (blurb ? ' · ' + blurb : '');
  }
  if (!blurb && c.notes && c.notes[0]) blurb = c.notes[0].headline;
  const scores = teams.map(t => +t.score || 0);
  const bc = c.broadcasts && c.broadcasts[0] && c.broadcasts[0].names && c.broadcasts[0].names.join('/');
  const tv = st.state === 'post' ? '' : (bc || (c.geoBroadcasts && c.geoBroadcasts[0] && c.geoBroadcasts[0].media && c.geoBroadcasts[0].media.shortName) || '');
  const odds = c.odds && c.odds[0];
  return { id: ev.id, sport, state: st.state, date, label, blurb, tv, teams, link: gameLink(sport, ev),
    detail: st.shortDetail || '', venue: c.venue && c.venue.fullName, venueAddr: c.venue && c.venue.address ? [c.venue.address.city, c.venue.address.state].filter(Boolean).join(', ') : '', odds: odds ? [odds.details, odds.overUnder] : null,
    margin: Math.abs(scores[0] - (scores[1] || 0)), post: ev.season && ev.season.type === 3 };
}

function interest(g){
  let s = 0;
  if (g.state === 'in') s += 60;
  if (g.state === 'post') s += 25;
  if (g.post) s += 45;
  g.teams.forEach(t => { if (t.rank) s += 26 - t.rank; });
  if (g.teams.every(t => t.rank)) s += 20;
  if (g.state !== 'pre' && g.margin <= 7) s += 12;
  if (!g.sport.college) s += 8;
  const hrs = Math.abs(Date.now() - g.date) / 36e5;
  s -= Math.min(hrs, 72) * 0.6;
  return s;
}

function tileHTML(g){
  const live = g.state === 'in';
  const rows = g.teams.map(t => {
    const showScore = g.state !== 'pre';
    const loser = g.state === 'post' && !t.winner && g.teams.some(x => x.winner);
    return `<div class="row${loser ? ' loser' : ''}">
      ${t.logo ? `<img src="${esc(t.darkLogo || t.logo)}" data-std="${esc(t.logo)}" alt="" loading="lazy" onerror="logoFallback(this)">` : `<span class="badge" style="background:#${esc(t.color)}">${esc(t.abbr)}</span>`}
      <span class="nm">${t.rank ? `<span class="rk">${t.rank}</span>` : ''}${esc(t.name)}</span>
      ${showScore ? `<span class="sc">${esc(t.score)}</span>` : `<span class="sc rec">${esc(t.record || '')}</span>`}
      ${t.winner && g.state === 'post' ? '<i class="win"></i>' : '<span></span>'}
    </div>`;
  }).join('');
  return `<a class="tile" href="${esc(g.link)}" data-gid="${g.sport.key}:${esc(g.id)}" target="_blank" rel="noopener">
    <div class="t-top${live ? ' live' : ''}"><span class="st">${esc(g.label)}</span><span class="rt">${g.tv ? `<span class="tv">${esc(g.tv)}</span>` : ''}</span></div>
    ${rows}<div class="blurb">${esc(g.blurb)}</div></a>`;
}

// Day strips: YESTERDAY / TODAY / TOMORROW (other dates by name). Live games always count as today.
const dayKey = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
function dayLabel(k){
  const diff = Math.round((k - dayKey(Date.now())) / 864e5);
  if (diff === 0) return 'TODAY';
  if (diff === 1) return 'TOMORROW';
  if (diff === -1) return 'YESTERDAY';
  return new Date(k).toLocaleDateString([], { weekday:'long', month:'short', day:'numeric' }).toUpperCase();
}
function grouped(games, byInterest){
  const today = dayKey(Date.now());
  const days = new Map();
  games.forEach(g => { const k = g.state === 'in' ? today : dayKey(g.date); if (!days.has(k)) days.set(k, []); days.get(k).push(g); });
  // Once today's action has started, lead with today and look ahead; before that, lead with yesterday's results.
  const started = (days.get(today) || []).some(g => g.state !== 'pre');
  const keys = [...days.keys()];
  const future = keys.filter(k => k >= today).sort((a, b) => a - b);
  const past = keys.filter(k => k < today).sort((a, b) => b - a);
  const order = started || !past.length ? [...future, ...past] : [past[0], ...future, ...past.slice(1)];
  return order.map(k => {
    const list = days.get(k).sort((a, b) =>
      (b.state === 'in') - (a.state === 'in') || (byInterest ? interest(b) - interest(a) : a.date - b.date));
    return `<div class="section">${dayLabel(k)}</div>` + list.map(tileHTML).join('');
  }).join('');
}

/* ===== Render ===== */
const NOTICE = '<div class="notice">Sample games. Live scores load when this page runs on your own site.</div>';
function renderSport(sport){
  const el = document.getElementById('s-' + sport.key);
  const games = state.data[sport.key];
  const more = sport.page ? `<a class="more" href="${esc(sport.page)}">Full ${esc(sport.name)} Scoreboard ›</a>` : '';
  if (!games) {
    if (state.errors[sport.key]) el.innerHTML = `<div class="empty">Couldn't reach ${esc(sport.name)} scores. Check your connection and try again.<br><button class="btn" onclick="refresh()">Try Again</button></div>${more}`;
    return;
  }
  if (!games.length) { el.innerHTML = `<div class="empty">No ${esc(sport.name)} games on today's slate.</div>${more}`; return; }
  el.innerHTML = (state.sample[sport.key] ? NOTICE : '') + grouped(games, false) + more;
}

function renderTop(){
  const el = document.getElementById('s-top');
  const all = SPORTS.flatMap(s => state.data[s.key] || []);
  if (!all.length) {
    if (SPORTS.every(s => state.errors[s.key])) el.innerHTML = `<div class="empty">Couldn't reach the score feeds. Check your connection and try again.<br><button class="btn" onclick="refresh()">Try Again</button></div>`;
    return;
  }
  const picks = [...all].sort((a, b) => interest(b) - interest(a)).slice(0, TOP_COUNT);
  el.innerHTML = (SPORTS.some(s => state.sample[s.key]) ? NOTICE : '') + grouped(picks, true);
}

/* ===== Game pop-up ===== */
const REG = { nba:4, ncb:2, nfl:4, cfb:4, mlb:9 };
const gm = document.getElementById('gm');
const summaries = {};
let openGid = null, gmTheme = 'red', gmTimer;
const findGame = gid => { const [k, id] = gid.split(':'); return (state.data[k] || []).find(g => g.id === id); };
const silhouette = '<svg viewBox="0 0 40 44"><circle cx="20" cy="15" r="10"/><path d="M2 44c0-11 8-18 18-18s18 7 18 18z"/></svg>';
const shot = (src, sm) => `<div class="gm-shot${sm ? ' sm' : ''}">${src ? `<img src="${esc(src)}" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment(silhouette))">` : silhouette}</div>`;
const logoImg = t => t.logo ? `<img src="${esc(t.darkLogo || t.logo)}" data-std="${esc(t.logo)}" alt="" onerror="logoFallback(this)">` : `<span class="badge" style="background:#${esc(t.color)}">${esc(t.abbr)}</span>`;

function periodLabel(key, i){
  const reg = REG[key] || 4;
  if (key === 'mlb' || i < reg) return String(i + 1);
  const n = i - reg + 1;
  return n === 1 ? 'OT' : n + 'OT';
}
function linescoreHTML(g){
  if (g.state === 'pre') return '';
  const reg = REG[g.sport.key] || 4;
  const n = Math.max(reg, ...g.teams.map(t => t.lines.length));
  if (!g.teams.some(t => t.lines.length)) return '';
  const mlb = g.sport.key === 'mlb';
  const heads = Array.from({ length: n }, (_, i) => `<th>${periodLabel(g.sport.key, i)}</th>`).join('') + (mlb ? '<th>R</th><th>H</th><th>E</th>' : '<th>T</th>');
  const rows = g.teams.map(t => {
    const lost = g.state === 'post' && !t.winner && g.teams.some(x => x.winner);
    const cells = Array.from({ length: n }, (_, i) => `<td>${esc(t.lines[i] ?? '')}</td>`).join('');
    const tot = mlb ? `<td class="tot">${esc(t.score)}</td><td>${esc(t.hits ?? '')}</td><td>${esc(t.errors ?? '')}</td>` : `<td class="tot">${esc(t.score)}</td>`;
    return `<tr class="${lost ? 'lost' : ''}"><td class="tm">${esc(n > 6 ? t.abbr : t.short)}</td>${cells}${tot}<td class="arw">${t.winner && g.state === 'post' ? '<i></i>' : ''}</td></tr>`;
  }).join('');
  return `<div class="gm-ls${n > 6 ? ' dense' : ''}"><table><thead><tr><th></th>${heads}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Top performers. Basketball box scores give a full stat line for each team's leading scorer;
// other sports (and pregame) use the feed's leader categories.
function performers(g, sum){
  const box = sum && sum.boxscore && sum.boxscore.players;
  const basketball = g.sport.key === 'nba' || g.sport.key === 'ncb';
  return g.teams.map((t, side) => {
    if (basketball && box && g.state !== 'pre') {
      const team = box.find(b => String(b.team && b.team.id) === String(t.id)) || box[side];
      const st = team && team.statistics && team.statistics[0];
      if (st && st.athletes && st.athletes.length) {
        const L = st.labels || st.names || [];
        const ix = k => L.indexOf(k);
        const best = [...st.athletes].filter(a => a.stats && a.stats.length).sort((a, b) => (+b.stats[ix('PTS')] || 0) - (+a.stats[ix('PTS')] || 0))[0];
        if (best) {
          const a = best.athlete || {};
          const stats = ['PTS','REB','AST','STL','BLK'].filter(k => ix(k) >= 0).map(k => `<dt>${k}</dt><dd>${esc(best.stats[ix(k)])}</dd>`).join('');
          return `<div class="gm-col"><div class="gm-who">${esc(a.shortName || a.displayName)}, ${esc(t.abbr)}</div>
            <div class="gm-card">${shot(a.headshot && a.headshot.href)}<dl class="gm-stats">${stats}</dl></div></div>`;
        }
      }
    }
    let cats = t.leaders;
    if (sum && sum.leaders) {
      const tl = sum.leaders.find(l => String(l.team && l.team.id) === String(t.id)) || sum.leaders[side];
      if (tl && tl.leaders && tl.leaders.length) cats = tl.leaders;
    }
    const items = (cats || []).filter(c => c.leaders && c.leaders[0]).slice(0, 3).map(c => {
      const l = c.leaders[0], a = l.athlete || {};
      return `<div class="gm-card">${shot(a.headshot && (a.headshot.href || a.headshot), true)}<div class="gm-ln"><b>${esc(c.shortDisplayName || c.displayName || c.name)}</b><span>${esc(a.shortName || a.displayName || '')}</span><em>${esc(l.displayValue)}</em></div></div>`;
    }).join('');
    return items ? `<div class="gm-col"><div class="gm-who">${esc(t.short)}</div>${items}</div>` : '';
  });
}

// Pregame stat leaders: fixed categories per sport, matched against the feed's leader names.
const PRE_CATS = {
  basketball: [['PTS', /^(points|pointsPerGame|avgPoints|ppg)$/i], ['REB', /^(rebounds|reboundsPerGame|avgRebounds|rpg)$/i], ['AST', /^(assists|assistsPerGame|avgAssists|apg)$/i], ['STL', /^(steals|stealsPerGame|avgSteals)$/i], ['BLK', /^(blocks|blocksPerGame|avgBlocks)$/i]],
  football: [['PASS', /^passingYards$/i], ['RUSH', /^rushingYards$/i], ['REC', /^receivingYards$/i]],
  baseball: [['AVG', /^(avg|battingAverage)$/i], ['HR', /^homeRuns$/i], ['RBI', /^(RBIs?|runsBattedIn)$/i]],
};
const sportFamily = k => (k === 'nba' || k === 'ncb') ? 'basketball' : k === 'mlb' ? 'baseball' : 'football';
function leaderValue(label, l){
  if (typeof l.value === 'number') {
    if (label === 'AVG') return l.value.toFixed(3).replace(/^0/, '');
    return Number.isInteger(l.value) ? l.value.toLocaleString() : l.value.toFixed(1);
  }
  const dv = String(l.displayValue || '');
  const m = dv.match(/^[\d.,]+/);
  return m ? m[0].replace(/,$/, '') : dv;
}
function preLeaders(g, sum){
  const cats = PRE_CATS[sportFamily(g.sport.key)];
  const pools = g.teams.map((t, side) => {
    let list = [];
    if (sum && sum.leaders) {
      const tl = sum.leaders.find(x => String(x.team && x.team.id) === String(t.id)) || sum.leaders[side];
      if (tl && tl.leaders) list = tl.leaders;
    }
    return [...list, ...(t.leaders || [])];
  });
  const rows = cats.map(([label, re]) => {
    const cells = pools.map(pool => {
      const c = pool.find(c => re.test(c.name || '') || re.test(c.abbreviation || '') || re.test(c.shortDisplayName || ''));
      const l = c && c.leaders && c.leaders[0];
      if (!l) return '<span class="none">–</span>';
      const a = l.athlete || {};
      return `<span>${esc(a.shortName || a.displayName || '')}</span> <b>${esc(leaderValue(label, l))}</b>`;
    });
    return { label, cells, has: !cells.every(c => c.includes('class="none"')) };
  });
  if (!rows.some(r => r.has)) return '';
  const heads = g.teams.map(t => `<div class="gl-h">${esc(t.short)}</div>`).join('');
  return `<div class="gm-strip">Stat Leaders</div><div class="gm-lead"><div></div>${heads}${rows.map(r => `<div class="gl-k">${r.label}</div>${r.cells.map(c => `<div class="gl-v">${c}</div>`).join('')}`).join('')}</div>`;
}
function dateWord(d){
  const diff = Math.round((dayKey(d) - dayKey(Date.now())) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
}

function gameHTML(g){
  const [a, h] = g.teams;
  const side = (t, cls) => {
    const lost = g.state === 'post' && !t.winner && g.teams.some(x => x.winner);
    const big = g.state === 'pre' ? `<span class="pre">${t.rank ? `<i>${t.rank}</i> ` : ''}${esc(t.abbr)}</span>` : `<b>${esc(t.score)}</b><span>${esc(t.abbr)}</span>`;
    return `<div class="gm-side ${cls}">${logoImg(t)}<div class="gm-num${lost ? ' lost' : ''}">${t.rank && g.state !== 'pre' ? `<small>#${t.rank}</small>` : ''}${big}${t.record ? `<small>(${esc(t.record)})</small>` : ''}</div></div>`;
  };
  let mid;
  if (g.state === 'post') mid = `<div class="gm-mid">${esc(g.detail.replace(/^Final/i, 'Final'))}</div>`;
  else if (g.state === 'in') mid = `<div class="gm-mid live">${esc(g.detail)}${g.tv ? `<small>${esc(g.tv)}</small>` : ''}</div>`;
  else mid = `<div class="gm-mid pre">${esc(dateWord(g.date))}<small>${esc(g.detail && !/^\d/.test(g.detail) && !/\d:\d\d/.test(g.detail) ? g.detail : hm(g.date))}</small></div>`;

  const sum = summaries[g.sport.key + ':' + g.id];
  const perf = g.state === 'pre' ? [] : performers(g, sum && sum.data);
  const perfHTML = perf.some(Boolean)
    ? `<div class="gm-strip">${g.state === 'pre' ? 'Season Leaders' : 'Top Performers'}</div><div class="gm-perf">${perf.map(x => x || '<div class="gm-col"></div>').join('')}</div>`
    : (sum && sum.loading ? `<div class="gm-strip">${g.state === 'pre' ? 'Season Leaders' : 'Top Performers'}</div><div class="gm-wait">Loading stats…</div>` : '');

  let info = '';
  if (g.state === 'pre') {
    const v = sum && sum.data && sum.data.gameInfo && sum.data.gameInfo.venue;
    const place = [v && v.fullName || g.venue, v && v.address ? [v.address.city, v.address.state].filter(Boolean).join(', ') : g.venueAddr].filter(Boolean).join(', ');
    const lead = preLeaders(g, sum && sum.data);
    info = (place ? `<div class="gm-venue">${esc(place)}</div>` : '')
      + (lead || (sum && sum.loading ? '<div class="gm-strip">Stat Leaders</div><div class="gm-wait">Loading stats…</div>' : ''));
  }
  const footLabel = g.state === 'post' ? 'Recap' : g.state === 'in' ? 'Live Game' : 'Preview';
  const foot = g.link && g.link !== '#' ? `<a class="gm-foot" href="${esc(g.link)}" target="_blank" rel="noopener"><div><small>Full game page</small><span>${footLabel}</span></div><i></i></a>` : '';

  return `<button class="gm-x" id="gmClose" aria-label="Close">✕</button>
    <div class="gm-in"><div class="gm-head">${side(a, 'away')}${mid}${side(h, 'home')}</div>
    ${linescoreHTML(g)}${perfHTML}${info}${foot}</div>`;
}

function renderGame(keepScroll){
  const g = openGid && findGame(openGid);
  if (!g) { closeGame(); return; }
  const prev = gm.querySelector('.gm-in'), y = keepScroll && prev ? prev.scrollTop : 0;
  let box = gm.querySelector('.gm');
  if (!box) { box = document.createElement('div'); box.className = 'gm'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); gm.appendChild(box); }
  box.className = 'gm th-' + gmTheme;
  box.setAttribute('aria-label', g.teams.map(t => t.name).join(' at '));
  box.innerHTML = gameHTML(g);
  box.querySelector('.gm-in').scrollTop = y;
  document.getElementById('gmClose').onclick = closeGame;
}

async function loadSummary(g){
  const key = g.sport.key + ':' + g.id;
  if (!summaries[key]) summaries[key] = { loading: true };
  if (state.sample[g.sport.key]) { summaries[key] = { data: SAMPLE_SUMMARY[g.id] || null }; return; }
  try {
    const r = await fetch(API + g.sport.path + '/summary?event=' + encodeURIComponent(g.id), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    summaries[key] = { data: await r.json() };
  } catch (e) { summaries[key] = { data: (summaries[key] && summaries[key].data) || null }; }
}

async function openGame(gid, theme){
  const g = findGame(gid);
  if (!g) return;
  openGid = gid; gmTheme = theme || g.sport.theme;
  gm.hidden = false; pager.style.overflowX = 'hidden';
  const key = gid;
  if (!summaries[key] || !summaries[key].data) summaries[key] = { loading: true };
  renderGame(false);
  document.getElementById('gmClose').focus({ preventScroll: true });
  await loadSummary(g);
  if (openGid === gid) renderGame(true);
  clearInterval(gmTimer);
  if (g.state === 'in') gmTimer = setInterval(async () => { const cur = findGame(gid); if (!cur || openGid !== gid) return; await loadSummary(cur); renderGame(true); }, 30000);
}
function closeGame(){
  openGid = null; clearInterval(gmTimer);
  gm.hidden = true; gm.innerHTML = ''; pager.style.overflowX = '';
}
gm.addEventListener('click', e => { if (e.target === gm) closeGame(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openGid) closeGame(); });
pager.addEventListener('click', e => {
  const tile = e.target.closest('.tile[data-gid]');
  if (!tile) return;
  e.preventDefault();
  const pg = tile.closest('.page');
  const th = pg && [...pg.classList].find(c => c.startsWith('th-'));
  openGame(tile.dataset.gid, th ? th.slice(3) : null);
});

/* ===== Data ===== */
async function loadSport(sport){
  try {
    const r = await fetch(API + sport.path + '/scoreboard' + (sport.params ? '?' + sport.params : ''), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    state.data[sport.key] = (j.events || []).map(ev => normalize(sport, ev));
    state.errors[sport.key] = false;
    state.sample[sport.key] = false;
  } catch (e) {
    if (SAMPLE[sport.key]) { state.data[sport.key] = SAMPLE[sport.key].map(ev => normalize(sport, ev)); state.sample[sport.key] = true; }
    else state.errors[sport.key] = true;
  }
  renderSport(sport);
}

async function refresh(){
  await Promise.all(SPORTS.map(loadSport));
  renderTop();
  if (openGid) renderGame(true);
  state.updated = new Date();
  document.getElementById('updated').textContent = 'Last updated ' + hm(state.updated) + '.';
  schedule();
}
let timer;
function schedule(){
  clearTimeout(timer);
  const anyLive = SPORTS.some(s => (state.data[s.key] || []).some(g => g.state === 'in'));
  timer = setTimeout(refresh, anyLive ? 30000 : 120000);
}

/* ===== Ticker ===== */
async function loadNews(){
  const res = await Promise.all(SPORTS.map(async s => {
    try {
      const r = await fetch(API + s.path + '/news?limit=5');
      const j = await r.json();
      return (j.articles || []).map(a => ({ tag: s.tag, text: a.headline })).filter(a => a.text);
    } catch (e) { return []; }
  }));
  const mixed = [];
  for (let i = 0; i < 5; i++) res.forEach(list => list[i] && mixed.push(list[i]));
  state.news = mixed.length ? mixed : SAMPLE_NEWS;
}
const CRAWL_SPEED = 50;   // pixels per second while crawling
const SLIDE_MS = 380;      // rise-in and lift-out duration
const HOLD_START = 1600;   // pause after a headline rises in
const HOLD_END = 1300;      // pause once the end of the headline is showing
const PAD = 10;
let tickIdx = 0, crawl = null;
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
function nextTick(){
  const lab = document.getElementById('tickLab'), txt = document.getElementById('tickTxt');
  if (!state.news.length) { setTimeout(nextTick, 3000); return; }
  const item = state.news[tickIdx++ % state.news.length];
  lab.textContent = item.tag; txt.textContent = item.text;
  const railW = txt.parentElement.clientWidth, h = txt.parentElement.clientHeight;
  crawl = { phase:'in', t0:null, x: PAD, y: h, h, endX: Math.min(PAD, railW - txt.scrollWidth - PAD), last:null };
}
function crawlFrame(ts){
  const txt = document.getElementById('tickTxt');
  const c = crawl;
  if (c) {
    if (c.t0 == null) c.t0 = ts;
    const el = ts - c.t0, dt = c.last == null ? 0 : Math.min(ts - c.last, 100);
    c.last = ts;
    if (c.phase === 'in') { const k = Math.min(el / SLIDE_MS, 1); c.y = c.h * (1 - ease(k)); if (k === 1) { c.phase = 'hold'; c.t0 = ts; } }
    else if (c.phase === 'hold') { if (el >= HOLD_START) { c.phase = 'crawl'; c.t0 = ts; } }
    else if (c.phase === 'crawl') { c.x = Math.max(c.endX, c.x - CRAWL_SPEED * dt / 1000); if (c.x <= c.endX) { c.phase = 'hold2'; c.t0 = ts; } }
    else if (c.phase === 'hold2') { if (el >= HOLD_END) { c.phase = 'out'; c.t0 = ts; } }
    else if (c.phase === 'out') { const k = Math.min(el / SLIDE_MS, 1); c.y = -c.h * ease(k); if (k === 1) { crawl = null; nextTick(); } }
    txt.style.transform = `translate3d(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px,0)`;
  }
  requestAnimationFrame(crawlFrame);
}
requestAnimationFrame(crawlFrame);

/* ===== Settings, icon ===== */

const sheet = document.getElementById('sheet');
document.getElementById('gear').onclick = () => { sheet.hidden = false; document.getElementById('closeBtn').focus(); };
document.getElementById('closeBtn').onclick = () => sheet.hidden = true;
sheet.onclick = e => { if (e.target === sheet) sheet.hidden = true; };
document.getElementById('refreshBtn').onclick = () => { sheet.hidden = true; refresh(); loadNews(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

refresh();
loadNews().then(nextTick);
</script>
</body>
