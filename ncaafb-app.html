<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESPN CFB">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>ESPN College Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e7e7; --card:#fff; --line:#cfcfcf; --soft:#dedede;
  --ink:#1f1f1f; --ink2:#555; --ink3:#8a8a8a; --live:#c8102e; --red:#d0021b;
  --drawer:260px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;left:0;bottom:0;width:var(--drawer);background:linear-gradient(90deg,#1d1d1d,#262626);color:#ddd;
  padding-top:env(safe-area-inset-top);overflow-y:auto;z-index:1}
#drawer h4{font:700 11px "Helvetica Neue",Arial;letter-spacing:.6px;text-transform:uppercase;color:#8d8d8d;
  padding:16px 16px 6px;border-bottom:1px solid #111;box-shadow:0 1px 0 #333}
#drawer .di{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;font-size:16px;font-weight:700;
  color:#e8e8e8;text-shadow:0 -1px 0 #000;border-bottom:1px solid #111;box-shadow:0 1px 0 #333;width:100%;text-align:left}
#drawer .di:active,#drawer .di.on{background:linear-gradient(#3a3a3a,#2c2c2c)}
#drawer .di small{font-size:12px;font-weight:400;color:#999}
#drawer .brand{padding:18px 16px 14px;font:700 26px Oswald,Impact,sans-serif;letter-spacing:.5px;color:#fff;text-transform:uppercase}
#drawer .brand span{background:var(--red);padding:0 6px;margin-right:6px;font-style:italic;display:inline-block;transform:skewX(-8deg)}

/* ---------- app shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:2;
  transition:transform .28s ease;box-shadow:-3px 0 10px rgba(0,0,0,.6)}
body.drawer-open #app{transform:translateX(var(--drawer))}
#scrim{position:absolute;inset:0;z-index:50;display:none}
body.drawer-open #scrim{display:block}

/* nav bar */
#nav{flex:none;padding-top:env(safe-area-inset-top);background:linear-gradient(#4b4b4b 0%,#2a2a2a 48%,#141414 52%,#0b0b0b 100%);
  border-bottom:1px solid #000;position:relative}
#nav .bar{height:46px;display:flex;align-items:center;justify-content:center;position:relative}
#burger{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:44px;height:40px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
#burger i{display:block;width:23px;height:3px;background:#fff;border-radius:1px;box-shadow:0 -1px 0 rgba(0,0,0,.6)}
.seg{display:flex;width:206px;height:31px;border:1px solid #000;border-radius:6px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.1)}
.seg button{flex:1;font-size:14px;font-weight:700;color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.7);
  background:linear-gradient(#6b6b6b,#454545 50%,#3a3a3a 51%,#333);border-left:1px solid #000}
.seg button:first-child{border-left:0}
.seg button.on{background:linear-gradient(#141414,#262626);box-shadow:inset 0 2px 4px rgba(0,0,0,.9)}

/* big tab band */
#band{flex:none;position:relative;height:48px;background:linear-gradient(#2a2a2a,#050505 60%,#000);overflow:hidden}
#band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#4a3a10,#e8b923 40%,#ffd75a 50%,#e8b923 60%,#4a3a10);box-shadow:0 0 10px 2px rgba(255,190,30,.55)}
#tabs{display:flex;height:100%;overflow-x:auto;scrollbar-width:none;padding:0 10px;scroll-behavior:smooth}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;font:700 27px/48px Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.3px;
  color:#8b8b8b;padding:0 10px;white-space:nowrap;text-shadow:0 2px 2px #000;transform:scaleY(1.04)}
#tabs button.on{color:#fff;text-shadow:0 0 12px rgba(255,210,90,.35),0 2px 2px #000}
body.stream #band{display:none}

/* content */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:16px}

/* pickers */
.pickers{display:flex;gap:0;padding:14px 10px 4px}
.pk{flex:1;position:relative;height:35px;background:linear-gradient(#fff,#f1f1f1);border:1px solid #c3c3c3;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:14px;font-weight:700;color:#4a4a4a;
  text-transform:uppercase;box-shadow:0 1px 0 rgba(255,255,255,.8)}
.pk + .pk{border-left:0}
.pk::after{content:"";border:6px solid transparent;border-top:7px solid #6d6d6d;margin-top:6px;flex:none}
.pk select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;-webkit-appearance:none;appearance:none}
.pk span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pk.btn::after{display:none}

/* date header */
.dh{margin:14px 10px 0;padding:9px 12px;background:linear-gradient(#d6d6d6,#cbcbcb);border:1px solid #bdbdbd;
  font-size:12px;font-weight:700;color:#5b5b5b;text-transform:uppercase;letter-spacing:.2px;text-shadow:0 1px 0 rgba(255,255,255,.6)}

/* game card */
.gc{display:block;margin:14px 10px 0;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dh + .gc{margin-top:14px}
.venue{padding:10px 12px 0;font-size:13px;font-weight:700;color:#8f8f8f;text-transform:uppercase;letter-spacing:.2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:7px 12px 4px;font-size:14px;font-weight:700;color:#333}
.top .st.live{color:var(--live)}
.top .net{display:flex;align-items:center;gap:6px}
.wesp{display:inline-flex;border:1px solid #444;border-radius:2px;overflow:hidden;font:700 8px/1 Arial,sans-serif;letter-spacing:.4px}
.wesp b{padding:2px 2px 2px 3px;background:#fff;color:#222}
.wesp i{padding:2px 3px;background:#2a2a2a;color:#fff;font-style:italic;text-transform:lowercase;font-size:9px;letter-spacing:0}
.tm{display:flex;align-items:center;padding:4px 12px;gap:10px}
.tm img{width:27px;height:27px;object-fit:contain;flex:none}
.tm .ph{width:27px;height:27px;flex:none;border-radius:50%;background:#e2e2e2}
.tm .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .rk{font-size:14px;color:#555;margin-right:4px}
.tm .nm{font-size:17px;font-weight:700;color:#202020;text-transform:uppercase;letter-spacing:-.1px}
.tm .rec{font-size:16px;color:#4a4a4a;margin-left:5px}
.tm .sc{font-size:20px;font-weight:700;color:#202020;min-width:30px;text-align:right;flex:none}
.tm.lose .nm,.tm.lose .sc{color:#8d8d8d}
.tm .pos{display:inline-block;width:0;height:0;border:5px solid transparent;border-right:6px solid #202020;margin-left:4px;vertical-align:1px}
.pv{display:block;margin-top:8px;border-top:1px solid #d9d9d9;padding:11px 12px 30px;font-size:13px;color:#222}
.pv:active{background:#f3f3f3}

/* classic (fall 2012) layout */
body.classic .venue{display:none}
body.classic .tm{padding:10px 12px;border-top:1px solid #e3e3e3}
body.classic .top + .tm{border-top:0}
body.classic .tm img,body.classic .tm .ph{width:38px;height:38px}
body.classic .tm .txt{white-space:normal}
body.classic .tm .rec{display:block;margin:2px 0 0;font-size:15px;color:#666}
body.classic .tm .nm{font-size:18px}
body.classic .pv{margin-top:0;padding:12px 12px 42px}

/* states */
.msg{margin:30px 20px;text-align:center;color:#777;font-size:14px;line-height:1.45;text-shadow:0 1px 0 #fff}
.msg b{display:block;color:#444;font-size:16px;margin-bottom:6px}
.cta{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:5px;border:1px solid #8a0010;color:#fff;font-weight:700;
  background:linear-gradient(#e2324a,#b30018);text-shadow:0 -1px 0 rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.spin{width:26px;height:26px;margin:40px auto;border-radius:50%;border:3px solid #c9c9c9;border-top-color:#666;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.upd{text-align:center;font-size:11px;color:#999;margin:16px 0 4px;text-shadow:0 1px 0 #fff}

/* stream */
.sh{display:flex;gap:10px;margin:10px 10px 0;padding:10px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sh:first-child{margin-top:12px}
.sh img{width:88px;height:62px;object-fit:cover;flex:none;background:#ddd}
.sh h3{font-size:14px;line-height:1.25;color:#1d1d1d}
.sh p{font-size:12px;line-height:1.3;color:#666;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh time{display:block;font-size:11px;color:var(--red);font-weight:700;margin-top:4px;text-transform:uppercase}

/* bottom banner */
#banner{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px env(safe-area-inset-bottom);
  height:calc(52px + env(safe-area-inset-bottom));background:linear-gradient(#3a3a3a,#141414 50%,#000);border-top:1px solid #555}
#banner .l{display:flex;align-items:center;gap:4px;font:700 26px/1 Oswald,Impact,sans-serif;color:#fff;text-transform:uppercase;font-style:italic;transform:skewX(-10deg)}
#banner .l em{font-style:normal;background:linear-gradient(#ef2b39,#b5000f);padding:2px 6px 3px;border-radius:2px}
#banner .r{display:flex;align-items:center;gap:8px}
#banner .r span{font:700 15px/1.05 Oswald,Impact,sans-serif;color:#fff;text-transform:uppercase;text-align:right;transform:skewX(-10deg)}
#banner .r i{width:24px;height:34px;border-radius:3px;background:linear-gradient(#ef2b39,#b5000f);position:relative}
#banner .r i::after{content:"";position:absolute;left:9px;top:11px;border:6px solid transparent;border-left:8px solid #fff;border-right:0}

/* team picker modal */
#modal{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease}
#modal.open{transform:none}
#modal .mbar{flex:none;padding-top:env(safe-area-inset-top);background:linear-gradient(#4b4b4b,#2a2a2a 48%,#141414 52%,#0b0b0b);border-bottom:1px solid #000}
#modal .mbar div{height:46px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;font-weight:700;font-size:18px;text-shadow:0 -1px 0 #000}
#modal .done{position:absolute;right:8px;top:8px;height:30px;padding:0 12px;border-radius:5px;border:1px solid #000;font-size:13px;font-weight:700;
  background:linear-gradient(#e2324a,#b30018);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 rgba(255,255,255,.12)}
#modal .srch{flex:none;padding:8px;background:linear-gradient(#cdd4dc,#a9b3bf);border-bottom:1px solid #8b96a3}
#modal .srch input{width:100%;height:30px;border-radius:15px;border:1px solid #8b96a3;padding:0 14px;font-size:16px;-webkit-user-select:text;user-select:text;outline:none}
#mlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff}
.tr{display:flex;align-items:center;gap:12px;padding:0 14px;height:48px;border-bottom:1px solid #e0e0e0;width:100%;text-align:left;font-size:16px;font-weight:700}
.tr img{width:28px;height:28px;object-fit:contain}
.tr span{flex:1}
.tr.on::after{content:"\2713";color:#385487;font-size:20px}
</style>
</head>

<nav id="drawer" aria-label="Menu">

<script>
(() => {
const API = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football';
const CONFS = [['top25','Top 25'],['80','All FBS'],['1','ACC'],['151','American'],['4','Big 12'],['5','Big Ten'],['12','C-USA'],
  ['18','Independents'],['15','MAC'],['17','Mountain West'],['9','Pac-12'],['8','SEC'],['37','Sun Belt']];
const CONF_SHORT = {1:'ACC',151:'AAC',4:'Big 12',5:'Big Ten',12:'C-USA',18:'Ind.',15:'MAC',17:'MWC',9:'Pac-12',8:'SEC',37:'Sun Belt'};
const TABS = ['top','all','my'];

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  view: 'scores',
  tab: store.get('cfb.tab', 'all'),
  conf: store.get('cfb.conf', 'top25'),
  layout: store.get('cfb.layout', 'compact'),
  my: store.get('cfb.my', []),
  weeks: [], weekKey: null, season: null,
  cache: {}, timer: null, token: 0
};
if (!TABS.includes(S.tab)) S.tab = 'all';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const content = $('#content');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- data ---------------- */
async function getJSON(url, fresh){
  const hit = S.cache[url];
  if (!fresh && hit && Date.now() - hit.t < 25000) return hit.d;
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  S.cache[url] = {t: Date.now(), d};
  return d;
}
function sbURL(group){
  const w = S.weeks.find(x => x.key === S.weekKey);
  let u = `${API}/scoreboard?limit=300&groups=${group}`;
  if (w) u += `&seasontype=${w.st}&week=${w.wk}`;
  if (S.season) u += `&dates=${S.season}`;
  return u;
}
function parseCalendar(d){
  const out = [];
  (d.leagues?.[0]?.calendar || []).forEach(sec => {
    if (!sec || typeof sec !== 'object') return;
    (sec.entries || []).forEach(e => {
      if (sec.value === '1' || sec.value === '4') return; // skip preseason / off-season
      out.push({key: sec.value + '-' + e.value, st: sec.value, wk: e.value, label: e.label || ('Week ' + e.value), end: e.endDate});
    });
  });
  return out;
}

/* ---------------- helpers ---------------- */
const rankOf = c => { const r = c?.curatedRank?.current; return r >= 1 && r <= 25 ? r : null; };
const sides = e => {
  const cs = e.competitions?.[0]?.competitors || [];
  return { away: cs.find(c => c.homeAway === 'away') || cs[1], home: cs.find(c => c.homeAway === 'home') || cs[0] };
};
const netOf = comp => comp.broadcasts?.[0]?.names?.[0] || comp.geoBroadcasts?.[0]?.media?.shortName || '';
const isWatch = n => /ESPN|ABC|SEC ?N|ACCN|LHN/i.test(n);
const teamName = t => (t.location || t.shortDisplayName || t.displayName || t.abbreviation || '').toUpperCase();

function recordText(c){
  const recs = c.records || [];
  const tot = (recs.find(r => r.type === 'total' || r.name === 'overall') || recs[0] || {}).summary;
  const conf = (recs.find(r => r.type === 'vsconf') || {}).summary;
  if (!tot) return '';
  if (!conf) return tot;
  if (S.layout === 'classic') {
    const cn = CONF_SHORT[c.team?.conferenceId];
    return `${tot} (${conf}${cn ? ' ' + cn : ''})`;
  }
  return `${tot} (${conf})`;
}
function isTopGame(e){
  const {away, home} = sides(e);
  const ra = rankOf(away), rh = rankOf(home);
  const net = netOf(e.competitions[0]);
  if (ra && rh) return true;
  if ((ra && ra <= 10) || (rh && rh <= 10)) return true;
  if ((ra || rh) && /^(ABC|CBS|FOX|NBC|ESPN)$/.test(net)) return true;
  return false;
}
const dateKey = d => d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
const timeStr = d => d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return Math.max(m, 1) + ' min ago';
  if (m < 1440) return Math.round(m / 60) + ' hr ago';
  return new Date(iso).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

/* ---------------- rendering ---------------- */
function teamRow(c, state, possId){
  const t = c.team || {};
  const logo = t.logo || t.logos?.[0]?.href;
  const rk = rankOf(c);
  const showScore = state !== 'pre' && c.score != null;
  const lose = state === 'post' && c.winner === false;
  const rec = recordText(c);
  return `<div class="tm${lose ? ' lose' : ''}">
    ${logo ? `<img src="${esc(logo)}" alt="" loading="lazy">` : '<div class="ph"></div>'}
    <div class="txt">${rk ? `<span class="rk">${rk}</span>` : ''}<span class="nm">${esc(teamName(t))}</span>${rec ? `<span class="rec">${esc(rec)}</span>` : ''}</div>
    ${showScore ? `<span class="sc">${esc(c.score)}${state === 'in' && possId && possId === t.id ? '<i class="pos"></i>' : ''}</span>` : ''}
  </div>`;
}
function card(e){
  const comp = e.competitions[0];
  const st = comp.status || e.status;
  const state = st?.type?.state || 'pre';
  const {away, home} = sides(e);
  const d = new Date(e.date);
  let status, cls = '';
  if (state === 'pre') {
    status = comp.timeValid === false || /TBD|TBA/i.test(st.type.shortDetail || '') ? 'TBA' : timeStr(d);
    if (/postponed|canceled|cancelled/i.test(st.type.description || '')) status = st.type.description.toUpperCase();
  } else if (state === 'in') {
    status = (st.type.shortDetail || '').replace(/\s*-\s*/, ' ').toUpperCase(); cls = ' live';
  } else {
    status = (st.type.shortDetail || 'Final').toUpperCase();
  }
  const net = netOf(comp);
  const venue = comp.venue?.fullName;
  const label = state === 'pre' ? 'Preview' : state === 'in' ? 'Gamecast' : 'Recap';
  const href = (e.links || []).find(l => (l.rel || []).includes('summary'))?.href
            || `https://www.espn.com/college-football/game/_/gameId/${e.id}`;
  const possId = comp.situation?.possession;
  const loc = t => t?.team?.location || t?.team?.shortDisplayName || '';
  return `<div class="gc">
    ${venue ? `<div class="venue">${esc(venue)}</div>` : ''}
    <div class="top"><span class="st${cls}">${esc(status)}</span>
      <span class="net">${esc(net)}${isWatch(net) ? '<span class="wesp"><b>WATCH</b><i>espn</i></span>' : ''}</span></div>
    ${teamRow(away, state, possId)}
    ${teamRow(home, state, possId)}
    <a class="pv" href="${esc(href)}" target="_blank" rel="noopener">${esc(loc(away))}-${esc(loc(home))} ${label}</a>
  </div>`;
}
function renderGames(evs){
  if (!evs.length) return '';
  evs.sort((a, b) => new Date(a.date) - new Date(b.date));
  let html = '', last = '';
  evs.forEach(e => {
    const k = dateKey(new Date(e.date));
    if (k !== last) { html += `<div class="dh">${esc(k)}</div>`; last = k; }
    html += card(e);
  });
  return html;
}
function pickersHTML(){
  const weekOpts = S.weeks.map(w => `<option value="${w.key}"${w.key === S.weekKey ? ' selected' : ''}>${esc(w.label)}</option>`).join('');
  const wLabel = (S.weeks.find(w => w.key === S.weekKey) || {}).label || 'Week';
  let right = '';
  if (S.tab === 'all') {
    const cl = (CONFS.find(c => c[0] === S.conf) || CONFS[0])[1];
    right = `<label class="pk"><span>${esc(cl)}</span><select id="confSel">${CONFS.map(c => `<option value="${c[0]}"${c[0] === S.conf ? ' selected' : ''}>${c[1]}</option>`).join('')}</select></label>`;
  } else if (S.tab === 'my') {
    right = `<button class="pk btn" id="editMy"><span>Edit Teams</span><span>+</span></button>`;
  }
  return `<div class="pickers"><label class="pk"><span>${esc(wLabel)}</span><select id="weekSel">${weekOpts}</select></label>${right}</div>`;
}

async function renderScores(silent){
  clearTimeout(S.timer);
  const token = ++S.token;
  const tab = S.tab;
  if (tab === 'my' && !S.my.length) {
    content.innerHTML = `<div class="msg"><b>Follow your teams</b>Pick the schools you care about and their games will show up here every week.<br><button class="cta" id="addMy">Choose Teams</button></div>`;
    return;
  }
  if (!silent) content.innerHTML = pickersHTML() + '<div id="list"><div class="spin"></div></div>';
  const group = tab === 'all' && S.conf !== 'top25' ? S.conf : '80';
  try {
    const d = await getJSON(sbURL(group), silent);
    if (token !== S.token) return;
    let evs = (d.events || []).filter(e => e.competitions?.[0]);
    if (tab === 'all' && S.conf === 'top25') evs = evs.filter(e => { const s = sides(e); return rankOf(s.away) || rankOf(s.home); });
    if (tab === 'top') evs = evs.filter(isTopGame);
    if (tab === 'my') {
      const ids = new Set(S.my.map(t => String(t.id)));
      evs = evs.filter(e => { const s = sides(e); return ids.has(String(s.away?.team?.id)) || ids.has(String(s.home?.team?.id)); });
    }
    const list = $('#list'); if (!list) return;
    const y = content.scrollTop;
    const empty = tab === 'my' ? '<div class="msg"><b>No games</b>None of your teams play this week.</div>'
                               : '<div class="msg"><b>No games</b>There are no games scheduled for this selection.</div>';
    list.innerHTML = (renderGames(evs) || empty) + `<div class="upd">Updated ${timeStr(new Date())}</div>`;
    if (silent) content.scrollTop = y;
    const live = evs.some(e => (e.competitions[0].status || e.status)?.type?.state === 'in');
    S.timer = setTimeout(() => { if (S.view === 'scores' && !document.hidden) renderScores(true); }, live ? 30000 : 120000);
  } catch (err) {
    if (token !== S.token) return;
    const list = $('#list');
    if (list && !silent) list.innerHTML = `<div class="msg"><b>Unable to load scores</b>Check your connection and try again.<br><button class="cta" id="retry">Retry</button></div>`;
  }
}

async function renderStream(){
  clearTimeout(S.timer);
  const token = ++S.token;
  content.innerHTML = '<div class="spin"></div>';
  try {
    const d = await getJSON(`${API}/news?limit=40`);
    if (token !== S.token) return;
    const arts = (d.articles || []).filter(a => a.headline);
    content.innerHTML = arts.map(a => {
      const img = a.images?.[0]?.url;
      const href = a.links?.web?.href || a.links?.mobile?.href || '#';
      return `<a class="sh" href="${esc(href)}" target="_blank" rel="noopener">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ''}
        <div><h3>${esc(a.headline)}</h3>${a.description ? `<p>${esc(a.description)}</p>` : ''}${a.published ? `<time>${esc(ago(a.published))}</time>` : ''}</div>
      </a>`;
    }).join('') || '<div class="msg"><b>No stories</b>Check back soon.</div>';
  } catch (e) {
    if (token !== S.token) return;
    content.innerHTML = `<div class="msg"><b>Unable to load Stream</b>Check your connection and try again.<br><button class="cta" id="retry">Retry</button></div>`;
  }
}

function render(){
  document.body.classList.toggle('stream', S.view === 'stream');
  document.body.classList.toggle('classic', S.layout === 'classic');
  $$('.seg button').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $$('#drawer [data-layout]').forEach(b => b.classList.toggle('on', b.dataset.layout === S.layout));
  $('#myCount').textContent = S.my.length ? S.my.length : '';
  content.scrollTop = 0;
  if (S.view === 'stream') renderStream(); else { centerTab(); renderScores(); }
}
function centerTab(){
  const tabs = $('#tabs'), on = tabs.querySelector('.on');
  if (on) tabs.scrollLeft = on.offsetLeft - (tabs.clientWidth - on.offsetWidth) / 2;
}
function setTab(t){ if (t === S.tab) return; S.tab = t; store.set('cfb.tab', t); render(); }

/* ---------------- team picker ---------------- */
let allTeams = null;
async function openPicker(){
  closeDrawer();
  const m = $('#modal'), list = $('#mlist'), input = m.querySelector('input');
  m.classList.add('open'); m.setAttribute('aria-hidden', 'false'); input.value = '';
  if (!allTeams) {
    list.innerHTML = '<div class="spin"></div>';
    let teams = [];
    try {
      const d = await getJSON(`${API}/teams?groups=80&limit=300`);
      teams = (d.sports?.[0]?.leagues?.[0]?.teams || []).map(x => x.team);
    } catch (e) {}
    if (teams.length < 60) { // fall back to every team seen in an FBS scoreboard
      try {
        const d = await getJSON(sbURL('80'));
        const seen = {};
        (d.events || []).forEach(e => (e.competitions?.[0]?.competitors || []).forEach(c => { seen[c.team.id] = c.team; }));
        teams = Object.values(seen);
      } catch (e) {}
    }
    allTeams = teams.map(t => ({id: String(t.id), name: t.location || t.displayName, full: t.displayName || '', logo: t.logo || t.logos?.[0]?.href || ''}))
                    .sort((a, b) => a.name.localeCompare(b.name));
  }
  drawPicker('');
}
function drawPicker(q){
  const mine = new Set(S.my.map(t => String(t.id)));
  q = q.trim().toLowerCase();
  const rows = allTeams.filter(t => !q || (t.name + ' ' + t.full).toLowerCase().includes(q));
  $('#mlist').innerHTML = rows.map(t => `<button class="tr${mine.has(t.id) ? ' on' : ''}" data-id="${t.id}">
    ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ''}<span>${esc(t.name)}</span></button>`).join('')
    || '<div class="msg">No teams found.</div>';
}
function closePicker(){
  const m = $('#modal'); m.classList.remove('open'); m.setAttribute('aria-hidden', 'true');
  document.activeElement?.blur?.();
  if (S.view === 'scores') { S.tab = 'my'; store.set('cfb.tab', 'my'); }
  render();
}

/* ---------------- drawer ---------------- */
const closeDrawer = () => document.body.classList.remove('drawer-open');

/* ---------------- events ---------------- */
$('#burger').addEventListener('click', () => document.body.classList.toggle('drawer-open'));
$('#scrim').addEventListener('click', closeDrawer);
$$('.seg button').forEach(b => b.addEventListener('click', () => { if (S.view !== b.dataset.view) { S.view = b.dataset.view; render(); } }));
$$('#tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#drawer').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go === 'myteams') return openPicker();
  if (b.dataset.go) { S.view = b.dataset.go; closeDrawer(); render(); }
  if (b.dataset.layout) { S.layout = b.dataset.layout; store.set('cfb.layout', S.layout); closeDrawer(); render(); }
});
content.addEventListener('change', e => {
  if (e.target.id === 'weekSel') { S.weekKey = e.target.value; render(); }
  if (e.target.id === 'confSel') { S.conf = e.target.value; store.set('cfb.conf', S.conf); render(); }
});
content.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'retry') render();
  if (t.id === 'addMy' || t.id === 'editMy') openPicker();
});
$('#modal .done').addEventListener('click', closePicker);
$('#modal input').addEventListener('input', e => drawPicker(e.target.value));
$('#mlist').addEventListener('click', e => {
  const b = e.target.closest('.tr'); if (!b) return;
  const id = b.dataset.id, i = S.my.findIndex(t => String(t.id) === id);
  if (i >= 0) S.my.splice(i, 1);
  else { const t = allTeams.find(x => x.id === id); S.my.push({id, name: t.name, logo: t.logo}); }
  store.set('cfb.my', S.my);
  b.classList.toggle('on');
});

// swipe between Top / All / My, like the original app's paging
let sx = 0, sy = 0, st = 0;
content.addEventListener('touchstart', e => { const p = e.touches[0]; sx = p.clientX; sy = p.clientY; st = Date.now(); }, {passive:true});
content.addEventListener('touchend', e => {
  if (S.view !== 'scores' || document.body.classList.contains('drawer-open')) return;
  const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st < 600) {
    const i = TABS.indexOf(S.tab) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < TABS.length) setTab(TABS[i]);
  }
}, {passive:true});

document.addEventListener('visibilitychange', () => { if (!document.hidden && S.view === 'scores' && S.weeks.length) renderScores(true); });

/* ---------------- home-screen icon ---------------- */
function makeIcon(){
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 180); g.addColorStop(0, '#3a3a3a'); g.addColorStop(.5, '#111'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, 180, 180);
  x.fillStyle = '#d0021b'; x.fillRect(0, 118, 180, 30);
  x.fillStyle = '#e8b923'; x.fillRect(0, 148, 180, 4);
  x.fillStyle = '#fff'; x.textAlign = 'center';
  x.font = 'italic 700 64px Oswald, Impact, sans-serif'; x.fillText('CFB', 90, 98);
  x.font = '700 22px Oswald, Impact, sans-serif'; x.fillText('SCORES', 90, 142);
  const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
  document.head.appendChild(l);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(makeIcon);

/* ---------------- boot ---------------- */
async function boot(){
  content.innerHTML = '<div class="spin"></div>';
  document.body.classList.toggle('classic', S.layout === 'classic');
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  try {
    const url = `${API}/scoreboard?limit=300&groups=80`;
    const d = await getJSON(url);
    S.weeks = parseCalendar(d);
    S.season = d.season?.year || null;
    const cur = `${d.season?.type}-${d.week?.number}`;
    S.weekKey = S.weeks.some(w => w.key === cur) ? cur
              : (S.weeks.find(w => w.end && new Date(w.end) > new Date()) || S.weeks[S.weeks.length - 1] || {}).key || null;
    if (S.weekKey === cur) S.cache[sbURL('80')] = S.cache[url]; // reuse the first response
  } catch (e) {}
  document.body.classList.remove('loading');
  render();
}
boot();
})();
</script>
